<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>虫虫研究所</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0e14;--bg2:#0d1219;--line:#222b37;--line2:#2f3a48;--text:#e6edf3;--dim:#7d8590;--accent:#58a6ff;--gold:#f0b72f;--green:#3fb950;--purple:#a371f7;--red:#f85149;--orange:#f0883e;--ease:cubic-bezier(.34,1.56,.64,1);--ease2:cubic-bezier(.4,0,.2,1)}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:radial-gradient(ellipse 90% 60% at 50% -10%,rgba(88,166,255,.09),transparent 60%),radial-gradient(ellipse 70% 50% at 90% 110%,rgba(163,113,247,.07),transparent 60%),var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;user-select:none}
.app{max-width:720px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:78px}

.hud{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:6px;padding:10px 12px;background:rgba(10,14,20,.9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,.06);transition:padding .3s var(--ease2)}
.hud-logo{font-size:18px;line-height:1;margin-right:2px;transition:transform .4s var(--ease)}
.hud-logo:active{transform:rotate(20deg) scale(.9)}
.hud-stat{display:flex;align-items:center;gap:4px;padding:5px 9px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.05);font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;transition:transform .25s var(--ease),background .25s}
.hud-stat:active{transform:scale(.94)}
.hud-stat i{font-style:normal;font-size:11px}
.hud-stat.gold b{color:var(--gold)}
.hud-stat.low b{color:var(--red)}
.hud-stat b{font-weight:700;transition:color .3s}
.hud-spacer{flex:1}
.hud-btn{padding:6px 12px;border-radius:9px;border:1px solid var(--line2);background:linear-gradient(180deg,#1d2a38,#151e28);color:var(--text);font-size:11.5px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s var(--ease);white-space:nowrap}
.hud-btn:hover{border-color:var(--accent)}
.hud-btn:active{transform:scale(.94)}

main{padding:12px 12px 20px}

/* 难度选择 */
.diff-screen{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(88,166,255,.15),transparent 60%),radial-gradient(ellipse 60% 50% at 80% 110%,rgba(163,113,247,.1),transparent 60%),var(--bg);padding:30px;text-align:center;animation:fadeIn .5s ease}
@keyframes fadeIn{from{opacity:0}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-24px)}}
.diff-title{font-size:28px;font-weight:800;letter-spacing:3px;margin-bottom:8px;background:linear-gradient(180deg,#fff 30%,#7d8590);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:slideDown .6s var(--ease) both}
.diff-sub{font-size:12px;color:var(--dim);margin-bottom:36px;letter-spacing:1px;animation:slideDown .6s var(--ease) .1s both}
.diff-options{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px}
.diff-btn{padding:16px 18px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(135deg,rgba(255,255,255,.035),rgba(255,255,255,.015));color:var(--text);font-family:inherit;cursor:pointer;text-align:left;transition:all .3s var(--ease);position:relative;overflow:hidden;animation:slideUp .6s var(--ease) both}
.diff-btn:nth-child(1){animation-delay:.15s}
.diff-btn:nth-child(2){animation-delay:.2s}
.diff-btn:nth-child(3){animation-delay:.25s}
.diff-btn::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at var(--x,50%) var(--y,50%),rgba(88,166,255,.15),transparent 60%);opacity:0;transition:opacity .3s}
.diff-btn:hover::before{opacity:1}
.diff-btn:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 12px 32px -8px rgba(88,166,255,.3)}
.diff-btn:active{transform:translateY(-1px) scale(.98)}
.diff-btn .dn{font-size:15px;font-weight:700;margin-bottom:4px}
.diff-btn .dd{font-size:11px;color:var(--dim);line-height:1.5}
.diff-btn .dm{font-size:10px;color:var(--gold);margin-top:5px;letter-spacing:.5px}

/* 教程 */
.tut-overlay{position:fixed;inset:0;z-index:400;background:rgba(4,6,9,.85);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px}
.tut-overlay.open{display:flex;animation:fadeIn .3s ease}
.tut-box{width:100%;max-width:420px;background:linear-gradient(180deg,#1a2230,#111720);border:1px solid var(--line2);border-radius:22px;padding:26px;box-shadow:0 24px 64px rgba(0,0,0,.85);animation:slideUp .35s var(--ease)}
.tut-dots{display:flex;gap:6px;justify-content:center;margin-bottom:20px}
.tut-dot{width:6px;height:6px;border-radius:50%;background:#2a3441;transition:all .35s var(--ease)}
.tut-dot.on{background:var(--accent);width:22px;border-radius:3px;box-shadow:0 0 12px rgba(88,166,255,.5)}
.tut-step{font-size:10px;color:var(--dim);letter-spacing:1.5px;margin-bottom:8px}
.tut-title{font-size:18px;font-weight:700;margin-bottom:12px}
.tut-text{font-size:13px;color:#b1bac4;line-height:1.9;margin-bottom:22px}
.tut-actions{display:flex;gap:8px}
.tut-actions button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .2s var(--ease)}
.tut-actions button:hover{background:rgba(255,255,255,.07)}
.tut-actions button.primary{background:linear-gradient(135deg,rgba(88,166,255,.25),rgba(88,166,255,.12));border-color:rgba(88,166,255,.55);color:var(--accent)}
.tut-actions button.primary:hover{background:linear-gradient(135deg,rgba(88,166,255,.35),rgba(88,166,255,.2))}
.tut-actions button:active{transform:scale(.97)}

/* 虫缸 */
.zone{background:linear-gradient(180deg,rgba(28,36,48,.75),rgba(21,27,36,.88));border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;animation:slideUp .4s var(--ease) both}
.zone:nth-child(1){animation-delay:.05s}
.zone:nth-child(2){animation-delay:.1s}
.zone:nth-child(3){animation-delay:.15s}
.zone-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.zone-title{font-size:14px;font-weight:700;letter-spacing:.5px}
.zone-tier{font-size:10px;color:var(--dim)}
.zone-spacer{flex:1}
.zone-cap{font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.env-bar{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.env-chip{display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);font-size:10.5px;color:var(--dim);cursor:pointer;transition:all .2s var(--ease);font-family:inherit}
.env-chip:hover{border-color:var(--line2);color:var(--text);transform:translateY(-1px)}
.env-chip:active{transform:scale(.95)}
.env-chip b{color:var(--text);font-weight:700}
.env-chip.bad{border-color:rgba(248,81,73,.5)}
.env-chip.bad b{color:var(--red)}

.tank{position:relative;width:100%;height:200px;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.07);box-shadow:inset 0 10px 30px rgba(0,0,0,.65),inset 0 -6px 20px rgba(0,0,0,.5);transition:box-shadow .4s}
.tank::after{content:'';position:absolute;top:0;left:0;right:0;height:36%;background:linear-gradient(180deg,rgba(255,255,255,.05),transparent);pointer-events:none;border-radius:16px 16px 0 0}

.bug{position:absolute;left:0;top:0;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;will-change:transform;padding:2px;transition:border-color .4s,box-shadow .4s,filter .2s}
.bug:hover{filter:brightness(1.15)}
.bug span{display:block;width:84%;text-align:center;line-height:1.05;font-weight:700;letter-spacing:-.3px;word-break:break-all;pointer-events:none;transition:color .4s}
@keyframes flash{0%{filter:brightness(1)}30%{filter:brightness(2.4)}100%{filter:brightness(1)}}
.bug.flash{animation:flash .9s ease}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,183,47,0)}50%{box-shadow:0 0 18px 3px rgba(240,183,47,.5)}}
.bug.mature{animation:pulse 2.2s ease-in-out infinite}
.bug.dead{opacity:.28;filter:grayscale(1)}
.tank-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#3a4757;font-size:11px;letter-spacing:2px;pointer-events:none}

.shop{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.buy-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.025);color:var(--text);cursor:pointer;font-family:inherit;transition:all .2s var(--ease)}
.buy-btn b{font-size:10.5px;font-weight:600;white-space:nowrap}
.buy-btn span{font-size:10px;color:var(--gold);font-weight:700}
.buy-btn:hover:not(:disabled){background:rgba(88,166,255,.1);border-color:rgba(88,166,255,.4);transform:translateY(-2px)}
.buy-btn:active:not(:disabled){transform:translateY(0) scale(.95)}
.buy-btn:disabled{opacity:.3;cursor:not-allowed}

/* 弹窗 */
.modal-host{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.modal-host.open{display:flex}
.modal-mask{position:absolute;inset:0;background:rgba(4,6,9,.78);backdrop-filter:blur(4px);animation:fadeIn .25s ease}
.modal{position:relative;width:100%;max-width:420px;max-height:86vh;overflow-y:auto;background:linear-gradient(180deg,#1a2230,#111720);border:1px solid var(--line2);border-radius:22px;padding:20px;box-shadow:0 24px 64px rgba(0,0,0,.8);-webkit-overflow-scrolling:touch;animation:modalIn .35s var(--ease)}
@keyframes modalIn{from{opacity:0;transform:translateY(24px) scale(.94)}}
.modal-title{font-size:15px;font-weight:700;letter-spacing:.4px;margin-bottom:14px;padding-right:36px}
.modal-close{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--dim);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:all .2s var(--ease)}
.modal-close:hover{color:var(--text);border-color:var(--line2);background:rgba(255,255,255,.08);transform:rotate(90deg)}
.modal-close:active{transform:rotate(90deg) scale(.9)}

.row{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:11px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.045);margin-bottom:6px;font-size:12px;transition:all .2s var(--ease)}
.row:last-child{margin-bottom:0}
.row b{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.row-label{color:var(--dim);font-size:11.5px}
.row.click{cursor:pointer}
.row.click:hover{border-color:rgba(88,166,255,.4);background:rgba(88,166,255,.06);transform:translateX(2px)}
.row.click:active{transform:translateX(0) scale(.99)}

.prog-row{margin-bottom:10px}
.prog-head{display:flex;align-items:center;font-size:11.5px;margin-bottom:4px}
.prog-head span{color:var(--dim)}
.prog-head b{margin-left:auto;font-weight:700}
.prog-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
.prog-bar>i{display:block;height:100%;border-radius:3px;transition:width .4s var(--ease2)}

.act-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.act{padding:12px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(255,255,255,.02));color:var(--text);font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .25s var(--ease);display:flex;align-items:center;justify-content:center;gap:5px}
.act:hover:not(:disabled){background:linear-gradient(135deg,rgba(88,166,255,.15),rgba(88,166,255,.06));border-color:rgba(88,166,255,.45);transform:translateY(-2px)}
.act:active:not(:disabled){transform:translateY(0) scale(.96)}
.act.gold{border-color:rgba(240,183,47,.4);background:linear-gradient(135deg,rgba(240,183,47,.12),rgba(240,183,47,.05));color:var(--gold)}
.act.gold:hover:not(:disabled){background:linear-gradient(135deg,rgba(240,183,47,.2),rgba(240,183,47,.1));border-color:rgba(240,183,47,.6)}
.act.danger{border-color:rgba(248,81,73,.35)}
.act.danger:hover:not(:disabled){background:rgba(248,81,73,.12);border-color:rgba(248,81,73,.5)}
.act.wide{grid-column:1/-1}
.act:disabled{opacity:.35;cursor:not-allowed}

.section-label{font-size:10px;color:var(--dim);letter-spacing:1.8px;margin:16px 0 8px;text-transform:uppercase}
.section-label:first-child{margin-top:0}
.empty-note{color:var(--dim);font-size:12px;text-align:center;padding:30px 0;letter-spacing:.3px}

.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:94px;z-index:200;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:90vw}
.toast{padding:10px 18px;border-radius:12px;background:rgba(21,27,36,.98);border:1px solid var(--line2);font-size:12px;font-weight:600;backdrop-filter:blur(16px);box-shadow:0 8px 24px rgba(0,0,0,.55);animation:toastIn .4s var(--ease),toastOut .3s var(--ease2) 2.6s forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.9)}}
@keyframes toastOut{to{opacity:0;transform:translateY(16px) scale(.9)}}

.pop{position:fixed;font-size:15px;font-weight:800;color:var(--gold);pointer-events:none;z-index:300;text-shadow:0 2px 12px rgba(0,0,0,.9);font-variant-numeric:tabular-nums;animation:popUp 1.2s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes popUp{0%{opacity:0;transform:translate(-50%,0) scale(.5)}20%{opacity:1;transform:translate(-50%,-14px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}

.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:720px;z-index:60;display:flex;justify-content:space-around;gap:2px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(10,14,20,0),rgba(10,14,20,.97) 30%);backdrop-filter:blur(24px);border-top:1px solid rgba(255,255,255,.06)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border:0;background:transparent;color:var(--dim);font-family:inherit;font-size:10px;cursor:pointer;border-radius:12px;transition:all .25s var(--ease);position:relative}
.tab i{font-style:normal;font-size:19px;line-height:1;transition:transform .3s var(--ease)}
.tab.on{color:var(--accent)}
.tab.on i{transform:scale(1.2) translateY(-2px)}
.tab.on::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:18px;height:2px;background:var(--accent);border-radius:2px;animation:tabIn .3s var(--ease)}
@keyframes tabIn{from{width:0}}
.tab:active{background:rgba(255,255,255,.05)}

/* 斗虫场 */
.arena{padding:14px}
.arena-title{text-align:center;font-size:19px;font-weight:800;letter-spacing:2px;margin-bottom:4px}
.arena-sub{text-align:center;font-size:11px;color:var(--dim);margin-bottom:16px}
.fighter-row{display:flex;gap:10px;margin-bottom:14px}
.fighter{flex:1;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;transition:all .35s var(--ease);position:relative}
.fighter.player{border-color:rgba(88,166,255,.4)}
.fighter.enemy{border-color:rgba(248,81,73,.4)}
.fighter.active{transform:translateY(-4px);box-shadow:0 12px 32px -8px rgba(240,183,47,.4)}
.fighter-circle{width:58px;height:58px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;text-align:center;line-height:1.1;padding:3px;transition:transform .3s var(--ease)}
.fighter.active .fighter-circle{animation:bounce 1s ease infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.fighter-name{font-size:13px;font-weight:700;margin-bottom:2px}
.fighter-sp{font-size:10px;color:var(--dim);margin-bottom:6px}
.fighter-hp{height:7px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:3px}
.fighter-hp>i{display:block;height:100%;border-radius:3px;transition:width .5s var(--ease2)}
.fighter-hpt{font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums}
.vs-badge{display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:var(--dim);padding:0 4px}
.battle-log{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:14px;padding:12px;height:150px;overflow-y:auto;margin-bottom:14px;font-size:11.5px;line-height:1.9;scroll-behavior:smooth}
.battle-log div{color:var(--dim);animation:logIn .25s ease}
@keyframes logIn{from{opacity:0;transform:translateX(-8px)}}
.battle-log .hit{color:var(--red)}
.battle-log .heal{color:var(--green)}
.battle-log .crit{color:var(--gold);font-weight:700}
.battle-log .sys{color:var(--accent);font-weight:600}

.skill-bar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.skill-btn{padding:12px 10px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(255,255,255,.02));color:var(--text);font-family:inherit;cursor:pointer;transition:all .2s var(--ease);text-align:left;position:relative;overflow:hidden}
.skill-btn:hover:not(:disabled){background:linear-gradient(135deg,rgba(88,166,255,.15),rgba(88,166,255,.06));border-color:rgba(88,166,255,.5);transform:translateY(-2px)}
.skill-btn:active:not(:disabled){transform:translateY(0) scale(.96)}
.skill-btn:disabled{opacity:.4;cursor:not-allowed}
.skill-btn .sn{font-size:12px;font-weight:700;margin-bottom:2px}
.skill-btn .sd{font-size:10px;color:var(--dim)}
.skill-btn .sc{position:absolute;top:8px;right:10px;font-size:9px;color:var(--gold);font-weight:700}
.skill-btn.cd{background:rgba(0,0,0,.35)}
.skill-btn.cd .sc{color:var(--red)}

/* 图鉴 */
.dex-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dex-cell{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.02);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:10.5px;color:#3a4757;position:relative;overflow:hidden;transition:all .3s var(--ease)}
.dex-cell.got{color:var(--text);border-color:rgba(255,255,255,.14);background:linear-gradient(135deg,rgba(88,166,255,.08),rgba(88,166,255,.02))}
.dex-cell.got:hover{transform:scale(1.05)}
.dex-cell .dc-dot{width:32px;height:32px;border-radius:50%;border:1.5px solid #2a3441;background:radial-gradient(circle at 34% 28%,#28333f,#12181f 72%);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.dex-cell.locked .dc-dot{filter:grayscale(1) brightness(.4);color:transparent}
.dex-cell .dc-star{position:absolute;top:5px;right:7px;font-size:9px;color:var(--gold);font-weight:700}

.log-list{display:flex;flex-direction:column;gap:4px;max-height:300px;overflow-y:auto}
.log-item{font-size:11px;color:var(--dim);padding:8px 11px;border-radius:9px;background:rgba(255,255,255,.025);border-left:2px solid #2a3441;animation:logIn .25s ease}
.log-item.good{border-left-color:var(--green);color:#b9e8c8}
.log-item.bad{border-left-color:var(--red);color:#f0b8b8}
.log-item.gold{border-left-color:var(--gold);color:#f3dca6}

.card{background:linear-gradient(180deg,rgba(28,36,48,.75),rgba(21,27,36,.88));border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;animation:slideUp .4s var(--ease) both}
.card-title{font-size:13px;font-weight:700;margin-bottom:10px;letter-spacing:.4px}

/* ========== 野外抓虫 2.5D ========== */
.catch-screen{position:fixed;inset:0;z-index:300;display:none;flex-direction:column;background:linear-gradient(180deg,#0a0e14,#050810)}
.catch-screen.open{display:flex;animation:fadeIn .3s ease}
.catch-hud{display:flex;align-items:center;gap:6px;padding:12px;background:rgba(10,14,20,.92);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.06);z-index:10}
.catch-hud .hud-stat{padding:5px 10px}

function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function beep(f,d,t,v){if(!soundOn)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=v||0.08;g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+(d||0.1));o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+(d||0.1))}

function bugAtk(b){const base=8+SPECIES[b.sp].val*0.04;const sizeMul=0.7+b.size*0.5;const lvMul=1+(b.fightLv-1)*0.15;const mutMul=b.mut?1.2:1;return Math.round((base*sizeMul*lvMul*mutMul+b.atkBonus)*diff().battleMul)}
function bugDef(b){const base=4+SPECIES[b.sp].val*0.02;const sizeMul=0.7+b.size*0.5;const lvMul=1+(b.fightLv-1)*0.12;return Math.round((base*sizeMul*lvMul+b.defBonus)*diff().battleMul)}
function bugMaxHp(b){const base=60+SPECIES[b.sp].val*0.3;const sizeMul=0.8+b.size*0.3;const lvMul=1+(b.fightLv-1)*0.2;return Math.round((base*sizeMul*lvMul+b.hpBonus)*diff().battleMul)}
function bugDiameter(b){const sp=SPECIES[b.sp];const stageScale=[0.62,0.78,0.92,1.0,1.08][b.stage]||0.9;const mutScale=b.mut==='giant'?1.28:b.mut==='crystal'?1.12:b.mut==='void'?1.16:1;return Math.round(sp.r*(0.72+b.size*0.5)*stageScale*mutScale*2)}
function bugColor(b){if(b.mut&&MUTS[b.mut])return MUTS[b.mut].c;if(b.mature)return RARITY[b.q].c;return '#7d8590'}
function priceOf(b){
if(!b.mature)return 0;
const sp=SPECIES[b.sp],q=RARITY[b.q];
const mm=b.mut&&MUTS[b.mut]?MUTS[b.mut].m:1;
const sizeMul=0.75+b.size*0.45;
const hpMul=0.62+(b.hp/100)*0.38;
const moodMul=0.85+(b.mood/100)*0.15;
const winMul=1+(b.wins||0)*0.03;
let titleMul=1;
if(b.title==='虫王')titleMul=1.15;
if(b.title==='斗神')titleMul=1.3;
return Math.max(1,Math.round(sp.val*q.m*mm*sizeMul*hpMul*moodMul*winMul*titleMul*diff().priceMul));
}
function buyCost(sp){return Math.max(4,Math.round(sp.val*0.30))}
function calcTemp(t){let v=t.temp+SEASONS[G.season].t+WEATHERS[G.weather].t+SUBS[t.substrate].t;if(t.upgrades.heater&&v<22)v+=(22-v)*0.75;return v}
function calcHum(t){let v=t.hum+SEASONS[G.season].h+WEATHERS[G.weather].h+SUBS[t.substrate].h;if(t.upgrades.humid&&v<62)v+=(62-v)*0.7;if(t.upgrades.water)v+=4;return clamp(v,15,98)}
function envFactor(sp,temp,hum){let f=1;if(temp<sp.tmin)f*=Math.max(0.2,1-(sp.tmin-temp)*0.09);if(temp>sp.tmax)f*=Math.max(0.2,1-(temp-sp.tmax)*0.09);if(hum<sp.hmin)f*=Math.max(0.25,1-(sp.hmin-hum)*0.022);if(hum>sp.hmax)f*=Math.max(0.25,1-(hum-sp.hmax)*0.022);return f}

function rollMarket(){Object.keys(SPECIES).forEach(k=>{G.market[k]=rand(0.72,1.34)})}
function genOrders(){G.orders=[];const keys=Object.keys(SPECIES);for(let i=0;i<3;i++){const sp=keys[(Math.random()*keys.length)|0];const q=Math.min(RARITY.length-1,(Math.random()*3)|0);G.orders.push({id:G.nextId++,sp:sp,q:q,reward:Math.round(SPECIES[sp].val*(1.4+q*0.85))})}}
function checkAch(){const s=G.stats;function unlock(k){if(G.ach[k])return;G.ach[k]=1;const a=ACHS.find(x=>x.k===k);if(a){G.coins+=a.r;toast('🏆 '+a.n+' +'+a.r+'🪙','#f0b72f');log('成就解锁 · '+a.n,'gold');sfxLevel()}}if(s.sold>=1)unlock('first');if(s.caught>=1)unlock('hunter');if(s.caught>=30)unlock('master');if(s.sold>=10)unlock('ten');if(s.sold>=100)unlock('hundred');if(s.mutated>=1)unlock('mut');if(s.bred>=10)unlock('breed');if(s.cured>=10)unlock('cure');if(G.coins>=10000)unlock('rich');if(s.wins>=1)unlock('fighter');if(s.wins>=10)unlock('champion')}
function levelCheck(){const need=G.level*400;let lvUp=false;while(G.exp>=need){G.exp-=G.level*400;G.level++;lvUp=true;toast('研究所升级 Lv.'+G.level,'#58a6ff');log('研究所升级 Lv.'+G.level,'good')}if(lvUp)sfxLevel()}
function addDex(spId,q){if(!G.dex[spId])G.dex[spId]={count:0,best:0};G.dex[spId].count++;if(q>G.dex[spId].best)G.dex[spId].best=q}

else if(G.view==='dex')renderDex(v);

if(tank.bugs.length===0){const e=document.createElement('div');e.className='tank-empty';e.textContent='空 空 如 也';tankEl.appendChild(e)}

function styleBugEl(el,b){
const d=bugDiameter(b);
el.style.width=d+'px';el.style.height=d+'px';
el.querySelector('span').style.fontSize=Math.max(7,Math.min(15,d*0.32))+'px';
const col=bugColor(b);
el.style.borderColor=b.mature?col:'#46566b';
el.style.background='radial-gradient(circle at 34% 28%,'+rgba(col,.35)+',#0f141a 72%)';
el.style.boxShadow=b.mature?'0 4px 12px rgba(0,0,0,.55),0 0 18px '+rgba(col,.4):'0 4px 12px rgba(0,0,0,.55)';
el.querySelector('span').style.color=b.mature?col:'#c7d0dc';
el.classList.toggle('mature',b.mature&&b.alive);
el.classList.toggle('dead',!b.alive);
el._d=d;el._col=col;
}
function updateBugDOM(){
if(G.view!=='tanks')return;
bugEls.forEach((el,id)=>{
const b=allBugs.get(id);
if(!b||!el.parentElement)return;
const tankEl=el.parentElement;
const w=tankEl.clientWidth,h=tankEl.clientHeight;
if(!w||!h)return;
const d=el._d||bugDiameter(b);
el.style.transform='translate3d('+(b.x*(w-d)).toFixed(1)+'px,'+(b.y*(h-d)).toFixed(1)+'px,0)';
const nd=bugDiameter(b);if(nd!==el._d)styleBugEl(el,b);
const nc=bugColor(b);if(nc!==el._col)styleBugEl(el,b);
const flash=b.flashUntil>Date.now();
if(el._flash!==flash){el._flash=flash;el.classList.toggle('flash',flash)}
});
}
function onBugClick(id){const b=allBugs.get(id);if(!b)return;b.flashUntil=Date.now()+650;if(b.alive){const ang=Math.random()*Math.PI*2;b.vx=Math.cos(ang)*0.14;b.vy=Math.sin(ang)*0.14;b.wander=1.2}openBugModal(b)}

function update(dt){
G.food=Math.min(foodCap(),G.food+0.16*dt*(1+G.level*0.06));
G.weatherTimer-=dt;if(G.weatherTimer<=0){G.weatherTimer=100+Math.random()*140;rollWeather()}
G.eventTimer-=dt;if(G.eventTimer<=0){G.eventTimer=55+Math.random()*95;randomEvent()}
G.seasonTimer+=dt;if(G.seasonTimer>1400){G.seasonTimer=0;G.season=(G.season+1)%4;log('季节更替 · '+SEASONS[G.season].n,'good')}
G.dayTimer+=dt;if(G.dayTimer>160){G.dayTimer=0;G.day++;rollMarket();genOrders();log('第 '+G.day+' 天开始','')}
G.tanks.forEach(tank=>{
tank.cleanliness=Math.max(0,tank.cleanliness-(0.05+tank.bugs.length*0.016)*dt*(tank.upgrades.bowl?0.7:1));
if(tank.upgrades.autoClean)tank.cleanliness=Math.min(100,tank.cleanliness+0.08*dt);
if(tank.upgrades.autoFeed&&G.food<foodCap()*0.4)G.food=Math.min(foodCap(),G.food+3.2*dt);
const temp=calcTemp(tank),hum=calcHum(tank);
tank.bugs.forEach(b=>{
if(!b.alive)return;
const sp=SPECIES[b.sp];
if(!b.mature){
const env=envFactor(sp,temp,hum);
const rate=(100/sp.time)*b.genes.speed*env*(0.85+tank.light*0.35)*diff().growMul;
b.growth=Math.min(100,b.growth+rate*dt*(0.4+0.6*b.hp/100));
if(b.growth>=100){b.growth=100;b.mature=true;b.stage=sp.st.length-1;b.flashUntil=Date.now()+1000;log(b.name+' 羽化成熟 · '+RARITY[b.q].n,'gold');toast(sp.n+' 成熟了','#f0b72f');sfxMature()}
else b.stage=stageOf(sp,b.growth/100);
}
const need=sp.hun*dt*b.genes.appetite*(b.mature?1.2:1);
if(G.food>=need){G.food-=need;b.hunger=Math.min(100,b.hunger+16*dt)}else{b.hunger=Math.max(0,b.hunger-7*dt)}
let hp=0.12;
if(b.hunger<25)hp-=0.65;
if(temp<sp.tmin-3||temp>sp.tmax+3)hp-=0.5;
if(hum<sp.hmin-10||hum>sp.hmax+10)hp-=0.3;
if(tank.cleanliness<35)hp-=0.35;
if(b.disease)hp-=1.5;
if(b.parasite)hp-=0.9;
if(b.symbiont)hp+=0.7;
if(tank.upgrades.hide)hp+=0.15;
b.hp=clamp(b.hp+hp*dt*diff().deathMul,0,100);
let mood=0;
if(b.hunger>55)mood+=0.55;else mood-=1.1;
if(tank.cleanliness<45)mood-=0.65;
if(tank.upgrades.hide)mood+=0.3;
b.mood=clamp(b.mood+mood*dt,0,100);
if(tank.cleanliness<30&&!b.disease&&Math.random()<dt*0.006)b.disease='霉病';
if(tank.cleanliness<22&&!b.parasite&&Math.random()<dt*0.004)b.parasite='螨虫';
b.age+=dt;
if(b.hp<=0){b.alive=false;b.mature=false;log(b.name+' 死亡了','bad');toast(b.name+' 死亡','#f85149')}
b.wander-=dt;
if(b.wander<=0){
b.wander=0.9+Math.random()*2.6;
if(Math.random()<0.3){b.vx=0;b.vy=0}
else{const base=(0.05+b.size*0.03)*(0.5+b.mood/160)*(0.6+b.genes.speed*0.5);const ang=Math.random()*Math.PI*2;b.vx=Math.cos(ang)*base;b.vy=Math.sin(ang)*base*1.35}
}
b.x+=b.vx*dt;b.y+=b.vy*dt;
if(b.x<0){b.x=0;b.vx=Math.abs(b.vx)}
if(b.x>1){b.x=1;b.vx=-Math.abs(b.vx)}
if(b.y<0){b.y=0;b.vy=Math.abs(b.vy)}
if(b.y>1){b.y=1;b.vy=-Math.abs(b.vy)}
b.vx*=0.997;b.vy*=0.997;
if(!tank.upgrades.lock&&Math.random()<0.000004*dt*60){b.alive=false;log(b.name+' 被偷走了','bad');toast('有虫被偷了','#f85149')}
});
});
}
let lastT=performance.now();
function loop(t){let dt=(t-lastT)/1000;lastT=t;if(dt>2)dt=2;if(dt>0)update(dt);updateBugDOM();updateCatchGame(dt);requestAnimationFrame(loop)}

function offlineUpdate(dt){
G.food=Math.min(foodCap(),G.food+0.16*dt*(1+G.level*0.06));
G.tanks.forEach(tank=>{
tank.cleanliness=Math.max(0,tank.cleanliness-(0.05+tank.bugs.length*0.016)*dt);
if(tank.upgrades.autoClean)tank.cleanliness=Math.min(100,tank.cleanliness+0.08*dt);
if(tank.upgrades.autoFeed&&G.food<foodCap()*0.4)G.food=Math.min(foodCap(),G.food+3.2*dt);
const temp=calcTemp(tank),hum=calcHum(tank);
tank.bugs.forEach(b=>{
if(!b.alive)return;
const sp=SPECIES[b.sp];
if(!b.mature){
const env=envFactor(sp,temp,hum);
const rate=(100/sp.time)*b.genes.speed*env*(0.85+tank.light*0.35)*diff().growMul;
b.growth=Math.min(100,b.growth+rate*dt*(0.4+0.6*b.hp/100));
if(b.growth>=100){b.growth=100;b.mature=true;b.stage=sp.st.length-1}
else b.stage=stageOf(sp,b.growth/100);
}
const need=sp.hun*dt*b.genes.appetite;
if(G.food>=need){G.food-=need;b.hunger=Math.min(100,b.hunger+16*dt)}else b.hunger=Math.max(0,b.hunger-7*dt);
let hp=0.12;
if(b.hunger<25)hp-=0.65;
if(b.disease)hp-=1.5;
if(b.parasite)hp-=0.9;
if(b.symbiont)hp+=0.7;
b.hp=clamp(b.hp+hp*dt*diff().deathMul,0,100);
if(b.hp<=0){b.alive=false;b.mature=false}
});
});
}
function applyOffline(){const elapsed=(Date.now()-G.lastTime)/1000;if(elapsed<20)return;const cap=Math.min(elapsed,8*3600);const steps=Math.min(260,Math.max(40,Math.floor(cap/10)));const dt=cap/steps;for(let i=0;i<steps;i++)offlineUpdate(dt);const matured=G.tanks.reduce(function(a,t){return a+t.bugs.filter(function(b){return b.mature}).length},0);const dead=G.tanks.reduce(function(a,t){return a+t.bugs.filter(function(b){return !b.alive}).length},0);let msg='离线 '+timeStr(elapsed);if(matured)msg+=' · 成熟 '+matured;if(dead)msg+=' · 死亡 '+dead;toast(msg,'#58a6ff');log('离线 '+timeStr(elapsed),'')}

function randomEvent(){
const r=Math.random();
if(r<0.12){const b=findAnyBug(x=>x.alive&&!x.disease);if(b){b.disease='突发感染';log(b.name+' 突发感染','bad');toast('有虫突发感染','#f85149')}}
else if(r<0.24){const b=findAnyBug(x=>x.alive&&!x.mature);if(b){b.growth=Math.min(100,b.growth+16);b.flashUntil=Date.now()+800;log('暴产期 · '+b.name+' 加速成长','good');toast('暴产期加速成长','#3fb950')}}
else if(r<0.34){const b=findAnyBug(x=>x.alive&&!x.mut);if(b){const m=rollMutReal(60);if(m){b.mut=m;b.flashUntil=Date.now()+1200;G.stats.mutated++;log('自然突变 · '+MUTS[m].n,'gold');toast('自然突变！'+MUTS[m].n,'#f0b72f');checkAch()}}}
else if(r<0.44){const g=Math.round(80+Math.random()*260);G.coins+=g;log('访客高价收虫，额外获得 '+g+' 金币','good');toast('访客留下 '+g+'🪙','#f0b72f')}
else if(r<0.52){G.tanks.forEach(t=>{t.temp=clamp(t.temp-(Math.random()*4+2),10,35)});log('突然降温，注意保温','bad');toast('突然降温','#58a6ff')}
else if(r<0.60){const b=findAnyBug(x=>x.alive&&!x.parasite);if(b){b.parasite='螨虫';log(b.name+' 感染螨虫','bad');toast('有虫感染螨虫','#f0883e')}}
else if(r<0.70){const b=findAnyBug(x=>x.alive&&!x.symbiont);if(b){b.symbiont='益生菌';b.hp=clamp(b.hp+10,0,100);log(b.name+' 获得共生菌','good');toast('获得共生菌','#3fb950')}}
else if(r<0.78){const b=findAnyBug(x=>x.alive);if(b){b.hp=clamp(b.hp-18,0,100);b.mood=clamp(b.mood-20,0,100);log(b.name+' 受到惊吓','bad');toast('有虫受到惊吓','#f85149')}}
else if(r<0.88){const f=280;G.food=Math.min(foodCap(),G.food+f);log('饲料丰收 +'+f,'good');toast('饲料丰收 +'+f,'#3fb950')}
else{Object.keys(SPECIES).forEach(k=>{G.market[k]=(G.market[k]||1)*1.15});log('市场需求激增，价格普涨','good');toast('市场价格普涨','#3fb950')}
}

function buyBug(tank,spId){const sp=SPECIES[spId],cost=buyCost(sp);if(G.coins<cost){toast('金币不足','#f85149');return}if(tank.bugs.length>=tank.capacity){toast('这个缸已经满了','#f85149');return}G.coins-=cost;tank.bugs.push(makeBug(spId));toast('购入 '+sp.n,'#58a6ff');render()}
function sellBug(b){
const tank=findTankOf(b);if(!tank||!b.mature)return;
if(battle&&(battle.player===b||battle.enemy===b)){toast('这只虫正在战斗中','#f85149');return}
const price=priceOf(b);
G.coins+=price;G.exp+=Math.max(1,Math.round(price/12));G.research+=Math.max(1,Math.round(price/40));
G.stats.sold++;G.stats.earned+=price;
addDex(b.sp,b.q);
const i=tank.bugs.indexOf(b);if(i>=0)tank.bugs.splice(i,1);
const el=bugEls.get(b.id);if(el)popAt(el,'+'+price);

sfxSell();levelCheck();checkAch();render();
}
function releaseBug(b){const tank=findTankOf(b);if(!tank)return;const i=tank.bugs.indexOf(b);if(i>=0)tank.bugs.splice(i,1);toast('已放生 '+b.name,'#7d8590');render()}
function feedBug(b){if(G.food<25){toast('饲料不足','#f85149');return}G.food-=25;b.hunger=clamp(b.hunger+35,0,100);b.hp=clamp(b.hp+4,0,100);b.mood=clamp(b.mood+6,0,100);b.flashUntil=Date.now()+600;sfxFeed();toast(b.name+' 吃得很香','#3fb950')}

function doClone(b){
if(b.isClone){toast('克隆体无法再被克隆','#f85149');return}
const left=CLONE_LIMIT-(b.cloneCount||0);
if(left<=0){toast('这只虫克隆次数已用尽','#f85149');return}
if(!b.mature||!b.alive){toast('需要一只活着的成熟虫','#7d8590');return}
const tank=findTankOf(b);if(!tank){toast('找不到虫缸','#f85149');return}
if(tank.bugs.length>=tank.capacity){toast('缸内空间不足','#f85149');return}
const cost=600*((b.cloneCount||0)+1);
if(G.coins<cost){toast('金币不足 ('+cost+'🪙)','#f85149');return}
G.coins-=cost;
b.cloneCount=(b.cloneCount||0)+1;
G.stats.clones=(G.stats.clones||0)+1;
const c=JSON.parse(JSON.stringify(b));
c.id=G.nextId++;c.name=genName();
c.x=rand(0.15,0.85);c.y=rand(0.2,0.7);
c.vx=0;c.vy=0;c.wander=0;c.flashUntil=Date.now()+900;
c.wins=0;c.losses=0;c.fightLv=1;c.fightExp=0;
c.atkBonus=0;c.defBonus=0;c.hpBonus=0;c.title=null;
c.cloneCount=CLONE_LIMIT;c.isClone=true;
c.mature=true;c.stage=SPECIES[c.sp].st.length-1;c.growth=100;
tank.bugs.push(c);
sfxBuy();toast('克隆成功，花费 '+cost+'🪙','#a371f7');
log('克隆 · '+b.name+' 花费'+cost,'gold');
}

function spawnCatchBug(){

function renderCatchBug(b){
const world=document.getElementById('catchWorld');

el.className='catch-bug';

el.onclick=function(ev){ev.stopPropagation();tryCatch(b)};
world.appendChild(el);
b._el=el;
}
function updateCatchGame(dt){
if(!catchGame.active)return;
catchGame.timeLeft-=dt;
if(catchGame.timeLeft<=0){closeCatch();return}
document.getElementById('catchTime').textContent=Math.ceil(catchGame.timeLeft);
document.getElementById('catchCount').textContent=catchGame.caught.length;

catchGame.spawnTimer-=dt;
if(catchGame.spawnTimer<=0){
catchGame.spawnTimer=rand(2,4);
if(catchGame.bugs.length<8)spawnCatchBug();
}
catchGame.bugs.forEach(b=>{
b.x+=b.vx*dt;
b.y+=b.vy*dt;
if(b.x<0.05||b.x>0.95){b.vx*=-1;b.x=clamp(b.x,0.05,0.95)}
if(b.y<0.15||b.y>0.9){b.vy*=-1;b.y=clamp(b.y,0.15,0.9)}
if(Math.random()<dt*0.4){b.vx=clamp(b.vx+rand(-0.02,0.02),-0.08,0.08);b.vy=clamp(b.vy+rand(-0.01,0.01),-0.04,0.04)}
b.life-=dt;
if(b.life<=0&&b._el){b._el.classList.add('escaping');setTimeout(()=>{if(b._el&&b._el.parentElement)b._el.remove()},600);b.dead=true}
if(b._el&&!b.dead){
const world=document.getElementById('catchWorld');
const w=world.clientWidth,h=world.clientHeight;
const size=parseFloat(b._el.style.width)||30;
b._el.style.transform='translate3d('+(b.x*(w-size))+'px,'+(b.y*(h-size))+'px,0) scale('+(0.85+b.depth*0.4)+')';
b._el.style.zIndex=Math.round(b.depth*100);
}
});
catchGame.bugs=catchGame.bugs.filter(b=>!b.dead);
}
function tryCatch(b){
if(!catchGame.active||b.dead)return;
const sp=SPECIES[b.sp];
const mul=diff().catchMul;
let base=sp.catchR*mul;
if(catchGame.tool==='net')base+=0.35;
if(catchGame.tool==='bait')base+=0.15;
const depthPenalty=(1-b.depth)*0.15;
base-=depthPenalty;
base=clamp(base,0.05,0.95);
const roll=Math.random();
const fx=document.createElement('div');
fx.className='tool-fx net';
fx.style.cssText='position:absolute;left:'+(b.x*100)+'%;top:'+(b.y*100)+'%;width:80px;height:80px;border-radius:50%;border:3px dashed rgba(88,166,255,.8);transform:translate(-50%,-50%);pointer-events:none;z-index:50';
document.getElementById('catchWorld').appendChild(fx);
setTimeout(()=>fx.remove(),600);
if(roll<base){
catchGame.caught.push({sp:b.sp,q:rollQuality(),size:0.85+Math.random()*0.3});
G.stats.caught=(G.stats.caught||0)+1;
sfxCatch();
showCatchResult('+1 '+sp.n,'good');
if(b._el){
b._el.style.setProperty('--tx','0');
b._el.style.setProperty('--ty','-100px');
b._el.classList.add('caught');
setTimeout(()=>{if(b._el&&b._el.parentElement)b._el.remove()},500);
}
b.dead=true;
if(catchGame.tool==='net'){G.tools.net--;if(G.tools.net<0)G.tools.net=0;renderCatchTools()}
}else{
b.alert+=1;
b.alerted=true;
sfxMiss();
showCatchResult('跑掉了...','bad');
if(b._el){
b._el.style.setProperty('--x',(b.x*100)+'%');
b._el.style.setProperty('--y',(b.y*100)+'%');
b._el.classList.add('alerted');
setTimeout(()=>{if(b._el)b._el.classList.remove('alerted')},300);
}
if(b.alert>=2||Math.random()<0.4){
if(b._el){b._el.style.setProperty('--ex',(Math.random()*100-50)+'px');b._el.style.setProperty('--ey','-80px');b._el.classList.add('escaping');setTimeout(()=>{if(b._el&&b._el.parentElement)b._el.remove()},600)}
b.dead=true;
}
}
}

/* ============ 斗虫场 ============ */
function startBattle(playerBug,enemyBug){
battle={player:playerBug,enemy:enemyBug,
playerHp:bugMaxHp(playerBug),enemyHp:bugMaxHp(enemyBug),
playerMaxHp:bugMaxHp(playerBug),enemyMaxHp:bugMaxHp(enemyBug),
playerCd:{},enemyCd:{},playerBuff:{},enemyBuff:{},
turn:1,log:[],over:false,animating:false,
playerDefending:false,enemyDefending:false,
playerStun:0,enemyStun:0};
playerBug.skills.forEach(s=>{battle.playerCd[s]=0});
enemyBug.skills.forEach(s=>{battle.enemyCd[s]=0});
addBattleLog('sys','⚔️ 战斗开始！');
renderArena();
}
function addBattleLog(type,text){battle.log.push({t:type,m:text});if(battle.log.length>60)battle.log.shift()}
function calcSkillDamage(attacker,defender,sk,defending){
let atk=bugAtk(attacker),def=bugDef(defender);
if(attacker===battle.player&&battle.playerBuff.atkDown>0)atk*=0.7;
if(attacker===battle.enemy&&battle.enemyBuff.atkDown>0)atk*=0.7;
if(defender===battle.player&&battle.playerBuff.defUp>0)def*=1.4;
if(defender===battle.enemy&&battle.enemyBuff.defUp>0)def*=1.4;
if(defending)def*=1.5;
const base=Math.max(2,atk*sk.dmg-def*0.5);
return Math.round(base*(0.85+Math.random()*0.3));
}
function applyBuff(buff,effect,dur){if(effect==='defUp')buff.defUp=dur;if(effect==='defUp2')buff.defUp=dur+1;if(effect==='dodgeUp')buff.dodgeUp=dur}
function applyDebuff(buff,effect,dur){if(effect==='atkDown')buff.atkDown=dur;if(effect==='blind')buff.blind=dur;if(effect==='stun')buff.stun=dur}
function buffText(e){if(e==='defUp')return'防御力提升';if(e==='defUp2')return'防御力大幅提升';if(e==='dodgeUp')return'闪避率提升';return''}
function debuffText(e){if(e==='atkDown')return'对手攻击力下降';if(e==='blind')return'对手被致盲';if(e==='stun')return'对手被震慑';return''}
function playerUseSkill(skId){
if(!battle||battle.over||battle.animating)return;
if(battle.playerStun>0){addBattleLog('sys','你被震慑了，无法行动！');battle.playerStun--;battle.animating=false;setTimeout(()=>{tickBuffs();renderArena()},500);return}
const sk=SKILLS[skId];
if(!sk||battle.playerCd[skId]>0)return;
battle.playerCd[skId]=sk.cd;battle.animating=true;
if(sk.type==='buff'){applyBuff(battle.playerBuff,sk.effect,2);addBattleLog('sys','你使用了 '+sk.n+'，'+buffText(sk.effect));sfxClick();battle.animating=false;setTimeout(()=>{tickBuffs();enemyTurn();renderArena()},500);return}
if(sk.type==='debuff'){if(Math.random()<0.7){applyDebuff(battle.enemyBuff,sk.effect,2);addBattleLog('sys','你使用了 '+sk.n+'，'+debuffText(sk.effect))}else{addBattleLog('sys','你使用了 '+sk.n+'，但对手抵抗了！')}sfxClick();battle.animating=false;setTimeout(()=>{tickBuffs();enemyTurn();renderArena()},500);return}
const dodged=Math.random()*100<(battle.enemyBuff.dodgeUp>0?25:8);
if(dodged&&sk.dmg>0){addBattleLog('sys','对手闪避了你的攻击！');battle.animating=false;setTimeout(()=>{tickBuffs();enemyTurn();renderArena()},500);return}
const dmg=calcSkillDamage(battle.player,battle.enemy,sk,battle.enemyDefending);
if(sk.type==='multi'){let total=0;for(let i=0;i<sk.hits;i++)total+=Math.max(1,Math.round(dmg*(0.8+Math.random()*0.4)));battle.enemyHp=Math.max(0,battle.enemyHp-total);addBattleLog('hit','你使用 '+sk.n+'，造成 '+total+' 伤害！');sfxHit()}
else if(sk.type==='drain'){const heal=Math.round(dmg*0.5);battle.enemyHp=Math.max(0,battle.enemyHp-dmg);battle.playerHp=Math.min(battle.playerMaxHp,battle.playerHp+heal);addBattleLog('heal','你使用 '+sk.n+'，造成 '+dmg+' 伤害，回复 '+heal+' HP');sfxHit()}
else if(sk.type==='dot'){battle.enemyHp=Math.max(0,battle.enemyHp-dmg);battle.enemyBuff.poison=(battle.enemyBuff.poison||0)+3;addBattleLog('hit','你使用 '+sk.n+'，造成 '+dmg+' 伤害，附加中毒');sfxHit()}
else{const isCrit=Math.random()<0.12;const finalDmg=isCrit?Math.round(dmg*1.8):dmg;battle.enemyHp=Math.max(0,battle.enemyHp-finalDmg);if(isCrit){addBattleLog('crit','💥 暴击！你使用 '+sk.n+'，造成 '+finalDmg+' 伤害！');sfxCrit()}else{addBattleLog('hit','你使用 '+sk.n+'，造成 '+finalDmg+' 伤害');sfxHit()}}
battle.animating=false;checkBattleEnd();
if(!battle.over)setTimeout(()=>{tickBuffs();enemyTurn();renderArena()},550);
renderArena();
}
function enemyTurn(){
if(!battle||battle.over)return;
if(battle.enemyStun>0){addBattleLog('sys','对手被震慑了，无法行动！');battle.enemyStun--;battle.animating=false;renderArena();return}
const available=battle.enemy.skills.filter(s=>battle.enemyCd[s]<=0);
const skId=available.length?pick(available):pick(battle.enemy.skills);
const sk=SKILLS[skId];battle.enemyCd[skId]=sk.cd;battle.animating=true;
if(sk.type==='buff'){applyBuff(battle.enemyBuff,sk.effect,2);addBattleLog('sys','对手使用了 '+sk.n+'，'+buffText(sk.effect));battle.animating=false;setTimeout(()=>{tickBuffs();renderArena()},500);return}
if(sk.type==='debuff'){if(Math.random()<0.7){applyDebuff(battle.playerBuff,sk.effect,2);addBattleLog('sys','对手使用了 '+sk.n+'，'+debuffText(sk.effect))}else{addBattleLog('sys','对手使用了 '+sk.n+'，但你抵抗了！')}battle.animating=false;setTimeout(()=>{tickBuffs();renderArena()},500);return}
const dodged=Math.random()*100<(battle.playerBuff.dodgeUp>0?25:8);
if(dodged&&sk.dmg>0){addBattleLog('sys','你闪避了对手的攻击！');battle.animating=false;setTimeout(()=>{tickBuffs();renderArena()},500);return}
const dmg=calcSkillDamage(battle.enemy,battle.player,sk,battle.playerDefending);
if(sk.type==='multi'){let total=0;for(let i=0;i<sk.hits;i++)total+=Math.max(1,Math.round(dmg*(0.8+Math.random()*0.4)));battle.playerHp=Math.max(0,battle.playerHp-total);addBattleLog('hit','对手使用 '+sk.n+'，造成 '+total+' 伤害！');sfxHit()}
else if(sk.type==='drain'){const heal=Math.round(dmg*0.5);battle.playerHp=Math.max(0,battle.playerHp-dmg);battle.enemyHp=Math.min(battle.enemyMaxHp,battle.enemyHp+heal);addBattleLog('heal','对手使用 '+sk.n+'，造成 '+dmg+' 伤害，回复 '+heal+' HP');sfxHit()}
else if(sk.type==='dot'){battle.playerHp=Math.max(0,battle.playerHp-dmg);battle.playerBuff.poison=(battle.playerBuff.poison||0)+3;addBattleLog('hit','对手使用 '+sk.n+'，造成 '+dmg+' 伤害，你中毒了');sfxHit()}
else{const isCrit=Math.random()<0.12;const finalDmg=isCrit?Math.round(dmg*1.8):dmg;battle.playerHp=Math.max(0,battle.playerHp-finalDmg);if(isCrit){addBattleLog('crit','💥 对手暴击！使用 '+sk.n+'，造成 '+finalDmg+' 伤害！');sfxCrit()}else{addBattleLog('hit','对手使用 '+sk.n+'，造成 '+finalDmg+' 伤害');sfxHit()}}
battle.animating=false;checkBattleEnd();renderArena();
}
function tickBuffs(){
if(!battle)return;
['defUp','dodgeUp','atkDown','blind','stun','poison'].forEach(k=>{if(battle.playerBuff[k]>0)battle.playerBuff[k]--;if(battle.enemyBuff[k]>0)battle.enemyBuff[k]--});
if(battle.playerBuff.poison>0){battle.playerHp=Math.max(0,battle.playerHp-3);addBattleLog('hit','你受到中毒伤害 3')}
if(battle.enemyBuff.poison>0){battle.enemyHp=Math.max(0,battle.enemyHp-3);addBattleLog('hit','对手受到中毒伤害 3')}
battle.player.skills.forEach(s=>{if(battle.playerCd[s]>0)battle.playerCd[s]--});
battle.enemy.skills.forEach(s=>{if(battle.enemyCd[s]>0)battle.enemyCd[s]--});
battle.playerStun=battle.playerBuff.stun||0;battle.enemyStun=battle.enemyBuff.stun||0;
battle.playerDefending=battle.playerBuff.defUp>0;battle.enemyDefending=battle.enemyBuff.defUp>0;
battle.turn++;checkBattleEnd();
}
function checkBattleEnd(){
if(!battle||battle.over)return;
if(battle.enemyHp<=0){battle.over=true;battle.player.wins=(battle.player.wins||0)+1;battle.player.fightExp=(battle.player.fightExp||0)+25;G.stats.fights++;G.stats.wins++;const reward=Math.round(60+bugAtk(battle.enemy)*8);G.coins+=reward;addBattleLog('sys','🏆 你赢了！获得 '+reward+'🪙');log('斗虫胜利 · '+battle.player.name+' +'+reward,'gold');sfxWin();checkFightLevel(battle.player);checkTitles(battle.player);checkAch()}
else if(battle.playerHp<=0){battle.over=true;battle.enemy.wins=(battle.enemy.wins||0)+1;battle.player.losses=(battle.player.losses||0)+1;G.stats.fights++;battle.player.hp=clamp(battle.player.hp-15,0,100);addBattleLog('sys','💀 你输了...');log('斗虫失败 · '+battle.player.name,'bad');sfxLose()}
}
function checkFightLevel(b){const need=b.fightLv*100;let lvUp=false;while(b.fightExp>=need){b.fightExp-=need;b.fightLv++;b.atkBonus+=2;b.defBonus+=1;b.hpBonus+=5;lvUp=true}if(lvUp){toast(b.name+' 斗虫等级提升！Lv.'+b.fightLv,'#f0b72f');log(b.name+' 斗虫等级提升 Lv.'+b.fightLv,'gold');sfxLevel()}}
function checkTitles(b){if(!b.title&&b.wins>=5){b.title='虫王';toast(b.name+' 获得称号「虫王」','#f0b72f')}else if(b.title==='虫王'&&b.wins>=15){b.title='斗神';toast(b.name+' 获得称号「斗神」','#f0b72f')}}

function renderArena(v){
v=v||document.getElementById('view');
if(!battle){
const list=[];
G.tanks.forEach(t=>t.bugs.forEach(b=>{if(b.alive&&b.mature)list.push(b)}));
v.innerHTML='<div class="arena">'+
'<div class="arena-title">⚔️ 斗虫场</div>'+
'<div class="arena-sub">选择你的虫出战，手动释放技能击败对手</div>'+
'<div class="section-label">选择出战虫</div>'+
(list.length?list.map(b=>{const sp=SPECIES[b.sp],col=bugColor(b);return '<div class="row click" data-fight="'+b.id+'"><span class="row-label" style="color:'+col+'">'+b.name+' · '+sp.n+' · Lv.'+b.fightLv+(b.title?' · '+b.title:'')+'</span><b>⚔️ 出战</b></div>'}).join(''):'<div class="empty-note">没有可出战的成熟虫</div>')+
'<div class="section-label">战绩</div>'+
'<div class="row"><span class="row-label">总场次</span><b>'+G.stats.fights+'</b></div>'+
'<div class="row"><span class="row-label">胜场</span><b style="color:#3fb950">'+G.stats.wins+'</b></div>'+
'<div class="row"><span class="row-label">胜率</span><b>'+(G.stats.fights?Math.round(G.stats.wins/G.stats.fights*100):0)+'%</b></div>'+
'</div>';
v.querySelectorAll('[data-fight]').forEach(r=>{
r.onclick=function(){
sfxClick();
const b=findAnyBug(x=>x.id===+r.dataset.fight);if(!b)return;
const pool=[];G.tanks.forEach(t=>t.bugs.forEach(x=>{if(x!==b&&x.alive&&x.mature)pool.push(x)}));
let enemy;
if(pool.length)enemy=pick(pool);
else{const keys=Object.keys(SPECIES);const spId=pick(keys);enemy=makeBug(spId,{q:Math.min(RARITY.length-1,1+Math.floor(Math.random()*3))});enemy.mature=true;enemy.growth=100;enemy.stage=SPECIES[spId].st.length-1;enemy.fightLv=Math.max(1,b.fightLv);enemy.name='野生'+SPECIES[spId].n}
startBattle(b,enemy);
};
});
return;
}
const pl=battle.player,en=battle.enemy;
const plCol=bugColor(pl),enCol=bugColor(en);
const plHpPct=battle.playerHp/battle.playerMaxHp;
const enHpPct=battle.enemyHp/battle.enemyMaxHp;
let logHtml='';battle.log.slice(-16).forEach(l=>{logHtml+='<div class="'+l.t+'">'+l.m+'</div>'});
let skillsHtml='';
if(!battle.over){
pl.skills.forEach(skId=>{
const sk=SKILLS[skId];const cd=battle.playerCd[skId]||0;const dis=cd>0||battle.animating;
skillsHtml+='<button class="skill-btn'+(cd>0?' cd':'')+'" data-skill="'+skId+'" '+(dis?'disabled':'')+'><div class="sn">'+sk.icon+' '+sk.n+'</div><div class="sd">'+(sk.dmg>0?'伤害×'+sk.dmg:'辅助')+' · CD'+sk.cd+'</div>'+(cd>0?'<div class="sc">CD '+cd+'</div>':'')+'</button>';
});
}
v.innerHTML='<div class="arena">'+
'<div class="arena-title">⚔️ 斗虫场</div>'+
'<div class="arena-sub">第 '+battle.turn+' 回合</div>'+
'<div class="fighter-row">'+
'<div class="fighter player'+(battle.turn%2===1&&!battle.over?' active':'')+'"><div class="fighter-circle" style="border:2px solid '+plCol+';background:radial-gradient(circle at 34% 28%,'+rgba(plCol,.4)+',#0f141a 72%);color:'+plCol+'">'+SPECIES[pl.sp].n+'</div><div class="fighter-name">'+pl.name+'</div><div class="fighter-sp">Lv.'+pl.fightLv+' · '+RARITY[pl.q].n+'</div><div class="fighter-hp"><i style="width:'+(plHpPct*100)+'%;background:'+(plHpPct>.5?'#3fb950':plHpPct>.25?'#f0b72f':'#f85149')+'"></i></div><div class="fighter-hpt">'+battle.playerHp+' / '+battle.playerMaxHp+'</div></div>'+
'<div class="vs-badge">VS</div>'+
'<div class="fighter enemy'+(battle.turn%2===0&&!battle.over?' active':'')+'"><div class="fighter-circle" style="border:2px solid '+enCol+';background:radial-gradient(circle at 34% 28%,'+rgba(enCol,.4)+',#0f141a 72%);color:'+enCol+'">'+SPECIES[en.sp].n+'</div><div class="fighter-name">'+en.name+'</div><div class="fighter-sp">Lv.'+en.fightLv+' · '+RARITY[en.q].n+'</div><div class="fighter-hp"><i style="width:'+(enHpPct*100)+'%;background:'+(enHpPct>.5?'#3fb950':enHpPct>.25?'#f0b72f':'#f85149')+'"></i></div><div class="fighter-hpt">'+battle.enemyHp+' / '+battle.enemyMaxHp+'</div></div></div>'+
'<div class="battle-log" id="battleLog">'+logHtml+'</div>'+
(battle.over?'<div class="act-row"><button class="act wide gold" id="rematch">⚔️ 再战一场</button><button class="act wide" id="backArena">返回斗虫场</button></div>':'<div class="skill-bar">'+skillsHtml+'</div>')+

v.querySelectorAll('[data-skill]').forEach(btn=>{btn.onclick=function(){playerUseSkill(btn.dataset.skill)}});
if(battle.over){

if(rb)rb.onclick=function(){sfxClick();battle=null;renderArena()};

}
}

function openAuction(){

sfxSell();toast('拍卖成交 +'+final+'🪙','#f0b72f');log('拍卖成交 · '+b.name+' +'+final,'gold');
levelCheck();checkAch();closeModal();render();
}})});
}
function openContest(){
const list=[];G.tanks.forEach(t=>t.bugs.forEach(b=>{if(b.mature&&b.alive)list.push(b)}));
if(!list.length){openModal('🏆 比赛','<div class="empty-note">没有可参赛的成熟虫</div>');return}
const html='<div style="font-size:12px;color:#7d8590;margin-bottom:10px">按品相、体型、变异、斗虫等级综合评分，报名费 80🪙</div>'+
list.map(function(b){const score=Math.round(b.q*18+b.size*30+(b.mut?45:0)+b.fightLv*10);return '<div class="row click" data-con="'+b.id+'"><span class="row-label">'+b.name+' · '+SPECIES[b.sp].n+' · '+RARITY[b.q].n+'</span><b>评分 '+score+'</b></div>'}).join('');
openModal('🏆 比赛展览',html,function(body){body.querySelectorAll('[data-con]').forEach(function(r){r.onclick=function(){
if(G.coins<80){toast('金币不足','#f85149');return}
const b=list.find(x=>x.id===+r.dataset.con);if(!b)return;
G.coins-=80;const score=b.q*18+b.size*30+(b.mut?45:0)+b.fightLv*10;
if(score>60){const prize=Math.round(150+score*9);G.coins+=prize;G.stats.contests++;toast('夺冠！+'+prize+'🪙','#f0b72f');log('比赛夺冠 · '+b.name+' +'+prize,'gold');sfxWin();checkAch()}
else{toast('未获奖，得分 '+Math.round(score),'#7d8590');sfxLose()}
closeModal();render();
}})});
}
function openShop(){
let html='<div class="section-label">道具</div>';
const items=[
{k:'medicine',n:'广谱药',c:60,d:'治愈一只病虫'},
{k:'antipara',n:'驱虫剂',c:80,d:'清除寄生虫'},
{k:'disinfect',n:'消毒剂',c:40,d:'全场清洁拉满'},
{k:'vitamin',n:'维生素',c:50,d:'全体回血回心情'},
{k:'mutagen',n:'诱变剂',c:400,d:'强制触发一次变异'},

];
items.forEach(function(it){html+='<div class="row click" data-item="'+it.k+'"><span class="row-label">'+it.n+' · '+it.d+'</span><b>🪙 '+it.c+'</b></div>'});

UPGRADES.forEach(function(u){const has=!!t.upgrades[u.id];html+='<div class="row'+(has?'':' click')+'" style="opacity:'+(has?'.45':'1')+'" data-up="'+t.id+'_'+u.id+'"><span class="row-label">'+u.n+' · '+u.d+'</span><b>'+(has?'已装':'🪙 '+u.cost)+'</b></div>'});

openModal('🛒 商店',html,function(body){
body.querySelectorAll('[data-item]').forEach(function(r){r.onclick=function(){buyItem(r.dataset.item)}});
body.querySelectorAll('[data-up]').forEach(function(r){r.onclick=function(){
const parts=r.dataset.up.split('_');const t=G.tanks.find(x=>x.id===+parts[0]);const u=UPGRADES.find(x=>x.id===parts[1]);
if(!t||!u)return;
if(t.upgrades[u.id]){toast('已安装','#7d8590');return}
if(G.coins<u.cost){toast('金币不足','#f85149');return}
G.coins-=u.cost;t.upgrades[u.id]=1;
if(u.type==='cap')t.capacity+=u.amt;

function buyItem(k){
const prices={medicine:60,antipara:80,disinfect:40,vitamin:50,mutagen:400,cutter:900};
if(G.coins<prices[k]){toast('金币不足','#f85149');return}
if(k==='medicine'){const b=findAnyBug(x=>x.alive&&x.disease);if(!b){toast('没有生病的虫','#7d8590');return}G.coins-=prices[k];b.disease=null;b.hp=clamp(b.hp+22,0,100);G.stats.cured++;sfxBuy();toast(b.name+' 痊愈了','#3fb950')}
else if(k==='antipara'){const b=findAnyBug(x=>x.alive&&x.parasite);if(!b){toast('没有寄生虫','#7d8590');return}G.coins-=prices[k];b.parasite=null;b.hp=clamp(b.hp+14,0,100);sfxBuy();toast(b.name+' 驱虫成功','#3fb950')}
else if(k==='disinfect'){G.coins-=prices[k];G.tanks.forEach(t=>{t.cleanliness=100});sfxBuy();toast('全场消毒完成','#3fb950')}
else if(k==='vitamin'){G.coins-=prices[k];G.tanks.forEach(t=>t.bugs.forEach(b=>{b.hp=clamp(b.hp+15,0,100);b.mood=clamp(b.mood+15,0,100);b.flashUntil=Date.now()+600}));sfxBuy();toast('全体强化完成','#3fb950')}
else if(k==='mutagen'){const b=findAnyBug(x=>x.alive);if(!b){toast('没有可用的虫','#7d8590');return}G.coins-=prices[k];const m=rollMutReal(100);if(m){b.mut=m;b.flashUntil=Date.now()+1200;G.stats.mutated++;sfxMature();toast('诱变成功 · '+MUTS[m].n,'#f0b72f');log('诱变成功 · '+MUTS[m].n,'gold');checkAch()}else{sfxLose();toast('诱变失败','#7d8590')}}
else if(k==='cutter'){const b=findAnyBug(x=>x.alive);if(!b){toast('没有可用的虫','#7d8590');return}G.coins-=prices[k];b.genes={size:rand(0.75,1.35),speed:rand(0.75,1.35),appetite:rand(0.75,1.35),mut:rand(0.75,1.45)};b.flashUntil=Date.now()+900;sfxBuy();toast('基因重写完成','#58a6ff')}
closeModal();render();
}

html+='<div class="dex-cell '+(got?'got':'locked')+'">'+
'<div class="dc-dot" style="'+(got?'border-color:'+RARITY[d.best].c+';color:'+RARITY[d.best].c:'')+'">'+(got?sp.n.slice(0,1):'?')+'</div>'+
'<div class="dc-name">'+(got?sp.n:'???')+'</div>'+
(got?'<div class="dc-star">×'+d.count+'</div>':'')+'</div>';
});
html+='</div></div><div class="card"><div class="card-title">📊 统计</div>'+

'<div class="row"><span class="row-label">累计收入</span><b>'+G.stats.earned.toLocaleString()+'🪙</b></div>'+
'<div class="row"><span class="row-label">野外抓虫</span><b>'+(G.stats.caught||0)+'</b></div>'+

'<div class="row"><span class="row-label">克隆次数</span><b>'+(G.stats.clones||0)+'</b></div>'+
'<div class="row"><span class="row-label">斗虫场次</span><b>'+G.stats.fights+'</b></div></div>';
host.innerHTML=html;
}
function renderLab(host){
let html='<div class="card"><div class="card-title">🔬 研究所</div>'+
'<div class="row"><span class="row-label">等级</span><b>Lv.'+G.level+'</b></div>'+
'<div class="prog-row"><div class="prog-head"><span>经验</span><b>'+Math.round(G.exp)+' / '+(G.level*400)+'</b></div><div class="prog-bar"><i style="width:'+Math.min(100,G.exp/(G.level*400)*100)+'%;background:#58a6ff"></i></div></div>'+
'<div class="row"><span class="row-label">研究点</span><b>'+G.research+'</b></div>'+
'<div class="act-row">'+
'<button class="act" id="openBreed">🧬 繁殖</button>'+
'<button class="act" id="openLogBtn">📜 日志</button>'+
'<button class="act danger wide" id="openReset">🗑 重置存档</button>'+
'</div></div>';
html+='<div class="card"><div class="card-title">🏆 成就</div>';
ACHS.forEach(function(a){const got=G.ach[a.k];html+='<div class="row" style="opacity:'+(got?'1':'.5')+'"><span class="row-label">'+(got?'🏆 ':'🔒 ')+a.n+' · '+a.d+'</span><b>'+(got?'已达成':'+'+a.r+'🪙')+'</b></div>'});
html+='</div>';

host.querySelector('#openBreed').onclick=()=>{sfxClick();openBreedModal(null)};
host.querySelector('#openLogBtn').onclick=()=>{sfxClick();openLog()};
host.querySelector('#openReset').onclick=()=>{if(confirm('确定要重置所有进度吗？')){localStorage.removeItem(SAVE_KEY);location.reload()}};
}
function openLog(){
const html='<div class="log-list">'+(G.log.length?G.log.slice(-60).reverse().map(function(l){return '<div class="log-item '+l.t+'">'+l.m+'</div>'}).join(''):'<div class="empty-note">暂无记录</div>')+'</div>';
openModal('📜 事件日志',html);
}
function openBreedModal(pre){
const candidates=[];
G.tanks.forEach(t=>t.bugs.forEach(b=>{if(b.mature&&b.alive)candidates.push(b)}));
if(candidates.length<2){openModal('🧬 繁殖','<div class="empty-note">至少需要两只成熟虫才能繁殖</div>');return}
let sel1=pre||null;let sel2=null;
if(sel1)sel2=candidates.find(b=>b!==sel1&&b.sp===sel1.sp)||null;
function pickHtml(list,sel){return list.map(function(b){const on=b===sel?' gold':'';return '<button class="act'+on+'" data-id="'+b.id+'" style="font-size:10px;flex-direction:column">'+b.name+'<br>'+SPECIES[b.sp].n+'<br>'+RARITY[b.q].n+'</button>'}).join('')}
function renderPick(){
const body=document.querySelector('#modalHost .modal-body');if(!body)return;
body.querySelector('#pickA').innerHTML=pickHtml(candidates,sel1);
body.querySelector('#pickB').innerHTML=pickHtml(candidates.filter(b=>b!==sel1),sel2);
body.querySelectorAll('#pickA [data-id]').forEach(function(el){el.onclick=function(){sel1=candidates.find(b=>b.id===+el.dataset.id);if(sel2===sel1)sel2=null;renderPick()}});
body.querySelectorAll('#pickB [data-id]').forEach(function(el){el.onclick=function(){sel2=candidates.find(b=>b.id===+el.dataset.id);renderPick()}});
const info=body.querySelector('#breedInfo');
if(sel1&&sel2){
if(sel1.sp!==sel2.sp)info.innerHTML='<div class="row" style="border-color:rgba(248,81,73,.5)"><span class="row-label">品种不同，无法繁殖</span><b style="color:#f85149">✕</b></div>';
else{const qMax=Math.max(sel1.q,sel2.q);const luck=Math.min(60,Math.round(((sel1.genes.mut+sel2.genes.mut)/2-1)*40+22));
info.innerHTML='<div class="row"><span class="row-label">子代品相基础</span><b>'+RARITY[qMax].n+'</b></div>'+'<div class="row"><span class="row-label">变异概率</span><b>~'+Math.max(0,luck)+'%</b></div>'+'<div class="row"><span class="row-label">消耗饲料</span><b>120🌾</b></div>'}
}else info.innerHTML='<div class="row"><span class="row-label">请选择两只亲代</span><b></b></div>';
}
const html='<div style="font-size:12px;color:#7d8590;margin-bottom:10px">同种成熟虫交配，子代继承基因并可能变异</div>'+
'<div class="section-label">亲代 A</div><div id="pickA" class="act-row" style="grid-template-columns:1fr 1fr 1fr"></div>'+
'<div class="section-label">亲代 B</div><div id="pickB" class="act-row" style="grid-template-columns:1fr 1fr 1fr"></div>'+
'<div class="section-label">预览</div><div id="breedInfo"></div>'+
'<div class="act-row"><button class="act wide gold" id="doBreed">🧬 开始繁殖（120🌾）</button></div>';
openModal('🧬 繁殖交配',html,function(body){renderPick();body.querySelector('#doBreed').onclick=function(){
if(!sel1||!sel2){toast('请选择两只虫','#f85149');return}
if(sel1.sp!==sel2.sp){toast('必须同种才能繁殖','#f85149');return}
doBreed(sel1,sel2);closeModal();
}});
}
function doBreed(b1,b2){
if(G.food<120){toast('饲料不足','#f85149');return}
const tank=findTankOf(b1);if(!tank){toast('找不到虫缸','#f85149');return}
if(tank.bugs.length>=tank.capacity){toast('缸内空间不足','#f85149');return}
G.food-=120;
const inherit={gs:(b1.genes.size+b2.genes.size)/2,gv:(b1.genes.speed+b2.genes.speed)/2,ga:(b1.genes.appetite+b2.genes.appetite)/2,gm:(b1.genes.mut+b2.genes.mut)/2};
const qBase=Math.max(b1.q,b2.q);const childCount=1+((b1.genes.mut+b2.genes.mut)>2.4?1:0);
for(let i=0;i<childCount;i++){
let cq=qBase;if(Math.random()<0.07)cq=Math.min(RARITY.length-1,qBase+1);
const child=makeBug(b1.sp,{q:cq,gs:inherit.gs+rand(-0.1,0.1),gv:inherit.gv+rand(-0.1,0.1),ga:inherit.ga+rand(-0.1,0.1),gm:inherit.gm+rand(-0.12,0.12)});
if(b1.mut&&Math.random()<0.3)child.mut=b1.mut;else if(b2.mut&&Math.random()<0.3)child.mut=b2.mut;
tank.bugs.push(child);
if(child.mut){G.stats.mutated++;log('繁殖出变异虫 · '+MUTS[child.mut].n,'gold');toast('变异！'+MUTS[child.mut].n,'#f0b72f');sfxMature();checkAch()}
}
G.stats.bred++;b1.mood=clamp(b1.mood+10,0,100);b2.mood=clamp(b2.mood+10,0,100);
sfxFeed();toast('繁殖成功，获得 '+childCount+' 只幼虫','#3fb950');log('繁殖成功 · '+SPECIES[b1.sp].n+' × '+childCount,'good');
levelCheck();render();
}
let tutStep=0;
function showTutorial(){tutStep=0;document.getElementById('tutOverlay').classList.add('open');renderTut()}
function renderTut(){
const t=TUTS[tutStep];
document.getElementById('tutStep').textContent='第 '+(tutStep+1)+' / '+TUTS.length+' 步';
document.getElementById('tutTitle').textContent=t.t;
document.getElementById('tutText').textContent=t.x;
const dots=document.getElementById('tutDots');dots.innerHTML='';
TUTS.forEach((_,i)=>{const d=document.createElement('div');d.className='tut-dot'+(i===tutStep?' on':'');dots.appendChild(d)});
document.getElementById('tutNext').textContent=tutStep===TUTS.length-1?'开始游戏':'下一步';
}
function bindUI(){
document.getElementById('hudFeed').onclick=function(){sfxBuy();if(G.coins<FOOD_BUY_COST){toast('金币不足','#f85149');return}G.coins-=FOOD_BUY_COST;G.food=Math.min(foodCap(),G.food+FOOD_BUY_GAIN);toast('饲料 +'+FOOD_BUY_GAIN,'#3fb950');renderHUD()};
document.getElementById('hudSound').onclick=function(){soundOn=!soundOn;document.getElementById('hudSound').textContent=soundOn?'🔊':'🔇';toast(soundOn?'音效开启':'音效关闭','#58a6ff');if(soundOn)sfxClick()};
document.getElementById('tutNext').onclick=function(){sfxClick();if(tutStep<TUTS.length-1){tutStep++;renderTut()}else{document.getElementById('tutOverlay').classList.remove('open');G.tutorialDone=true;checkAch();save()}};
document.getElementById('tutSkip').onclick=function(){sfxClick();document.getElementById('tutOverlay').classList.remove('open');G.tutorialDone=true;save()};
document.getElementById('catchClose').onclick=function(){sfxClick();closeCatch()};
document.querySelectorAll('.tab').forEach(function(t){
t.onclick=function(){
sfxClick();
document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on')});
t.classList.add('on');
G.view=t.dataset.v;battle=null;closeModal();render();
};
});
}
function init(){
const loaded=load();
if(!loaded){
G.tanks=[makeTank(0,'一号缸'),makeTank(1,'二号缸'),makeTank(2,'三号缸')];
G.tanks[0].bugs.push(makeBug('ant'));
G.tanks[0].bugs.push(makeBug('mealworm'));
rollMarket();genOrders();
log('欢迎来到虫虫研究所','good');
}
G.tanks.forEach(function(t){
if(!t.upgrades)t.upgrades={};
if(!t.bugs)t.bugs=[];
t.bugs.forEach(function(b){
if(!b.name)b.name=genName();
if(!b.genes)b.genes={size:1,speed:1,appetite:1,mut:1};
if(b.x===undefined)b.x=rand(0.15,0.85);if(b.y===undefined)b.y=rand(0.2,0.7);
if(b.vx===undefined)b.vx=0;if(b.vy===undefined)b.vy=0;if(b.wander===undefined)b.wander=0;
if(b.flashUntil===undefined)b.flashUntil=0;if(b.age===undefined)b.age=0;
if(b.mood===undefined)b.mood=75;if(b.disease===undefined)b.disease=null;
if(b.parasite===undefined)b.parasite=null;if(b.symbiont===undefined)b.symbiont=null;
if(b.fightLv===undefined)b.fightLv=1;if(b.fightExp===undefined)b.fightExp=0;
if(b.wins===undefined)b.wins=0;if(b.losses===undefined)b.losses=0;
if(!b.skills)b.skills=(SP_SKILLS[b.sp]||['jab','guard','rush','heavy']).slice();
if(b.atkBonus===undefined)b.atkBonus=0;if(b.defBonus===undefined)b.defBonus=0;if(b.hpBonus===undefined)b.hpBonus=0;
if(b.title===undefined)b.title=null;if(b.cloneCount===undefined)b.cloneCount=0;if(b.isClone===undefined)b.isClone=false;
});
});
if(!G.market||!Object.keys(G.market).length)rollMarket();
if(!G.orders||!G.orders.length)genOrders();
if(!G.tools)G.tools={net:3,trap:1,bait:2};
applyOffline();bindUI();render();
requestAnimationFrame(loop);
setInterval(function(){save();if(G.view==='tanks')renderHUD()},5000);
document.addEventListener('visibilitychange',function(){
if(document.hidden)save();
else{const el=(Date.now()-G.lastTime)/1000;if(el>15){applyOffline();render()}lastT=performance.now()}
});
window.addEventListener('beforeunload',save);
}
const _hasSave=!!localStorage.getItem(SAVE_KEY);
if(_hasSave){
document.getElementById('diffScreen').style.display='none';
document.getElementById('app').style.display='block';
document.getElementById('tabbar').style.display='flex';
init();
}else{
document.querySelectorAll('.diff-btn').forEach(function(btn){
btn.addEventListener('mousemove',function(e){
const r=btn.getBoundingClientRect();
btn.style.setProperty('--x',((e.clientX-r.left)/r.width*100)+'%');
btn.style.setProperty('--y',((e.clientY-r.top)/r.height*100)+'%');
});
btn.onclick=function(){
sfxClick();
G.difficulty=btn.dataset.diff;
G.coins=DIFFS[G.difficulty].startCoins;
G.food=DIFFS[G.difficulty].startFood;
document.getElementById('diffScreen').style.display='none';
document.getElementById('app').style.display='block';
document.getElementById('tabbar').style.display='flex';
init();
setTimeout(showTutorial,300);
};
});
}
