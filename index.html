<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>丝滑笔记本</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#333;min-height:100vh;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom)}
        .bg-layer{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,.75);z-index:-1;transition:opacity .3s}
        
        /* 顶部栏 */
        .topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:15px;background:rgba(255,255,255,.9);backdrop-filter:blur(15px);border-bottom:1px solid rgba(0,0,0,.05)}
        .topbar h1{font-size:1.5rem;font-weight:700}
        .icon-btn{background:none;border:none;font-size:1.3rem;padding:8px;border-radius:50%;cursor:pointer;transition:transform .2s}
        .icon-btn:active{transform:scale(.8)}
        
        /* 下拉菜单 */
        .dropdown{position:absolute;right:15px;top:60px;background:#fff;border-radius:15px;box-shadow:0 8px 30px rgba(0,0,0,.1);padding:10px;z-index:100;display:none;width:160px}
        .dropdown.show{display:block}
        .dropdown div{padding:12px 15px;font-size:.9rem;border-radius:8px;cursor:pointer}
        .dropdown div:hover{background:#f0f2f5}
        
        /* 列表视图 */
        .list-view{display:flex;flex-direction:column;gap:10px;padding:15px}
        .item-card{background:#fff;border-radius:15px;padding:20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 10px rgba(0,0,0,.03);cursor:pointer;transition:transform .2s,box-shadow .2s}
        .item-card:active{transform:scale(.97);box-shadow:0 1px 5px rgba(0,0,0,.05)}
        .item-title{font-size:1.2rem;font-weight:600}
        .item-count{font-size:.85rem;color:#888}
        .card-title h3{font-size:1.2rem;margin-bottom:8px}
        
        /* 空状态 */
        .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:#aaa}
        .empty .icon{font-size:4rem;margin-bottom:15px}
        .empty p{font-size:.95rem}
        
        /* 编辑区全屏 */
        #editorView{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);z-index:200;display:flex;flex-direction:column}
        .editor-header{display:flex;align-items:center;justify-content:space-between;padding:10px 15px;background:rgba(255,255,255,.95);border-bottom:1px solid #eee}
        .editor-title{flex:1;border:none;outline:none;font-size:1.8rem;font-weight:700;background:transparent;margin-left:10px;color:#222}
        
        /* 编辑器工具栏（底层包含字号、插图、大小调节） */
        .toolbar{display:flex;align-items:center;gap:12px;padding:8px 15px;background:rgba(255,255,255,.95);border-top:1px solid #eee;border-bottom:1px solid #eee}
        .toolbar input[type=range]{flex:1;max-width:150px;height:4px;-webkit-appearance:none;background:#ddd;border-radius:4px}
        .toolbar input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#333}
        .toolbar button{background:#f5f5f5;border:none;padding:6px 10px;border-radius:8px;font-size:.9rem;cursor:pointer}
        
        /* 内容区：多行文本 + 插图 */
        #contentArea{flex:1;overflow-y:auto;padding:10px 15px;background:transparent}
        #editorContent{width:100%;border:none;outline:none;background:transparent;font-size:1.1rem;line-height:1.8;resize:none;color:#333}
        .img-wrapper{position:relative;margin:15px 0;text-align:center}
        .img-wrapper img{max-width:100%;border-radius:12px;cursor:pointer;transition:transform .2s}
        .img-size-control{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.95);border-radius:20px;padding:5px 15px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 15px rgba(0,0,0,.1);font-size:.8rem}
        
        /* 悬浮添加按钮 */
        .add-btn{position:fixed;right:20px;bottom:25px;width:60px;height:60px;border-radius:50%;background:#333;color:#fff;font-size:2rem;border:none;box-shadow:0 8px 25px rgba(0,0,0,.2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s}
        .add-btn:active{transform:scale(.85)}
        
        /* 底部导航栏（仿截图） */
        .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(15px);display:flex;border-top:1px solid #eee;padding:8px 0 12px;z-index:50}
        .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;font-size:.75rem;color:#999;cursor:pointer}
        .nav-item.active{color:#333}
        .nav-item i{font-style:normal;font-size:1.4rem;margin-bottom:4px}
        
        /* 横屏适配：压缩高度，保证输入不被遮挡 */
        @media (orientation:landscape){
            .topbar{padding:8px 15px}
            .editor-title{font-size:1.4rem}
            .toolbar{padding:5px 15px}
            #contentArea{padding:5px 15px}
            #editorContent{font-size:1rem;line-height:1.6}
            .bottom-nav{padding:5px 0}
        }
        
        /* 弹窗 */
        .modal{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:flex;align-items:flex-end}
        .modal-content{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:20px 20px 30px;animation:slideUp .3s ease}
        @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
        .modal-content h3{margin-bottom:15px}
        .color-picker{display:flex;gap:12px;margin-bottom:20px}
        .color-dot{width:25px;height:25px;border-radius:50%;border:none;cursor:pointer}
        .input-group{margin-bottom:15px}
        .input-group input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:1rem;outline:none}
        .modal-btns{display:flex;justify-content:space-between;color:#333;font-size:1rem;padding-top:10px;border-top:1px solid #eee}
        .modal-btns span{cursor:pointer;padding:10px}
        .modal-btns .save{color:#007aff}
        
        .hidden{display:none!important}
    </style>
</head>
<body>
<div class="bg-layer" id="bgLayer"></div>

<!-- 主页 -->
<div id="homeView" style="padding-bottom:80px">
    <div class="topbar">
        <h1 id="mainTitle">全部笔记</h1>
        <div style="display:flex">
            <button class="icon-btn" onclick="toggleDropdown()">⋮</button>
        </div>
    </div>
    
    <div class="dropdown" id="dropdown">
        <div onclick="viewMode('grid')">宫格视图</div>
        <div onclick="viewMode('list')">列表视图</div>
        <div onclick="openSettings()">设置</div>
    </div>

    <div id="noteList" class="list-view"></div>
    
    <div id="emptyState" class="empty hidden">
        <div class="icon">🗒️</div>
        <p>没有笔记</p>
    </div>
</div>

<!-- 本子/文件夹视图 -->
<div id="notebookView" class="hidden" style="padding-bottom:80px">
    <div class="topbar">
        <button class="icon-btn" onclick="showHome()">←</button>
        <h1 id="nbTitle"></h1>
        <div></div>
    </div>
    <div id="pageList" class="list-view"></div>
    <button class="add-btn" onclick="createPage()">+</button>
</div>

<!-- 编辑器 -->
<div id="editorView" class="hidden">
    <div class="editor-header">
        <button class="icon-btn" onclick="saveAndExit()">←</button>
        <input type="text" class="editor-title" id="editTitle" placeholder="标题">
        <button class="icon-btn" onclick="saveAndExit()">✓</button>
    </div>
    
    <div class="toolbar">
        <button onclick="pickImage()">🖼️ 插图</button>
        <div style="display:flex;align-items:center;flex:1;gap:5px">
            <span style="font-size:.8rem">字号</span>
            <input type="range" id="fontSlider" min="12" max="36" value="18" oninput="changeFont()">
        </div>
    </div>
    
    <div id="contentArea">
        <textarea id="editorContent" placeholder="开始输入..."></textarea>
    </div>
</div>

<!-- 新建笔记本弹窗 -->
<div class="modal hidden" id="newNbModal">
    <div class="modal-content">
        <h3>新建笔记本</h3>
        <div class="color-picker">
            <button class="color-dot" style="background:#ff3b30" onclick="this.style.outline='3px solid #333'"></button>
            <button class="color-dot" style="background:#ff9500" onclick="this.style.outline='3px solid #333'"></button>
            <button class="color-dot" style="background:#ffcc00" onclick="this.style.outline='3px solid #333'"></button>
            <button class="color-dot" style="background:#4cd964" onclick="this.style.outline='3px solid #333'"></button>
            <button class="color-dot" style="background:#5ac8fa" onclick="this.style.outline='3px solid #333'"></button>
            <button class="color-dot" style="background:#007aff" onclick="this.style.outline='3px solid #333'"></button>
        </div>
        <div class="input-group">
            <input type="text" id="nbNameInput" placeholder="名称">
        </div>
        <div class="modal-btns">
            <span onclick="closeNewNb()">取消</span>
            <span class="save" onclick="saveNewNb()">保存</span>
        </div>
    </div>
</div>

<!-- 设置弹窗 -->
<div class="modal hidden" id="settingsModal">
    <div class="modal-content">
        <h3>设置</h3>
        <div class="input-group">
            <label style="display:block;font-size:.8rem;color:#888;margin-bottom:5px">背景图片（永久保存）</label>
            <input type="file" accept="image/*" onchange="uploadBg(event)">
        </div>
        <div class="input-group">
            <label style="display:block;font-size:.8rem;color:#888;margin-bottom:5px">背景透明度</label>
            <input type="range" id="bgOpacity" min="0" max="90" value="75" oninput="setBgOpacity()" style="width:100%">
        </div>
        <div class="modal-btns">
            <span onclick="closeSettings()">取消</span>
            <span class="save" onclick="closeSettings()">确定</span>
        </div>
    </div>
</div>

<script>
    const KEY='my_notes_app'; // 核心键不变，老数据100%保留
    let st={view:'notebook',nb:0,page:0};let fileReader=null;
    
    function loadData(){const d=localStorage.getItem(KEY);return d?JSON.parse(d):{notebooks:[]}}
    function saveData(d){localStorage.setItem(KEY,JSON.stringify(d))}
    
    function showHome(){document.getElementById('homeView').classList.remove('hidden');document.getElementById('notebookView').classList.add('hidden');document.getElementById('editorView').classList.add('hidden');document.getElementById('mainTitle').textContent='全部笔记';renderNotes()}
    function showNotebook(){document.getElementById('homeView').classList.add('hidden');document.getElementById('notebookView').classList.remove('hidden');document.getElementById('editorView').classList.add('hidden');renderPages()}
    function showEditor(){document.getElementById('homeView').classList.add('hidden');document.getElementById('notebookView').classList.add('hidden');document.getElementById('editorView').classList.remove('hidden');startAutoSave()}
    
    function renderNotes(){
        const d=loadData();const list=document.getElementById('noteList');list.innerHTML='';
        if(d.notebooks.length===0){document.getElementById('emptyState').classList.remove('hidden');return}
        document.getElementById('emptyState').classList.add('hidden');
        d.notebooks.forEach((nb,i)=>{
            list.innerHTML+=`<div class="item-card" onclick="enterNb(${i})">
                <div><div class="item-title">📁 ${nb.name}</div><div class="item-count">${nb.pages.length} 条笔记</div></div>
                <span style="font-size:1.2rem;color:#ccc">›</span>
            </div>`;
        });
    }
    
    function renderPages(){
        const d=loadData();const nb=d.notebooks[st.nb];document.getElementById('nbTitle').textContent=nb.name;
        const list=document.getElementById('pageList');list.innerHTML='';
        nb.pages.forEach((p,i)=>{
            const preview=p.content ? p.content.substring(0,20)+'...' : '空笔记';
            list.innerHTML+=`<div class="item-card" onclick="enterPg(${i})">
                <div><div class="item-title">📝 第${i+1}页</div><div class="item-count">${preview}</div></div>
                <span style="font-size:1.2rem;color:#ccc">›</span>
            </div>`;
        });
    }
    
    function enterNb(i){st.nb=i;showNotebook()}
    function enterPg(i){st.page=i;showEditor()}
    function createPage(){const d=loadData();const nb=d.notebooks[st.nb];nb.pages.push({title:'无标题',content:'',images:[]});saveData(d);renderPages()}
    
    function saveAndExit(){const d=loadData();const p=d.notebooks[st.nb].pages[st.page];p.title=document.getElementById('editTitle').value;p.content=document.getElementById('editorContent').value;saveData(d);showNotebook()}
    
    function toggleDropdown(){document.getElementById('dropdown').classList.toggle('show')}
    function viewMode(m){document.getElementById('noteList').className=m==='grid'?'grid-view':'list-view';document.getElementById('dropdown').classList.remove('show')}
    
    /* 字号调节 */
    function changeFont(){const v=document.getElementById('fontSlider').value;document.getElementById('editorContent').style.fontSize=v+'px'}
    
    /* 无限行数：删除所有限制 */
    function startAutoSave(){clearInterval(window._timer);window._timer=setInterval(()=>{const d=loadData();const p=d.notebooks[st.nb].pages[st.page];p.title=document.getElementById('editTitle').value;p.content=document.getElementById('editorContent').value;saveData(d)},3000)}
    
    /* 插图功能 */
    function pickImage(){const input=document.createElement('input');input.type='file';input.accept='image/*';input.onchange=(e)=>{const file=e.target.files[0];const reader=new FileReader();reader.onload=(ev)=>{insertImage(ev.target.result)};reader.readAsDataURL(file)};input.click()}
    
    function insertImage(src){
        const content=document.getElementById('editorContent');
        const wrapper=document.createElement('div');wrapper.className='img-wrapper';
        const img=document.createElement('img');img.src=src;img.style.width='80%';
        const sizeCtrl=document.createElement('div');sizeCtrl.className='img-size-control';
        sizeCtrl.innerHTML='<span style="font-size:.7rem">调大小</span><input type="range" min="20" max="100" value="80" style="width:80px">';
        sizeCtrl.querySelector('input').oninput=(e)=>{img.style.width=e.target.value+'%'};
        wrapper.appendChild(img);wrapper.appendChild(sizeCtrl);
        content.insertAdjacentElement('beforebegin',wrapper);
    }
    
    /* 新建笔记本 */
    function openNewNb(){document.getElementById('newNbModal').classList.remove('hidden')}
    function closeNewNb(){document.getElementById('newNbModal').classList.add('hidden')}
    function saveNewNb(){const name=document.getElementById('nbNameInput').value||'新笔记本';const d=loadData();d.notebooks.push({name:name,pages:[]});saveData(d);closeNewNb();renderNotes()}
    
    /* 设置 */
    function openSettings(){document.getElementById('settingsModal').classList.remove('hidden')}
    function closeSettings(){document.getElementById('settingsModal').classList.add('hidden')}
    function uploadBg(e){const file=e.target.files[0];const reader=new FileReader();reader.onload=(ev)=>{document.body.style.backgroundImage=`url(${ev.target.result})`;localStorage.setItem('bg_img',ev.target.result)};reader.readAsDataURL(file)}
    function setBgOpacity(){const v=document.getElementById('bgOpacity').value;document.getElementById('bgLayer').style.opacity=v/100;localStorage.setItem('bg_opacity',v)}
    
    /* 横屏适配：使用 visualViewport，防止键盘遮字 */
    function fixViewport(){const vv=window.visualViewport;if(vv){document.getElementById('contentArea').style.height=`${vv.height-130}px`}}
    window.visualViewport?.addEventListener('resize',fixViewport);
    window.addEventListener('orientationchange',()=>setTimeout(fixViewport,200));
    
    function loadSettings(){if(localStorage.getItem('bg_img'))document.body.style.backgroundImage=`url(${localStorage.getItem('bg_img')})`;if(localStorage.getItem('bg_opacity')){document.getElementById('bgOpacity').value=localStorage.getItem('bg_opacity');setBgOpacity()}}
    
    /* 注意：这里为了保留老用户的数据，加了"兼容逻辑"：如果之前有"本子"结构，直接转换过来 */
    function migrateData(){
        const d=loadData();
        if(d.notebooks.length===0 && d.pages){d.notebooks=[{name:'我的笔记',pages:Array.from({length:5},()=>({title:'无标题',content:''}))}]}
        saveData(d);
    }
    
    showHome();loadSettings();migrateData();
</script>
</body>
</html>
