<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC 结构导入工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b0b14;
            color: #e0e0e0;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .app {
            max-width: 900px;
            margin: 0 auto;
            background: #1a1a28;
            border-radius: 16px;
            padding: 24px;
            border: 1px solid #2e2e42;
        }
        h1 {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #f6d365, #fda085);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 24px;
        }
        .flex { display: flex; gap: 12px; flex-wrap: wrap; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .card {
            background: #0f0f1a;
            border-radius: 12px;
            padding: 16px;
            border: 1px solid #333;
            margin-bottom: 16px;
        }
        .card-title {
            font-size: 14px;
            color: #888;
            margin-bottom: 10px;
        }
        input {
            background: #1a1a28;
            color: #fff;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 14px;
            width: 100%;
            font-family: 'Consolas', monospace;
        }
        input:focus { outline: none; border-color: #4a6aff; }
        .btn {
            background: #2a2a3e;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            margin-top: 8px;
        }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.2); }
        .btn-primary { background: #4a6aff; }
        .btn-success { background: #3ccf7e; }
        .output-box {
            background: #0b0b16;
            border: 1px solid #2a2a3a;
            border-radius: 10px;
            padding: 16px;
            font-size: 14px;
            font-family: 'Consolas', monospace;
            word-break: break-all;
            white-space: pre-wrap;
            min-height: 100px;
            color: #4a6aff;
        }
        .copy-btn {
            position: relative;
            top: -40px;
            right: 0;
            background: #2a2a3e;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="app">
    <h1>⛏️ MC 结构导入工具</h1>

    <div class="card">
        <div class="card-title">📁 上传结构文件</div>
        <input type="file" id="structureFile" accept=".mcstructure">
    </div>

    <div class="card">
        <div class="card-title">📍 导入位置</div>
        <div class="grid-3">
            <div><label>X</label><input type="number" id="importX" value="0"></div>
            <div><label>Y</label><input type="number" id="importY" value="64"></div>
            <div><label>Z</label><input type="number" id="importZ" value="0"></div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">🤖 机器人设置</div>
        <div class="grid-3">
            <div><label>盔甲架名称</label><input type="text" id="robotName" value="导入机器人"></div>
            <div><label>指令类型</label>
                <select id="commandType" style="background:#1a1a28;color:#fff;padding:8px 12px;border:1px solid #333;border-radius:6px;">
                    <option value="setblock">setblock</option>
                    <option value="fill">fill（连续区域）</option>
                </select>
            </div>
            <div><label>方块ID</label><input type="text" id="defaultBlock" value="stone"></div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">📋 生成结果</div>
        <div class="output-box" id="output">上传文件后点击按钮生成</div>
        <button class="btn copy-btn" onclick="copyOutput()">📋 复制</button>
    </div>

    <div class="card">
        <button class="btn btn-primary" onclick="generateCommands()">⚡ 生成指令</button>
    </div>
    <div class="card">
        <button class="btn btn-success" onclick="downloadTxt()">📥 下载 txt 文件</button>
    </div>
</div>

<!-- 引入 prismarine-nbt -->
<script type="module">
  import nbt from 'https://esm.run/prismarine-nbt';
  window.nbt = nbt;
</script>

<script>
    let parsedData = null; // 存储解析后的结构数据

    // 上传文件后自动解析
    document.getElementById('structureFile').addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        try {
            const buffer = await file.arrayBuffer();
            const { parsed } = await window.nbt.parse(buffer);
            parsedData = parsed;
            alert('✅ 结构文件解析成功！');
            console.log('解析结果:', parsedData);
        } catch (error) {
            alert('❌ 解析失败，请检查文件格式。');
            console.error('解析错误:', error);
        }
    });

    // 生成指令
    function generateCommands() {
        if (!parsedData) {
            document.getElementById('output').innerText = '⚠️ 请先上传结构文件！';
            return;
        }

        const robotName = document.getElementById('robotName').value || '导入机器人';
        const importX = parseInt(document.getElementById('importX').value) || 0;
        const importY = parseInt(document.getElementById('importY').value) || 64;
        const importZ = parseInt(document.getElementById('importZ').value) || 0;

        // 从解析结果中提取方块数据
        // 注意：这里需要根据你实际解析出的NBT结构来调整
        const blocks = parsedData?.value?.blocks?.value || [];
        const palette = parsedData?.value?.palette?.value || [];

        let commands = [];

        // 遍历所有方块
        for (let i = 0; i < blocks.length; i++) {
            const blockData = blocks[i];
            const pos = blockData?.pos?.value || [];
            const state = blockData?.state?.value || 0;

            const x = pos[0] || 0;
            const y = pos[1] || 0;
            const z = pos[2] || 0;

            // 获取方块ID
            const blockId = palette[state]?.name?.value || 'stone';

            // 生成 execute + setblock 指令
            commands.push(
                `/execute as @e[type=armor_stand,name=${robotName}] at @s run setblock ~${x} ~${y} ~${z} ${blockId}`
            );
        }

        document.getElementById('output').innerText = commands.join('\n');
        console.log('生成的指令:', commands);
    }

    // 复制到剪贴板
    function copyOutput() {
        const content = document.getElementById('output').innerText;
        if (!content || content.includes('⚠️')) return;
        navigator.clipboard.writeText(content).then(() => {
            alert('✅ 已复制到剪贴板！');
        });
    }

    // 下载txt
    function downloadTxt() {
        const content = document.getElementById('output').innerText;
        if (!content || content.includes('⚠️')) return;
        const blob = new Blob([content], {type: 'text/plain'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'mc_import.txt';
        a.click();
        URL.revokeObjectURL(url);
    }
</script>
</body>
</html>
