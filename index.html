<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>丝滑笔记本</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#f0f2f5;color:#333;min-height:100vh;overflow-x:hidden}
        /* 丝滑按压反馈 */
        .card{transition:transform .15s ease,box-shadow .15s ease,opacity .2s ease;cursor:pointer}
        .card:active{transform:scale(.95);opacity:.9}
        /* 背景处理 */
        .bg-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,.75);z-index:-1;transition:background .3s}
        .container{max-width:900px;margin:0 auto;padding:15px}
        
        /* 顶部导航 */
        .topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:10px;background:rgba(255,255,255,.8);backdrop-filter:blur(10px);border-radius:12px;margin-bottom:15px}
        .topbar h1{font-size:1.4rem;font-weight:700}
        .topbar button{background:none;border:none;font-size:1.2rem;cursor:pointer;padding:5px;transition:transform .15s}
        .topbar button:active{transform:scale(.8)}
        
        /* 本子卡片 */
        .nb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
        .notebook{background:rgba(255,255,255,.9);border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
        .notebook h3{font-size:1.1rem;margin-bottom:5px;word-break:break-all}
        .notebook p{color:#888;font-size:.85rem}
        
        /* 页面列表 */
        .pg-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
        .page{background:rgba(255,255,255,.9);border-radius:12px;padding:12px;box-shadow:0 1px 5px rgba(0,0,0,.04)}
        .page h4{font-size:.95rem;margin-bottom:3px}
        .page p{color:#aaa;font-size:.8rem;max-height:30px;overflow:hidden}
        
        /* 编辑器：动态高度适配键盘和横屏 */
        #editorView{position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;display:flex;flex-direction:column;background:rgba(255,255,255,.9);backdrop-filter:blur(15px)}
        .editor-top{display:flex;justify-content:space-between;align-items:center;padding:12px 15px;border-bottom:1px solid #eee}
        .editor-top button{background:none;border:none;font-size:1.3rem;cursor:pointer;padding:5px;transition:transform .15s}
        .editor-top button:active{transform:scale(.8)}
        .title-input{width:100%;border:none;outline:none;background:transparent;font-size:1.8rem;font-weight:700;color:#333;padding:15px 15px 5px}
        .auto-hint{color:#2e7d32;font-size:.75rem;padding:0 15px;margin-bottom:5px}
        
        /* 输入区：由 JS 动态设置高度 */
        #contentArea{flex:1;padding:0 15px;overflow-y:auto}
        #contentArea textarea{width:100%;height:100%;border:none;outline:none;background:transparent;font-size:1.1rem;line-height:1.7;color:#333;resize:none}
        
        /* 底部工具条 */
        .editor-bottom{display:flex;justify-content:space-between;align-items:center;padding:10px 15px;border-top:1px solid #eee;background:rgba(255,255,255,.95);transition:transform .2s}
        .editor-bottom button{padding:8px 18px;border:none;border-radius:20px;font-size:.9rem;cursor:pointer;transition:transform .15s}
        .editor-bottom button:active{transform:scale(.9)}
        .btn-save{background:#333;color:#fff}
        .btn-export{background:#eee;color:#333}
        
        /* 横屏时，底部工具条动态贴底 */
        @media (orientation:landscape){.editor-bottom{padding:5px 15px}.editor-bottom button{padding:6px 14px}.title-input{font-size:1.4rem}}
        
        /* 设置滑入 */
        .settings{position:fixed;bottom:0;left:0;right:0;z-index:200;background:rgba(255,255,255,.98);border-radius:20px 20px 0 0;padding:20px;box-shadow:0 -5px 20px rgba(0,0,0,.1);transition:transform .3s ease;transform:translateY(100%)}
        .settings.show{transform:translateY(0)}
        .settings h3{margin-bottom:10px}
        .settings label{display:block;margin-top:10px;font-size:.85rem;color:#666}
        .settings input[type=file]{margin-bottom:10px}
        .settings input[type=range]{width:100%}
        .settings .row{display:flex;gap:10px;margin-top:15px}
        .settings .row button{flex:1;padding:10px;border:none;border-radius:8px;cursor:pointer;transition:transform .15s}
        .settings .row button:active{transform:scale(.95)}
        .hidden{display:none!important}
    </style>
</head>
<body>
    <div class="bg-mask" id="bgMask"></div>
    <div class="container">
        <!-- 主页 -->
        <div id="homeView">
            <div class="topbar">
                <h1>📒 我的笔记本</h1>
                <div style="display:flex;gap:10px">
                    <button onclick="toggleSettings()">⚙️</button>
                </div>
            </div>
            <div id="nbList" class="nb-grid"></div>
        </div>

        <!-- 本子内部 -->
        <div id="notebookView" class="hidden">
            <div class="topbar">
                <button onclick="showHome()">←</button>
                <h1 id="nbTitle"></h1>
                <button onclick="exportNotebookTxt()">📤</button>
            </div>
            <div id="pgList" class="pg-list"></div>
        </div>

        <!-- 编辑器 -->
        <div id="editorView" class="hidden">
            <div class="editor-top">
                <button onclick="showNotebook()">←</button>
                <button onclick="savePage()">✓</button>
            </div>
            <input type="text" class="title-input" id="pgTitle" placeholder="标题">
            <div class="auto-hint" id="autoHint">⏱ 自动保存中...</div>
            <div id="contentArea">
                <textarea id="content" placeholder="开始输入..."></textarea>
            </div>
            <div class="editor-bottom">
                <button class="btn-export" onclick="exportPageTxt()">导出</button>
                <button class="btn-save" onclick="savePage()">保存</button>
            </div>
        </div>
    </div>

    <!-- 设置面板 -->
    <div class="settings" id="settingsPanel">
        <h3>⚙️ 设置</h3>
        <label for="bgUpload">背景图片</label>
        <input type="file" id="bgUpload" accept="image/*" onchange="handleBgUpload(event)">
        <label>透明度</label>
        <input type="range" id="bgOpacity" min="0" max="90" value="70" oninput="updateMask()">
        <div class="row">
            <button onclick="setBgColor('#f0f2f5')">浅灰底</button>
            <button onclick="setBgColor('#ffffff')">纯白底</button>
            <button onclick="clearBg()">清除</button>
        </div>
        <div class="row">
            <button onclick="saveSettings()">保存设置</button>
            <button onclick="toggleSettings()">取消</button>
        </div>
    </div>

    <script>
        const KEY='my_notes_app';let st={nb:0,pg:0};let timer=null;
        function load(){const d=localStorage.getItem(KEY);return d?JSON.parse(d):{notebooks:Array.from({length:5},(_,i)=>({name:`本子${i+1}`,pages:Array.from({length:5},()=>'')}))}}
        function save(d){localStorage.setItem(KEY,JSON.stringify(d))}
        function showHome(){document.getElementById('homeView').classList.remove('hidden');document.getElementById('notebookView').classList.add('hidden');document.getElementById('editorView').classList.add('hidden');renderNbs()}
        function showNotebook(){document.getElementById('homeView').classList.add('hidden');document.getElementById('notebookView').classList.remove('hidden');document.getElementById('editorView').classList.add('hidden');renderPgs()}
        function showEditor(){document.getElementById('homeView').classList.add('hidden');document.getElementById('notebookView').classList.add('hidden');document.getElementById('editorView').classList.remove('hidden');renderPg()}
        function renderNbs(){const d=load();const el=document.getElementById('nbList');el.innerHTML='';d.notebooks.forEach((n,i)=>{el.innerHTML+=`<div class="notebook card" onclick="enterNb(${i})"><h3>📘 ${n.name}</h3><p>${n.pages.filter(p=>p.trim()!=='').length}/5 页已写</p></div>`})}
        function renderPgs(){const d=load();const n=d.notebooks[st.nb];document.getElementById('nbTitle').textContent=n.name;const el=document.getElementById('pgList');el.innerHTML='';n.pages.forEach((p,i)=>{el.innerHTML+=`<div class="page card" onclick="enterPg(${i})"><h4>第 ${i+1} 页</h4><p>${p.trim()?p.substring(0,15)+'...':'空页'}</p></div>`})}
        function renderPg(){const d=load();const p=d.notebooks[st.nb].pages[st.pg];document.getElementById('pgTitle').value=`${d.notebooks[st.nb].name} 第${st.pg+1}页`;document.getElementById('content').value=p;startAuto()}
        function enterNb(i){st.nb=i;showNotebook()}
        function enterPg(i){st.pg=i;showEditor()}
        /* 自动保存 */
        function startAuto(){clearInterval(timer);timer=setInterval(()=>{const c=document.getElementById('content').value;if(c.split('\n').length<=500){const d=load();d.notebooks[st.nb].pages[st.pg]=c;save(d);document.getElementById('autoHint').textContent='已保存 '+new Date().toLocaleTimeString()}},3000)}
        /* 手动保存 */
        function savePage(){const c=document.getElementById('content').value;if(c.split('\n').length>500){alert('超过500行，请精简');return}const d=load();d.notebooks[st.nb].pages[st.pg]=c;save(d);alert('保存成功');showNotebook()}
        /* 导出 */
        function exportPageTxt(){const d=load();const c=d.notebooks[st.nb].pages[st.pg];download(c,`${d.notebooks[st.nb].name}-第${st.pg+1}页.txt`)}
        function exportNotebookTxt(){const d=load();const n=d.notebooks[st.nb];let c=`【${n.name}】\n\n`;n.pages.forEach((p,i)=>{c+=`——第${i+1}页——\n${p}\n\n`});download(c,`${n.name}.txt`)}
        function download(c,f){const b=new Blob([c],{type:'text/plain;charset=utf-8'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=f;a.click();URL.revokeObjectURL(u)}
        /* 设置 */
        function toggleSettings(){document.getElementById('settingsPanel').classList.toggle('show')}
        function handleBgUpload(e){const f=e.target.files[0];if(f){const r=new FileReader();r.onload=ev=>{document.body.style.backgroundImage=`url(${ev.target.result})`;localStorage.setItem('bg_img',ev.target.result)};r.readAsDataURL(f)}}
        function updateMask(){const v=document.getElementById('bgOpacity').value;document.getElementById('bgMask').style.background=`rgba(255,255,255,${v/100})`}
        function setBgColor(c){document.body.style.backgroundImage='none';document.body.style.backgroundColor=c;localStorage.setItem('bg_color',c);localStorage.removeItem('bg_img')}
        function clearBg(){document.body.style.backgroundImage='none';localStorage.removeItem('bg_img')}
        function saveSettings(){localStorage.setItem('bg_opacity',document.getElementById('bgOpacity').value);toggleSettings();alert('设置已保存')}
        function loadSettings(){if(localStorage.getItem('bg_img'))document.body.style.backgroundImage=`url(${localStorage.getItem('bg_img')})`;if(localStorage.getItem('bg_color'))document.body.style.backgroundColor=localStorage.getItem('bg_color');if(localStorage.getItem('bg_opacity')){document.getElementById('bgOpacity').value=localStorage.getItem('bg_opacity');updateMask()}}
        /* 核心：动态适配横屏和键盘高度 */
        function resizeEditor(){const area=document.getElementById('contentArea');const vv=window.visualViewport;if(vv){area.style.height=`${Math.max(0,vv.height-170)}px`}else{area.style.height='calc(100vh - 170px)'}}
        window.addEventListener('resize',resizeEditor);
        window.addEventListener('orientationchange',()=>setTimeout(resizeEditor,100));
        window.visualViewport?.addEventListener('resize',resizeEditor);
        window.visualViewport?.addEventListener('scroll',resizeEditor);
        showHome();loadSettings();resizeEditor();
    </script>
</body>
</html>
