<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>虫虫研究所</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0e14;--line:#262d38;--text:#e6edf3;--dim:#7d8590;--accent:#58a6ff;--gold:#f0b72f;--green:#3fb950;--purple:#a371f7;--red:#f85149;--orange:#f0883e}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(88,166,255,.08),transparent 60%),radial-gradient(ellipse 60% 50% at 90% 110%,rgba(163,113,247,.06),transparent 60%),var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.app{max-width:720px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:76px}
.hud{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:6px;padding:10px 12px;background:rgba(10,14,20,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
.hud-logo{font-size:18px;line-height:1;margin-right:2px}
.hud-stat{display:flex;align-items:center;gap:4px;padding:5px 9px;border-radius:9px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.05);font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.hud-stat i{font-style:normal;font-size:11px;opacity:.9}
.hud-stat b{font-weight:700}
.hud-stat.gold b{color:var(--gold)}
.hud-stat.low b{color:var(--red)}
.hud-spacer{flex:1}
.hud-btn{padding:6px 12px;border-radius:9px;border:1px solid #2a3a4d;background:linear-gradient(180deg,#1d2a38,#151e28);color:var(--text);font-size:11.5px;font-weight:600;font-family:inherit;cursor:pointer;transition:.15s;white-space:nowrap}
.hud-btn:hover{border-color:#3d5a78}
.hud-btn:active{transform:scale(.97)}
main{padding:12px 12px 20px}
.diff-screen{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(88,166,255,.1),transparent 60%),#0a0e14;padding:30px;text-align:center}
.diff-title{font-size:24px;font-weight:800;letter-spacing:2px;margin-bottom:6px}
.diff-sub{font-size:12px;color:var(--dim);margin-bottom:30px}
.diff-options{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px}
.diff-btn{padding:16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text);font-family:inherit;cursor:pointer;text-align:left;transition:.18s}
.diff-btn:hover{border-color:var(--accent);background:rgba(88,166,255,.08);transform:translateY(-2px)}
.diff-btn .dn{font-size:15px;font-weight:700;margin-bottom:4px}
.diff-btn .dd{font-size:11px;color:var(--dim);line-height:1.5}
.diff-btn .dm{font-size:10px;color:var(--gold);margin-top:4px}
.tut-overlay{position:fixed;inset:0;z-index:400;background:rgba(4,6,9,.85);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px}
.tut-overlay.open{display:flex}
.tut-box{width:100%;max-width:400px;background:linear-gradient(180deg,#181f29,#111720);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 24px 64px rgba(0,0,0,.8)}
.tut-step{font-size:10px;color:var(--dim);letter-spacing:1.5px;margin-bottom:8px}
.tut-title{font-size:17px;font-weight:700;margin-bottom:10px}
.tut-text{font-size:12.5px;color:#b1bac4;line-height:1.8;margin-bottom:18px}
.tut-actions{display:flex;gap:8px}
.tut-actions button{flex:1;padding:11px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:.15s}
.tut-actions button.primary{background:rgba(88,166,255,.15);border-color:rgba(88,166,255,.5);color:var(--accent)}
.tut-dots{display:flex;gap:5px;justify-content:center;margin-bottom:16px}
.tut-dot{width:6px;height:6px;border-radius:50%;background:#2a3441;transition:.2s}
.tut-dot.on{background:var(--accent);width:18px;border-radius:3px}
.zone{background:linear-gradient(180deg,rgba(28,36,48,.7),rgba(21,27,36,.85));border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px}
.zone-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.zone-title{font-size:14px;font-weight:700;letter-spacing:.5px}
.zone-tier{font-size:10px;color:var(--dim)}
.zone-spacer{flex:1}
.zone-cap{font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.env-bar{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.env-chip{display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);font-size:10.5px;color:var(--dim);cursor:pointer;transition:.15s;font-family:inherit}
.env-chip:hover{border-color:#3d5a78;color:var(--text)}
.env-chip b{color:var(--text);font-weight:700}
.env-chip.bad{border-color:rgba(248,81,73,.5)}
.env-chip.bad b{color:var(--red)}
.tank{position:relative;width:100%;height:200px;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.06);box-shadow:inset 0 10px 30px rgba(0,0,0,.65),inset 0 -6px 20px rgba(0,0,0,.5)}
.tank::after{content:'';position:absolute;top:0;left:0;right:0;height:36%;background:linear-gradient(180deg,rgba(255,255,255,.04),transparent);pointer-events:none;border-radius:16px 16px 0 0}
.bug{position:absolute;left:0;top:0;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;will-change:transform;padding:2px;transition:border-color .35s,box-shadow .35s}
.bug span{display:block;width:84%;text-align:center;line-height:1.05;font-weight:700;letter-spacing:-.3px;word-break:break-all;pointer-events:none;transition:color .35s}
@keyframes flash{0%{filter:brightness(1)}30%{filter:brightness(2.4)}100%{filter:brightness(1)}}
.bug.flash{animation:flash .9s ease}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,183,47,0)}50%{box-shadow:0 0 18px 3px rgba(240,183,47,.5)}}
.bug.mature{animation:pulse 2.2s ease-in-out infinite}
.bug.dead{opacity:.28;filter:grayscale(1)}
.tank-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#3a4757;font-size:11px;letter-spacing:2px;pointer-events:none}
.shop{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.buy-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.022);color:var(--text);cursor:pointer;font-family:inherit;transition:.15s}
.buy-btn b{font-size:10.5px;font-weight:600;white-space:nowrap}
.buy-btn span{font-size:10px;color:var(--gold);font-weight:700}
.buy-btn:hover{background:rgba(88,166,255,.08);border-color:rgba(88,166,255,.32)}
.buy-btn:disabled{opacity:.3;cursor:not-allowed}
.modal-host{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.modal-host.open{display:flex}
.modal-mask{position:absolute;inset:0;background:rgba(4,6,9,.75);backdrop-filter:blur(4px)}
.modal{position:relative;width:100%;max-width:400px;max-height:85vh;overflow-y:auto;background:linear-gradient(180deg,#181f29,#111720);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 24px 64px rgba(0,0,0,.75);-webkit-overflow-scrolling:touch}
.modal-title{font-size:15px;font-weight:700;letter-spacing:.4px;margin-bottom:14px;padding-right:36px}
.modal-close{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--dim);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:.15s}
.modal-close:hover{color:var(--text);border-color:#3d5a78}
.row{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:10px;background:rgba(255,255,255,.022);border:1px solid rgba(255,255,255,.04);margin-bottom:6px;font-size:12px}
.row:last-child{margin-bottom:0}
.row b{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.row-label{color:var(--dim);font-size:11.5px}
.row.click{cursor:pointer;transition:.15s}
.row.click:hover{border-color:#3d5a78;background:rgba(255,255,255,.04)}
.prog-row{margin-bottom:10px}
.prog-head{display:flex;align-items:center;font-size:11.5px;margin-bottom:4px}
.prog-head span{color:var(--dim)}
.prog-head b{margin-left:auto;font-weight:700}
.prog-bar{height:5px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
.prog-bar>i{display:block;height:100%;border-radius:3px;transition:width .35s}
.act-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}
.act{padding:11px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text);font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:5px}
.act:hover{background:rgba(88,166,255,.1);border-color:rgba(88,166,255,.35)}
.act.gold{border-color:rgba(240,183,47,.35);background:rgba(240,183,47,.08);color:var(--gold)}
.act.danger{border-color:rgba(248,81,73,.3)}
.act.wide{grid-column:1/-1}
.act:disabled{opacity:.35;cursor:not-allowed}
.section-label{font-size:10px;color:var(--dim);letter-spacing:1.5px;margin:14px 0 7px;text-transform:uppercase}
.section-label:first-child{margin-top:0}
.empty-note{color:var(--dim);font-size:12px;text-align:center;padding:30px 0}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;z-index:200;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:90vw}
.toast{padding:9px 16px;border-radius:11px;background:rgba(21,27,36,.97);border:1px solid var(--line);font-size:12px;font-weight:600;backdrop-filter:blur(14px);box-shadow:0 8px 24px rgba(0,0,0,.5);animation:toastIn .3s,toastOut .3s ease 2.6s forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.94)}}
@keyframes toastOut{to{opacity:0;transform:translateY(12px) scale(.94)}}
.pop{position:fixed;font-size:15px;font-weight:800;color:var(--gold);pointer-events:none;z-index:300;text-shadow:0 2px 12px rgba(0,0,0,.8);animation:popUp 1.1s forwards}
@keyframes popUp{0%{opacity:0;transform:translate(-50%,0) scale(.5)}20%{opacity:1;transform:translate(-50%,-12px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:720px;z-index:60;display:flex;justify-content:space-around;gap:2px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(10,14,20,0),rgba(10,14,20,.96) 30%);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.05)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:0;background:transparent;color:var(--dim);font-family:inherit;font-size:10px;cursor:pointer;border-radius:11px;transition:.18s}
.tab i{font-style:normal;font-size:18px;line-height:1;transition:.18s}
.tab.on{color:var(--accent)}
.tab.on i{transform:scale(1.15)}
.arena{min-height:100%;padding:14px;background:radial-gradient(ellipse 100% 60% at 50% 0%,rgba(240,183,47,.06),transparent 60%),#0a0e14}
.arena-title{text-align:center;font-size:18px;font-weight:800;letter-spacing:2px;margin-bottom:4px}
.arena-sub{text-align:center;font-size:11px;color:var(--dim);margin-bottom:16px}
.fighter-row{display:flex;gap:10px;margin-bottom:14px}
.fighter{flex:1;background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;transition:.3s}
.fighter.player{border-color:rgba(88,166,255,.4)}
.fighter.enemy{border-color:rgba(248,81,73,.4)}
.fighter.active{box-shadow:0 0 24px rgba(240,183,47,.25)}
.fighter-circle{width:58px;height:58px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;text-align:center;line-height:1.1;padding:3px}
.fighter-name{font-size:13px;font-weight:700;margin-bottom:2px}
.fighter-sp{font-size:10px;color:var(--dim);margin-bottom:6px}
.fighter-hp{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:3px}
.fighter-hp>i{display:block;height:100%;border-radius:3px;transition:width .4s}
.fighter-hpt{font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums}
.vs-badge{display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:var(--dim);padding:0 4px}
.battle-log{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:14px;padding:12px;height:150px;overflow-y:auto;margin-bottom:14px;font-size:11.5px;line-height:1.9}
.battle-log div{color:var(--dim)}
.battle-log .hit{color:var(--red)}
.battle-log .heal{color:var(--green)}
.battle-log .crit{color:var(--gold);font-weight:700}
.battle-log .sys{color:var(--accent);font-weight:600}
.skill-bar{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.skill-btn{padding:12px 8px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text);font-family:inherit;cursor:pointer;transition:.15s;text-align:left;position:relative}
.skill-btn:hover:not(:disabled){background:rgba(88,166,255,.1);border-color:rgba(88,166,255,.4)}
.skill-btn:disabled{opacity:.35;cursor:not-allowed}
.skill-btn .sn{font-size:12px;font-weight:700;margin-bottom:2px}
.skill-btn .sd{font-size:10px;color:var(--dim)}
.skill-btn .sc{position:absolute;top:6px;right:8px;font-size:9px;color:var(--gold)}
.skill-btn.cd{background:rgba(0,0,0,.3)}
.skill-btn.cd .sc{color:var(--red)}
.dex-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dex-cell{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.02);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:10.5px;color:#3a4757;position:relative}
.dex-cell.got{color:var(--text);border-color:rgba(255,255,255,.12);background:rgba(88,166,255,.05)}
.dex-cell .dc-dot{width:30px;height:30px;border-radius:50%;border:1.5px solid #2a3441;background:radial-gradient(circle at 34% 28%,#28333f,#12181f 72%);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.dex-cell.locked .dc-dot{filter:grayscale(1) brightness(.4);color:transparent}
.dex-cell .dc-star{position:absolute;top:5px;right:7px;font-size:9px;color:var(--gold);font-weight:700}
.log-list{display:flex;flex-direction:column;gap:4px;max-height:300px;overflow-y:auto}
.log-item{font-size:11px;color:var(--dim);padding:7px 10px;border-radius:8px;background:rgba(255,255,255,.02);border-left:2px solid #2a3441}
.log-item.good{border-left-color:var(--green);color:#b9e8c8}
.log-item.bad{border-left-color:var(--red);color:#f0b8b8}
.log-item.gold{border-left-color:var(--gold);color:#f3dca6}
.card{background:linear-gradient(180deg,rgba(28,36,48,.7),rgba(21,27,36,.85));border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.card-title{font-size:13px;font-weight:700;margin-bottom:10px;letter-spacing:.4px}
@media (max-width:600px){.tank{height:180px}.buy-btn b{font-size:10px}.hud-stat{font-size:11px;padding:4px 7px}}
</style>
</head>
<body>

<div class="diff-screen" id="diffScreen">
<div class="diff-title">🐛 虫虫研究所</div>
<div class="diff-sub">选择难度开始你的养虫之旅</div>
<div class="diff-options">
<button class="diff-btn" data-diff="easy"><div class="dn">🌱 简单</div><div class="dd">成长快，售价高，虫不易死，斗虫伤害低</div><div class="dm">适合新手</div></button>
<button class="diff-btn" data-diff="normal"><div class="dn">⚖️ 普通</div><div class="dd">标准成长与售价，正常死亡，标准斗虫</div><div class="dm">推荐体验</div></button>
<button class="diff-btn" data-diff="hard"><div class="dn">🔥 困难</div><div class="dd">成长慢，售价低，虫易死，斗虫伤害高</div><div class="dm">挑战极限</div></button>
</div>
</div>

<div class="tut-overlay" id="tutOverlay">
<div class="tut-box">
<div class="tut-dots" id="tutDots"></div>
<div class="tut-step" id="tutStep"></div>
<div class="tut-title" id="tutTitle"></div>
<div class="tut-text" id="tutText"></div>
<div class="tut-actions">
<button id="tutSkip">跳过</button>
<button class="primary" id="tutNext">下一步</button>
</div>
</div>
</div>

<div class="app" id="app" style="display:none">
<header class="hud">
<span class="hud-logo">🐛</span>
<div class="hud-stat" id="hudFood"><i>🌾</i><b>0</b></div>
<div class="hud-stat gold" id="hudCoin"><i>🪙</i><b>0</b></div>
<div class="hud-stat" id="hudLevel"><i>⭐</i><b>Lv.1</b></div>
<div class="hud-spacer"></div>
<button class="hud-btn" id="hudFeed">补粮</button>
<button class="hud-btn" id="hudTutorial">教程</button>
</header>
<main id="view"></main>
</div>

<nav class="tabbar" id="tabbar" style="display:none">
<button class="tab on" data-v="tanks"><i>🪲</i><span>虫缸</span></button>
<button class="tab" data-v="arena"><i>⚔️</i><span>斗虫场</span></button>
<button class="tab" data-v="market"><i>📈</i><span>市场</span></button>
<button class="tab" data-v="dex"><i>📖</i><span>图鉴</span></button>
<button class="tab" data-v="lab"><i>🔬</i><span>研究</span></button>
</nav>

<div class="modal-host" id="modalHost"></div>
<div class="toasts" id="toasts"></div>

<script>
const SAVE_KEY='worm_final_v1';
const FOOD_BUY_COST=30,FOOD_BUY_GAIN=300;
const DIFFS={
easy:{n:'简单',growMul:1.5,priceMul:1.2,deathMul:0.5,battleMul:0.8,startCoins:500,startFood:800},
normal:{n:'普通',growMul:1.0,priceMul:1.0,deathMul:1.0,battleMul:1.0,startCoins:300,startFood:500},
hard:{n:'困难',growMul:0.7,priceMul:0.85,deathMul:1.5,battleMul:1.25,startCoins:180,startFood:320}
};
const RARITY=[
{n:'普通',c:'#7d8590',m:1.0,w:40},
{n:'优良',c:'#3fb950',m:1.8,w:27},
{n:'稀有',c:'#58a6ff',m:3.0,w:18},
{n:'史诗',c:'#a371f7',m:5.0,w:10},
{n:'传说',c:'#f0b72f',m:9.0,w:4},
{n:'神话',c:'#f85149',m:20,w:1}
];
const MUTS={
albino:{n:'白化',c:'#f0f6fc',m:2.2,w:26},
melano:{n:'黑化',c:'#475569',m:2.2,w:26},
giant:{n:'巨化',c:'#f0883e',m:3.4,w:16},
rainbow:{n:'虹彩',c:'#bc8cff',m:4.6,w:11},
glow:{n:'发光',c:'#7ee787',m:5.2,w:9},
crystal:{n:'晶化',c:'#79c0ff',m:6.8,w:6},
void:{n:'虚空',c:'#8957e5',m:9.5,w:4},
divine:{n:'神辉',c:'#f2cc60',m:15,w:2}
};
const MUT_KEYS=Object.keys(MUTS);

function bugMaxHp(b){
const base=60+SPECIES[b.sp].val*0.3;
const sizeMul=0.8+b.size*0.3;
const lvMul=1+(b.fightLv-1)*0.2;
return Math.round((base*sizeMul*lvMul+b.hpBonus)*diff().battleMul);
}
function bugDiameter(b){
const sp=SPECIES[b.sp];
const stageScale=[0.62,0.78,0.92,1.0,1.08][b.stage]||0.9;
const mutScale=b.mut==='giant'?1.28:b.mut==='crystal'?1.12:b.mut==='void'?1.16:1;
return Math.round(sp.r*(0.72+b.size*0.5)*stageScale*mutScale*2);
}
function bugColor(b){
if(b.mut&&MUTS[b.mut])return MUTS[b.mut].c;
if(b.mature)return RARITY[b.q].c;
return '#7d8590';
}
function priceOf(b){
if(!b.mature)return 0;
const sp=SPECIES[b.sp],q=RARITY[b.q];
const mm=b.mut&&MUTS[b.mut]?MUTS[b.mut].m:1;
const sizeMul=0.75+b.size*0.45;
const hpMul=0.62+(b.hp/100)*0.38;
const moodMul=0.85+(b.mood/100)*0.15;
const winMul=1+(b.wins||0)*0.03;
let titleMul=1;
if(b.title==='虫王')titleMul=1.15;
if(b.title==='斗神')titleMul=1.3;
return Math.max(1,Math.round(sp.val*q.m*mm*sizeMul*hpMul*moodMul*winMul*titleMul*diff().priceMul));
}
function buyCost(sp){return Math.max(4,Math.round(sp.val*0.30))}
function calcTemp(t){
let v=t.temp+SEASONS[G.season].t+WEATHERS[G.weather].t+SUBS[t.substrate].t;
if(t.upgrades.heater&&v<22)v+=(22-v)*0.75;
return v;
}
function calcHum(t){
let v=t.hum+SEASONS[G.season].h+WEATHERS[G.weather].h+SUBS[t.substrate].h;
if(t.upgrades.humid&&v<62)v+=(62-v)*0.7;
if(t.upgrades.water)v+=4;
return clamp(v,15,98);
}
function envFactor(sp,temp,hum){
let f=1;
if(temp<sp.tmin)f*=Math.max(0.2,1-(sp.tmin-temp)*0.09);
if(temp>sp.tmax)f*=Math.max(0.2,1-(temp-sp.tmax)*0.09);
if(hum<sp.hmin)f*=Math.max(0.25,1-(sp.hmin-hum)*0.022);
if(hum>sp.hmax)f*=Math.max(0.25,1-(hum-sp.hmax)*0.022);
return f;
}
function toast(msg,color){
const d=document.createElement('div');d.className='toast';d.textContent=msg;
if(color)d.style.color=color;
document.getElementById('toasts').appendChild(d);
setTimeout(()=>d.remove(),2900);
const box=document.getElementById('toasts');
while(box.children.length>3)box.firstChild.remove();
}
function log(msg,type){G.log.push({m:msg,t:type||''});if(G.log.length>200)G.log.shift()}
function popAt(el,text){
const r=el.getBoundingClientRect();
const d=document.createElement('div');d.className='pop';d.textContent=text;
d.style.left=(r.left+r.width/2)+'px';d.style.top=(r.top+10)+'px';
document.body.appendChild(d);setTimeout(()=>d.remove(),1150);
}

function findAnyBug(pred){for(const t of G.tanks){for(const b of t.bugs)if(pred(b))return b}return null}
function fmtAge(sec){
if(sec<60)return Math.floor(sec)+'秒';
if(sec<3600)return Math.floor(sec/60)+'分';
return (sec/3600).toFixed(1)+'时';
}
function save(){G.lastTime=Date.now();try{localStorage.setItem(SAVE_KEY,JSON.stringify(G))}catch(e){}}
function load(){
try{
const raw=localStorage.getItem(SAVE_KEY);
if(!raw)return false;
const d=JSON.parse(raw);
Object.assign(G,d);
if(!Array.isArray(G.tanks)||!G.tanks.length)return false;
if(!G.market||!Object.keys(G.market).length)rollMarket();
if(!G.orders||!G.orders.length)genOrders();
if(!G.stats)G.stats={sold:0,earned:0,bred:0,mutated:0,cured:0,explored:0,fights:0,wins:0,contests:0,orders:0};
if(!G.dex)G.dex={};
if(!G.ach)G.ach={};
if(!G.log)G.log=[];
return true;
}catch(e){return false}
}
function timeStr(sec){
if(sec<60)return Math.floor(sec)+'秒';
if(sec<3600)return Math.floor(sec/60)+'分钟';
return (sec/3600).toFixed(1)+'小时';
}
function rollWeather(){
let r=Math.random()*100,acc=0,nw=0;
for(let i=0;i<WEATHERS.length;i++){acc+=WEATHERS[i].w;if(r<acc){nw=i;break}}
if(nw!==G.weather){G.weather=nw;log('天气转为 '+WEATHERS[nw].n,'')}
}
function rollMarket(){Object.keys(SPECIES).forEach(k=>{G.market[k]=rand(0.72,1.34)})}
function genOrders(){
G.orders=[];
const keys=Object.keys(SPECIES);
for(let i=0;i<3;i++){
const sp=keys[(Math.random()*keys.length)|0];
const q=Math.min(RARITY.length-1,(Math.random()*3)|0);
G.orders.push({id:G.nextId++,sp:sp,q:q,reward:Math.round(SPECIES[sp].val*(1.4+q*0.85))});
}
}
function checkAch(){
const s=G.stats;
function unlock(k){
if(G.ach[k])return;G.ach[k]=1;
const a=ACHS.find(x=>x.k===k);
if(a){G.coins+=a.r;toast('🏆 '+a.n+' +'+a.r+'🪙','#f0b72f');log('成就解锁 · '+a.n,'gold')}
}
if(s.sold>=1)unlock('first');
if(s.sold>=10)unlock('ten');
if(s.sold>=100)unlock('hundred');
if(s.mutated>=1)unlock('mut');
if(s.bred>=10)unlock('breed');
if(s.cured>=10)unlock('cure');
if(G.coins>=10000)unlock('rich');
if(s.explored>=10)unlock('explore');
if(s.wins>=1)unlock('fighter');
if(s.wins>=10)unlock('champion');
if(G.tutorialDone)unlock('tutorial');
}
function levelCheck(){
const need=G.level*400;
while(G.exp>=need){G.exp-=G.level*400;G.level++;toast('研究所升级 Lv.'+G.level,'#58a6ff');log('研究所升级 Lv.'+G.level,'good')}
}
function addDex(spId,q){
if(!G.dex[spId])G.dex[spId]={count:0,best:0};
G.dex[spId].count++;
if(q>G.dex[spId].best)G.dex[spId].best=q;
}

if(tank.bugs.length===0){const e=document.createElement('div');e.className='tank-empty';e.textContent='空 空 如 也';tankEl.appendChild(e)}

function styleBugEl(el,b){
const d=bugDiameter(b);
el.style.width=d+'px';el.style.height=d+'px';
el.querySelector('span').style.fontSize=Math.max(7,Math.min(15,d*0.32))+'px';
const col=bugColor(b);
el.style.borderColor=b.mature?col:'#46566b';
el.style.background='radial-gradient(circle at 34% 28%,'+rgba(col,.35)+',#0f141a 72%)';
el.style.boxShadow=b.mature?'0 4px 12px rgba(0,0,0,.55),0 0 18px '+rgba(col,.4):'0 4px 12px rgba(0,0,0,.55)';
el.querySelector('span').style.color=b.mature?col:'#c7d0dc';
el.classList.toggle('mature',b.mature&&b.alive);
el.classList.toggle('dead',!b.alive);
el._d=d;el._col=col;
}
function updateBugDOM(){
if(G.view!=='tanks')return;
bugEls.forEach((el,id)=>{
const b=allBugs.get(id);
if(!b||!el.parentElement)return;
const tankEl=el.parentElement;
const w=tankEl.clientWidth,h=tankEl.clientHeight;
if(!w||!h)return;
const d=el._d||bugDiameter(b);
el.style.transform='translate3d('+(b.x*(w-d)).toFixed(1)+'px,'+(b.y*(h-d)).toFixed(1)+'px,0)';
const nd=bugDiameter(b);
if(nd!==el._d)styleBugEl(el,b);
const nc=bugColor(b);
if(nc!==el._col)styleBugEl(el,b);
const flash=b.flashUntil>Date.now();
if(el._flash!==flash){el._flash=flash;el.classList.toggle('flash',flash)}
});
}
function onBugClick(id){
const b=allBugs.get(id);
if(!b)return;
b.flashUntil=Date.now()+650;
if(b.alive){const ang=Math.random()*Math.PI*2;b.vx=Math.cos(ang)*0.14;b.vy=Math.sin(ang)*0.14;b.wander=1.2}
openBugModal(b);
}
function update(dt){
G.food=Math.min(foodCap(),G.food+0.16*dt*(1+G.level*0.06));
G.weatherTimer-=dt;
if(G.weatherTimer<=0){G.weatherTimer=100+Math.random()*140;rollWeather()}
G.eventTimer-=dt;
if(G.eventTimer<=0){G.eventTimer=55+Math.random()*95;randomEvent()}
G.seasonTimer+=dt;
if(G.seasonTimer>1400){G.seasonTimer=0;G.season=(G.season+1)%4;log('季节更替 · '+SEASONS[G.season].n,'good')}
G.dayTimer+=dt;
if(G.dayTimer>160){G.dayTimer=0;G.day++;rollMarket();genOrders();log('第 '+G.day+' 天开始','')}
G.tanks.forEach(tank=>{
tank.cleanliness=Math.max(0,tank.cleanliness-(0.05+tank.bugs.length*0.016)*dt*(tank.upgrades.bowl?0.7:1));
if(tank.upgrades.autoClean)tank.cleanliness=Math.min(100,tank.cleanliness+0.08*dt);
if(tank.upgrades.autoFeed&&G.food<foodCap()*0.4)G.food=Math.min(foodCap(),G.food+3.2*dt);
const temp=calcTemp(tank),hum=calcHum(tank);
tank.bugs.forEach(b=>{
if(!b.alive)return;
const sp=SPECIES[b.sp];
if(!b.mature){
const env=envFactor(sp,temp,hum);
const rate=(100/sp.time)*b.genes.speed*env*(0.85+tank.light*0.35)*diff().growMul;
b.growth=Math.min(100,b.growth+rate*dt*(0.4+0.6*b.hp/100));
if(b.growth>=100){b.growth=100;b.mature=true;b.stage=sp.st.length-1;b.flashUntil=Date.now()+1000;log(b.name+' 羽化成熟 · '+RARITY[b.q].n,'gold');toast(sp.n+' 成熟了','#f0b72f')}
else b.stage=stageOf(sp,b.growth/100);
}
const need=sp.hun*dt*b.genes.appetite*(b.mature?1.2:1);
if(G.food>=need){G.food-=need;b.hunger=Math.min(100,b.hunger+16*dt)}
else b.hunger=Math.max(0,b.hunger-7*dt);
let hp=0.12;
if(b.hunger<25)hp-=0.65;
if(temp<sp.tmin-3||temp>sp.tmax+3)hp-=0.5;
if(hum<sp.hmin-10||hum>sp.hmax+10)hp-=0.3;
if(tank.cleanliness<35)hp-=0.35;
if(b.disease)hp-=1.5;
if(b.parasite)hp-=0.9;
if(b.symbiont)hp+=0.7;
if(tank.upgrades.hide)hp+=0.15;
b.hp=clamp(b.hp+hp*dt*diff().deathMul,0,100);
let mood=0;
if(b.hunger>55)mood+=0.55;else mood-=1.1;
if(tank.cleanliness<45)mood-=0.65;
if(tank.upgrades.hide)mood+=0.3;
b.mood=clamp(b.mood+mood*dt,0,100);
if(tank.cleanliness<30&&!b.disease&&Math.random()<dt*0.006)b.disease='霉病';
if(tank.cleanliness<22&&!b.parasite&&Math.random()<dt*0.004)b.parasite='螨虫';
b.age+=dt;
if(b.hp<=0){b.alive=false;b.mature=false;log(b.name+' 死亡了','bad');toast(b.name+' 死亡','#f85149')}
b.wander-=dt;
if(b.wander<=0){
b.wander=0.9+Math.random()*2.6;
if(Math.random()<0.3){b.vx=0;b.vy=0}
else{const base=(0.05+b.size*0.03)*(0.5+b.mood/160)*(0.6+b.genes.speed*0.5);const ang=Math.random()*Math.PI*2;b.vx=Math.cos(ang)*base;b.vy=Math.sin(ang)*base*1.35}
}
b.x+=b.vx*dt;b.y+=b.vy*dt;
if(b.x<0){b.x=0;b.vx=Math.abs(b.vx)}
if(b.x>1){b.x=1;b.vx=-Math.abs(b.vx)}
if(b.y<0){b.y=0;b.vy=Math.abs(b.vy)}
if(b.y>1){b.y=1;b.vy=-Math.abs(b.vy)}
b.vx*=0.997;b.vy*=0.997;
if(!tank.upgrades.lock&&Math.random()<0.000004*dt*60){b.alive=false;log(b.name+' 被偷走了','bad');toast('有虫被偷了','#f85149')}
});
});
}
let lastT=performance.now();
function loop(t){
let dt=(t-lastT)/1000;lastT=t;
if(dt>2)dt=2;
if(dt>0)update(dt);
updateBugDOM();
requestAnimationFrame(loop);
}
function offlineUpdate(dt){
G.food=Math.min(foodCap(),G.food+0.16*dt*(1+G.level*0.06));
G.tanks.forEach(tank=>{
tank.cleanliness=Math.max(0,tank.cleanliness-(0.05+tank.bugs.length*0.016)*dt);
if(tank.upgrades.autoClean)tank.cleanliness=Math.min(100,tank.cleanliness+0.08*dt);
if(tank.upgrades.autoFeed&&G.food<foodCap()*0.4)G.food=Math.min(foodCap(),G.food+3.2*dt);
const temp=calcTemp(tank),hum=calcHum(tank);
tank.bugs.forEach(b=>{
if(!b.alive)return;
const sp=SPECIES[b.sp];
if(!b.mature){
const env=envFactor(sp,temp,hum);
const rate=(100/sp.time)*b.genes.speed*env*(0.85+tank.light*0.35)*diff().growMul;
b.growth=Math.min(100,b.growth+rate*dt*(0.4+0.6*b.hp/100));
if(b.growth>=100){b.growth=100;b.mature=true;b.stage=sp.st.length-1}
else b.stage=stageOf(sp,b.growth/100);
}
const need=sp.hun*dt*b.genes.appetite;
if(G.food>=need){G.food-=need;b.hunger=Math.min(100,b.hunger+16*dt)}
else b.hunger=Math.max(0,b.hunger-7*dt);
let hp=0.12;
if(b.hunger<25)hp-=0.65;
if(b.disease)hp-=1.5;
if(b.parasite)hp-=0.9;
if(b.symbiont)hp+=0.7;
b.hp=clamp(b.hp+hp*dt*diff().deathMul,0,100);
if(b.hp<=0){b.alive=false;b.mature=false}
});
});
}
function applyOffline(){
const elapsed=(Date.now()-G.lastTime)/1000;
if(elapsed<20)return;
const cap=Math.min(elapsed,8*3600);
const steps=Math.min(260,Math.max(40,Math.floor(cap/10)));
const dt=cap/steps;
for(let i=0;i<steps;i++)offlineUpdate(dt);
const matured=G.tanks.reduce(function(a,t){return a+t.bugs.filter(function(b){return b.mature}).length},0);
const dead=G.tanks.reduce(function(a,t){return a+t.bugs.filter(function(b){return !b.alive}).length},0);
let msg='离线 '+timeStr(elapsed);
if(matured)msg+=' · 成熟 '+matured;
if(dead)msg+=' · 死亡 '+dead;
toast(msg,'#58a6ff');
log('离线 '+timeStr(elapsed),'');
}
function randomEvent(){
const r=Math.random();
if(r<0.12){const b=findAnyBug(x=>x.alive&&!x.disease);if(b){b.disease='突发感染';log(b.name+' 突发感染','bad');toast('有虫突发感染','#f85149')}}
else if(r<0.24){const b=findAnyBug(x=>x.alive&&!x.mature);if(b){b.growth=Math.min(100,b.growth+16);b.flashUntil=Date.now()+800;log('暴产期 · '+b.name+' 加速成长','good');toast('暴产期加速成长','#3fb950')}}
else if(r<0.34){const b=findAnyBug(x=>x.alive&&!x.mut);if(b){const m=rollMutReal(60);if(m){b.mut=m;b.flashUntil=Date.now()+1200;G.stats.mutated++;log('自然突变 · '+MUTS[m].n,'gold');toast('自然突变！'+MUTS[m].n,'#f0b72f');checkAch()}}}
else if(r<0.44){const g=Math.round(80+Math.random()*260);G.coins+=g;log('访客高价收虫，额外获得 '+g+' 金币','good');toast('访客留下 '+g+'🪙','#f0b72f')}
else if(r<0.52){G.tanks.forEach(t=>{t.temp=clamp(t.temp-(Math.random()*4+2),10,35)});log('突然降温，注意保温','bad');toast('突然降温','#58a6ff')}
else if(r<0.60){const b=findAnyBug(x=>x.alive&&!x.parasite);if(b){b.parasite='螨虫';log(b.name+' 感染螨虫','bad');toast('有虫感染螨虫','#f0883e')}}
else if(r<0.70){const b=findAnyBug(x=>x.alive&&!x.symbiont);if(b){b.symbiont='益生菌';b.hp=clamp(b.hp+10,0,100);log(b.name+' 获得共生菌','good');toast('获得共生菌','#3fb950')}}

function startBattle(playerBug,enemyBug){
battle={player:playerBug,enemy:enemyBug,
playerHp:bugMaxHp(playerBug),enemyHp:bugMaxHp(enemyBug),
playerMaxHp:bugMaxHp(playerBug),enemyMaxHp:bugMaxHp(enemyBug),
playerCd:{},enemyCd:{},playerBuff:{},enemyBuff:{},
turn:1,log:[],over:false,animating:false,
playerDefending:false,enemyDefending:false,
playerStun:0,enemyStun:0};
playerBug.skills.forEach(s=>{battle.playerCd[s]=0});
enemyBug.skills.forEach(s=>{battle.enemyCd[s]=0});
addBattleLog('sys','⚔️ 战斗开始！');
renderArena();
}
function addBattleLog(type,text){
battle.log.push({t:type,m:text});
if(battle.log.length>60)battle.log.shift();
}
function calcSkillDamage(attacker,defender,sk,defending){
let atk=bugAtk(attacker),def=bugDef(defender);
if(attacker===battle.player&&battle.playerBuff.atkDown>0)atk*=0.7;
if(attacker===battle.enemy&&battle.enemyBuff.atkDown>0)atk*=0.7;
if(defender===battle.player&&battle.playerBuff.defUp>0)def*=1.4;
if(defender===battle.enemy&&battle.enemyBuff.defUp>0)def*=1.4;
if(defending)def*=1.5;
const base=Math.max(2,atk*sk.dmg-def*0.5);
return Math.round(base*(0.85+Math.random()*0.3));
}
function applyBuff(buff,effect,dur){
if(effect==='defUp')buff.defUp=dur;
if(effect==='defUp2')buff.defUp=dur+1;
if(effect==='dodgeUp')buff.dodgeUp=dur;
}
function applyDebuff(buff,effect,dur){
if(effect==='atkDown')buff.atkDown=dur;
if(effect==='blind')buff.blind=dur;
if(effect==='stun')buff.stun=dur;
}
function buffText(e){
if(e==='defUp')return'防御力提升';
if(e==='defUp2')return'防御力大幅提升';
if(e==='dodgeUp')return'闪避率提升';
return'';
}
function debuffText(e){
if(e==='atkDown')return'对手攻击力下降';
if(e==='blind')return'对手被致盲';
if(e==='stun')return'对手被震慑';
return'';
}
function playerUseSkill(skId){
if(!battle||battle.over||battle.animating)return;
if(battle.playerStun>0){addBattleLog('sys','你被震慑了，无法行动！');battle.playerStun--;battle.animating=false;setTimeout(()=>{tickBuffs();renderArena()},500);return}
const sk=SKILLS[skId];
if(!sk||battle.playerCd[skId]>0)return;
battle.playerCd[skId]=sk.cd;
battle.animating=true;
if(sk.type==='buff'){applyBuff(battle.playerBuff,sk.effect,2);addBattleLog('sys','你使用了 '+sk.n+'，'+buffText(sk.effect));battle.animating=false;setTimeout(()=>{tickBuffs();enemyTurn();renderArena()},500);return}
if(sk.type==='debuff'){if(Math.random()<0.7){applyDebuff(battle.enemyBuff,sk.effect,2);addBattleLog('sys','你使用了 '+sk.n+'，'+debuffText(sk.effect))}else{addBattleLog('sys','你使用了 '+sk.n+'，但对手抵抗了！')}battle.animating=false;setTimeout(()=>{tickBuffs();enemyTurn();renderArena()},500);return}
const dodged=Math.random()*100<(battle.enemyBuff.dodgeUp>0?25:8);
if(dodged&&sk.dmg>0){addBattleLog('sys','对手闪避了你的攻击！');battle.animating=false;setTimeout(()=>{tickBuffs();enemyTurn();renderArena()},500);return}
const dmg=calcSkillDamage(battle.player,battle.enemy,sk,battle.enemyDefending);
if(sk.type==='multi'){let total=0;for(let i=0;i<sk.hits;i++)total+=Math.max(1,Math.round(dmg*(0.8+Math.random()*0.4)));battle.enemyHp=Math.max(0,battle.enemyHp-total);addBattleLog('hit','你使用 '+sk.n+'，造成 '+total+' 伤害！')}
else if(sk.type==='drain'){const heal=Math.round(dmg*0.5);battle.enemyHp=Math.max(0,battle.enemyHp-dmg);battle.playerHp=Math.min(battle.playerMaxHp,battle.playerHp+heal);addBattleLog('heal','你使用 '+sk.n+'，造成 '+dmg+' 伤害，回复 '+heal+' HP')}
else if(sk.type==='dot'){battle.enemyHp=Math.max(0,battle.enemyHp-dmg);battle.enemyBuff.poison=(battle.enemyBuff.poison||0)+3;addBattleLog('hit','你使用 '+sk.n+'，造成 '+dmg+' 伤害，附加中毒')}
else{const isCrit=Math.random()<0.12;const finalDmg=isCrit?Math.round(dmg*1.8):dmg;battle.enemyHp=Math.max(0,battle.enemyHp-finalDmg);if(isCrit)addBattleLog('crit','💥 暴击！你使用 '+sk.n+'，造成 '+finalDmg+' 伤害！');else addBattleLog('hit','你使用 '+sk.n+'，造成 '+finalDmg+' 伤害')}
battle.animating=false;
checkBattleEnd();
if(!battle.over)setTimeout(()=>{tickBuffs();enemyTurn();renderArena()},550);
renderArena();
}
function enemyTurn(){
if(!battle||battle.over)return;
if(battle.enemyStun>0){addBattleLog('sys','对手被震慑了，无法行动！');battle.enemyStun--;battle.animating=false;renderArena();return}
const available=battle.enemy.skills.filter(s=>battle.enemyCd[s]<=0);
const skId=available.length?pick(available):pick(battle.enemy.skills);
const sk=SKILLS[skId];
battle.enemyCd[skId]=sk.cd;
battle.animating=true;
if(sk.type==='buff'){applyBuff(battle.enemyBuff,sk.effect,2);addBattleLog('sys','对手使用了 '+sk.n+'，'+buffText(sk.effect));battle.animating=false;setTimeout(()=>{tickBuffs();renderArena()},500);return}
if(sk.type==='debuff'){if(Math.random()<0.7){applyDebuff(battle.playerBuff,sk.effect,2);addBattleLog('sys','对手使用了 '+sk.n+'，'+debuffText(sk.effect))}else{addBattleLog('sys','对手使用了 '+sk.n+'，但你抵抗了！')}battle.animating=false;setTimeout(()=>{tickBuffs();renderArena()},500);return}
const dodged=Math.random()*100<(battle.playerBuff.dodgeUp>0?25:8);
if(dodged&&sk.dmg>0){addBattleLog('sys','你闪避了对手的攻击！');battle.animating=false;setTimeout(()=>{tickBuffs();renderArena()},500);return}
const dmg=calcSkillDamage(battle.enemy,battle.player,sk,battle.playerDefending);
if(sk.type==='multi'){let total=0;for(let i=0;i<sk.hits;i++)total+=Math.max(1,Math.round(dmg*(0.8+Math.random()*0.4)));battle.playerHp=Math.max(0,battle.playerHp-total);addBattleLog('hit','对手使用 '+sk.n+'，造成 '+total+' 伤害！')}
else if(sk.type==='drain'){const heal=Math.round(dmg*0.5);battle.playerHp=Math.max(0,battle.playerHp-dmg);battle.enemyHp=Math.min(battle.enemyMaxHp,battle.enemyHp+heal);addBattleLog('heal','对手使用 '+sk.n+'，造成 '+dmg+' 伤害，回复 '+heal+' HP')}
else if(sk.type==='dot'){battle.playerHp=Math.max(0,battle.playerHp-dmg);battle.playerBuff.poison=(battle.playerBuff.poison||0)+3;addBattleLog('hit','对手使用 '+sk.n+'，造成 '+dmg+' 伤害，你中毒了')}
else{const isCrit=Math.random()<0.12;const finalDmg=isCrit?Math.round(dmg*1.8):dmg;battle.playerHp=Math.max(0,battle.playerHp-finalDmg);if(isCrit)addBattleLog('crit','💥 对手暴击！使用 '+sk.n+'，造成 '+finalDmg+' 伤害！');else addBattleLog('hit','对手使用 '+sk.n+'，造成 '+finalDmg+' 伤害')}
battle.animating=false;
checkBattleEnd();
renderArena();
}
function tickBuffs(){
if(!battle)return;
['defUp','dodgeUp','atkDown','blind','stun','poison'].forEach(k=>{
if(battle.playerBuff[k]>0)battle.playerBuff[k]--;
if(battle.enemyBuff[k]>0)battle.enemyBuff[k]--;
});
if(battle.playerBuff.poison>0){battle.playerHp=Math.max(0,battle.playerHp-3);addBattleLog('hit','你受到中毒伤害 3')}
if(battle.enemyBuff.poison>0){battle.enemyHp=Math.max(0,battle.enemyHp-3);addBattleLog('hit','对手受到中毒伤害 3')}
battle.player.skills.forEach(s=>{if(battle.playerCd[s]>0)battle.playerCd[s]--});
battle.enemy.skills.forEach(s=>{if(battle.enemyCd[s]>0)battle.enemyCd[s]--});
battle.playerStun=battle.playerBuff.stun||0;
battle.enemyStun=battle.enemyBuff.stun||0;
battle.playerDefending=battle.playerBuff.defUp>0;
battle.enemyDefending=battle.enemyBuff.defUp>0;
battle.turn++;

}
function checkBattleEnd(){
if(!battle||battle.over)return;
if(battle.enemyHp<=0){
battle.over=true;
battle.player.wins=(battle.player.wins||0)+1;
battle.player.fightExp=(battle.player.fightExp||0)+25;
G.stats.fights++;G.stats.wins++;
const reward=Math.round(60+bugAtk(battle.enemy)*8);
G.coins+=reward;
addBattleLog('sys','🏆 你赢了！获得 '+reward+'🪙');
log('斗虫胜利 · '+battle.player.name+' +'+reward,'gold');
checkFightLevel(battle.player);
checkTitles(battle.player);
checkAch();
}
else if(battle.playerHp<=0){
battle.over=true;
battle.enemy.wins=(battle.enemy.wins||0)+1;
battle.player.losses=(battle.player.losses||0)+1;
G.stats.fights++;
battle.player.hp=clamp(battle.player.hp-15,0,100);
addBattleLog('sys','💀 你输了...');
log('斗虫失败 · '+battle.player.name,'bad');
}
}
function checkFightLevel(b){
const need=b.fightLv*100;
while(b.fightExp>=need){
b.fightExp-=need;b.fightLv++;b.atkBonus+=2;b.defBonus+=1;b.hpBonus+=5;
toast(b.name+' 斗虫等级提升！Lv.'+b.fightLv,'#f0b72f');

'<div class="row"><span class="row-label">繁殖次数</span><b>'+G.stats.bred+'</b></div>'+
'<div class="row"><span class="row-label">变异次数</span><b>'+G.stats.mutated+'</b></div>'+
'<div class="row"><span class="row-label">斗虫场次</span><b>'+G.stats.fights+'</b></div></div>';
host.innerHTML=html;
}
function renderLab(host){
let html='<div class="card"><div class="card-title">🔬 研究所</div>'+
'<div class="row"><span class="row-label">等级</span><b>Lv.'+G.level+'</b></div>'+
'<div class="prog-row"><div class="prog-head"><span>经验</span><b>'+Math.round(G.exp)+' / '+(G.level*400)+'</b></div><div class="prog-bar"><i style="width:'+Math.min(100,G.exp/(G.level*400)*100)+'%;background:#58a6ff"></i></div></div>'+
'<div class="row"><span class="row-label">研究点</span><b>'+G.research+'</b></div>'+
'<div class="act-row">'+
'<button class="act" id="openBreed">🧬 繁殖</button>'+
'<button class="act" id="openLogBtn">📜 日志</button>'+
'<button class="act danger wide" id="openReset">🗑 重置存档</button>'+
'</div></div>';
html+='<div class="card"><div class="card-title">🏆 成就</div>';
ACHS.forEach(function(a){
const got=G.ach[a.k];
html+='<div class="row" style="opacity:'+(got?'1':'.5')+'"><span class="row-label">'+(got?'🏆 ':'🔒 ')+a.n+' · '+a.d+'</span><b>'+(got?'已达成':'+'+a.r+'🪙')+'</b></div>';
});
html+='</div>';
host.innerHTML=html;
host.querySelector('#openBreed').onclick=()=>openBreedModal(null);
host.querySelector('#openLogBtn').onclick=()=>openLog();
host.querySelector('#openReset').onclick=()=>{
if(confirm('确定要重置所有进度吗？')){
localStorage.removeItem(SAVE_KEY);
location.reload();
}
};
}
function openLog(){
const html='<div class="log-list">'+
(G.log.length?G.log.slice(-60).reverse().map(function(l){return '<div class="log-item '+l.t+'">'+l.m+'</div>'}).join(''):'<div class="empty-note">暂无记录</div>')+'</div>';
openModal('📜 事件日志',html);
}
function openBreedModal(pre){
const candidates=[];
G.tanks.forEach(t=>t.bugs.forEach(b=>{if(b.mature&&b.alive)candidates.push(b)}));
if(candidates.length<2){openModal('🧬 繁殖','<div class="empty-note">至少需要两只成熟虫才能繁殖</div>');return}
let sel1=pre||null;
let sel2=null;
if(sel1)sel2=candidates.find(b=>b!==sel1&&b.sp===sel1.sp)||null;
function pickHtml(list,sel){
return list.map(function(b){
const on=b===sel?' gold':'';
return '<button class="act'+on+'" data-id="'+b.id+'" style="font-size:10px;flex-direction:column">'+b.name+'<br>'+SPECIES[b.sp].n+'<br>'+RARITY[b.q].n+'</button>';
}).join('');
}
function renderPick(){
const body=document.querySelector('#modalHost .modal-body');
if(!body)return;
body.querySelector('#pickA').innerHTML=pickHtml(candidates,sel1);
body.querySelector('#pickB').innerHTML=pickHtml(candidates.filter(b=>b!==sel1),sel2);
body.querySelectorAll('#pickA [data-id]').forEach(function(el){el.onclick=function(){sel1=candidates.find(b=>b.id===+el.dataset.id);if(sel2===sel1)sel2=null;renderPick()}});
body.querySelectorAll('#pickB [data-id]').forEach(function(el){el.onclick=function(){sel2=candidates.find(b=>b.id===+el.dataset.id);renderPick()}});
const info=body.querySelector('#breedInfo');
if(sel1&&sel2){
if(sel1.sp!==sel2.sp)info.innerHTML='<div class="row" style="border-color:rgba(248,81,73,.5)"><span class="row-label">品种不同，无法繁殖</span><b style="color:#f85149">✕</b></div>';
else{
const qMax=Math.max(sel1.q,sel2.q);
const luck=Math.min(60,Math.round(((sel1.genes.mut+sel2.genes.mut)/2-1)*40+22));
info.innerHTML='<div class="row"><span class="row-label">子代品相基础</span><b>'+RARITY[qMax].n+'</b></div>'+
'<div class="row"><span class="row-label">变异概率</span><b>~'+Math.max(0,luck)+'%</b></div>'+
'<div class="row"><span class="row-label">消耗饲料</span><b>120🌾</b></div>';
}
}else info.innerHTML='<div class="row"><span class="row-label">请选择两只亲代</span><b></b></div>';
}
const html='<div style="font-size:12px;color:#7d8590;margin-bottom:10px">同种成熟虫交配，子代继承基因并可能变异</div>'+
'<div class="section-label">亲代 A</div><div id="pickA" class="act-row" style="grid-template-columns:1fr 1fr 1fr"></div>'+
'<div class="section-label">亲代 B</div><div id="pickB" class="act-row" style="grid-template-columns:1fr 1fr 1fr"></div>'+
'<div class="section-label">预览</div><div id="breedInfo"></div>'+
'<div class="act-row"><button class="act wide gold" id="doBreed">🧬 开始繁殖（120🌾）</button></div>';
openModal('🧬 繁殖交配',html,function(body){
renderPick();
body.querySelector('#doBreed').onclick=function(){
if(!sel1||!sel2){toast('请选择两只虫','#f85149');return}
if(sel1.sp!==sel2.sp){toast('必须同种才能繁殖','#f85149');return}
doBreed(sel1,sel2);closeModal();
};
});
}
function doBreed(b1,b2){
if(G.food<120){toast('饲料不足','#f85149');return}
const tank=findTankOf(b1);
if(!tank){toast('找不到虫缸','#f85149');return}
if(tank.bugs.length>=tank.capacity){toast('缸内空间不足','#f85149');return}
G.food-=120;
const inherit={gs:(b1.genes.size+b2.genes.size)/2,gv:(b1.genes.speed+b2.genes.speed)/2,ga:(b1.genes.appetite+b2.genes.appetite)/2,gm:(b1.genes.mut+b2.genes.mut)/2};
const qBase=Math.max(b1.q,b2.q);
const childCount=1+((b1.genes.mut+b2.genes.mut)>2.4?1:0);
for(let i=0;i<childCount;i++){
let cq=qBase;
if(Math.random()<0.07)cq=Math.min(RARITY.length-1,qBase+1);
const child=makeBug(b1.sp,{q:cq,gs:inherit.gs+rand(-0.1,0.1),gv:inherit.gv+rand(-0.1,0.1),ga:inherit.ga+rand(-0.1,0.1),gm:inherit.gm+rand(-0.12,0.12)});
if(b1.mut&&Math.random()<0.3)child.mut=b1.mut;
else if(b2.mut&&Math.random()<0.3)child.mut=b2.mut;
tank.bugs.push(child);
if(child.mut){G.stats.mutated++;log('繁殖出变异虫 · '+MUTS[child.mut].n,'gold');toast('变异！'+MUTS[child.mut].n,'#f0b72f');checkAch()}
}
G.stats.bred++;
b1.mood=clamp(b1.mood+10,0,100);
b2.mood=clamp(b2.mood+10,0,100);
toast('繁殖成功，获得 '+childCount+' 只幼虫','#3fb950');
log('繁殖成功 · '+SPECIES[b1.sp].n+' × '+childCount,'good');
levelCheck();render();
}
let tutStep=0;
function showTutorial(){
tutStep=0;
document.getElementById('tutOverlay').classList.add('open');
renderTut();
}
function renderTut(){
const t=TUTS[tutStep];
document.getElementById('tutStep').textContent='第 '+(tutStep+1)+' / '+TUTS.length+' 步';
document.getElementById('tutTitle').textContent=t.t;
document.getElementById('tutText').textContent=t.x;
const dots=document.getElementById('tutDots');
dots.innerHTML='';
TUTS.forEach((_,i)=>{
const d=document.createElement('div');
d.className='tut-dot'+(i===tutStep?' on':'');
dots.appendChild(d);
});
document.getElementById('tutNext').textContent=tutStep===TUTS.length-1?'开始游戏':'下一步';
}
function bindUI(){
document.getElementById('hudFeed').onclick=function(){
if(G.coins<FOOD_BUY_COST){toast('金币不足','#f85149');return}
G.coins-=FOOD_BUY_COST;
G.food=Math.min(foodCap(),G.food+FOOD_BUY_GAIN);
toast('饲料 +'+FOOD_BUY_GAIN,'#3fb950');
renderHUD();
};
document.getElementById('hudTutorial').onclick=function(){showTutorial()};
document.getElementById('tutNext').onclick=function(){
if(tutStep<TUTS.length-1){tutStep++;renderTut()}
else{
document.getElementById('tutOverlay').classList.remove('open');
G.tutorialDone=true;
checkAch();save();
}
};
document.getElementById('tutSkip').onclick=function(){
document.getElementById('tutOverlay').classList.remove('open');
G.tutorialDone=true;
save();
};
document.querySelectorAll('.tab').forEach(function(t){
t.onclick=function(){
document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on')});
t.classList.add('on');
G.view=t.dataset.v;
battle=null;
closeModal();
render();
};
});
}
function init(){
const loaded=load();
if(!loaded){
G.tanks=[makeTank(0,'一号缸'),makeTank(1,'二号缸'),makeTank(2,'三号缸')];
G.tanks[0].bugs.push(makeBug('ant'));
G.tanks[0].bugs.push(makeBug('mealworm'));
rollMarket();genOrders();
log('欢迎来到虫虫研究所','good');
}
G.tanks.forEach(function(t){
if(!t.upgrades)t.upgrades={};
if(!t.bugs)t.bugs=[];
t.bugs.forEach(function(b){
if(!b.name)b.name=genName();
if(!b.genes)b.genes={size:1,speed:1,appetite:1,mut:1};
if(b.x===undefined)b.x=rand(0.15,0.85);
if(b.y===undefined)b.y=rand(0.2,0.7);
if(b.vx===undefined)b.vx=0;
if(b.vy===undefined)b.vy=0;
if(b.wander===undefined)b.wander=0;
if(b.flashUntil===undefined)b.flashUntil=0;
if(b.age===undefined)b.age=0;
if(b.mood===undefined)b.mood=75;
if(b.disease===undefined)b.disease=null;
if(b.parasite===undefined)b.parasite=null;
if(b.symbiont===undefined)b.symbiont=null;
if(b.fightLv===undefined)b.fightLv=1;
if(b.fightExp===undefined)b.fightExp=0;
if(b.wins===undefined)b.wins=0;
if(b.losses===undefined)b.losses=0;
if(!b.skills)b.skills=(SP_SKILLS[b.sp]||['jab','guard','rush','heavy']).slice();
if(b.atkBonus===undefined)b.atkBonus=0;
if(b.defBonus===undefined)b.defBonus=0;
if(b.hpBonus===undefined)b.hpBonus=0;
if(b.title===undefined)b.title=null;
});
});
if(!G.market||!Object.keys(G.market).length)rollMarket();
if(!G.orders||!G.orders.length)genOrders();
applyOffline();
bindUI();
render();
requestAnimationFrame(loop);
setInterval(function(){save();if(G.view==='tanks')renderHUD()},5000);
document.addEventListener('visibilitychange',function(){
if(document.hidden)save();
else{
const el=(Date.now()-G.lastTime)/1000;
if(el>15){applyOffline();render()}
lastT=performance.now();
}
});
window.addEventListener('beforeunload',save);
}
const _hasSave=!!localStorage.getItem(SAVE_KEY);
if(_hasSave){
document.getElementById('diffScreen').style.display='none';
document.getElementById('app').style.display='block';
document.getElementById('tabbar').style.display='flex';
init();
showTutorial();
}else{
document.querySelectorAll('.diff-btn').forEach(function(btn){
btn.onclick=function(){
G.difficulty=btn.dataset.diff;
G.coins=DIFFS[G.difficulty].startCoins;
G.food=DIFFS[G.difficulty].startFood;
document.getElementById('diffScreen').style.display='none';
document.getElementById('app').style.display='block';
document.getElementById('tabbar').style.display='flex';
init();
showTutorial();
};
});
}
</script>
</body>
</html>
