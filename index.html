<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>心境自测 · 问答游戏</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #f7f3ff 0%, #e8e0f5 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .game-container {
      width: 100%;
      max-width: 720px;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 2.5rem;
      box-shadow: 0 25px 50px -10px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(255, 255, 255, 0.6) inset;
      padding: 2rem 1.8rem 2.2rem;
      border: 1px solid rgba(255, 255, 255, 0.8);
      transition: all 0.2s ease;
    }
    h1 {
      font-size: 1.9rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #2b1b3a;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.25rem;
    }
    h1 span {
      background: linear-gradient(135deg, #7c5cbf, #b18aff);
      font-size: 1.6rem;
      padding: 0.2rem 0.6rem;
      border-radius: 100px;
      color: white;
      font-weight: 500;
    }
    .subhead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.8rem;
      color: #5d4a6e;
      font-weight: 400;
      font-size: 0.95rem;
      border-bottom: 1px solid rgba(150, 120, 180, 0.2);
      padding-bottom: 0.75rem;
    }
    .progress-badge {
      background: #ffffffcc;
      backdrop-filter: blur(4px);
      padding: 0.35rem 1rem;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #4e3a62;
      box-shadow: 0 4px 10px rgba(100, 70, 130, 0.08);
      border: 1px solid #ffffff;
    }
    .question-area {
      min-height: 200px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    .question-text {
      font-size: 1.45rem;
      font-weight: 500;
      line-height: 1.4;
      color: #20162b;
      margin-bottom: 1rem;
      padding: 0 0.25rem;
      letter-spacing: -0.01em;
    }
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      margin-top: 0.5rem;
    }
    .option-btn {
      background: rgba(255, 255, 255, 0.8);
      border: 1.5px solid rgba(160, 130, 200, 0.2);
      border-radius: 1.5rem;
      padding: 1rem 1.5rem;
      font-size: 1.05rem;
      font-weight: 500;
      color: #2f2140;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.15s ease;
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.02);
      text-align: left;
      letter-spacing: -0.01em;
    }
    .option-btn:hover {
      background: #ffffff;
      border-color: #b89ae0;
      transform: scale(1.01);
      box-shadow: 0 12px 24px -8px rgba(120, 80, 180, 0.25);
    }
    .option-btn.selected {
      background: #efe5ff;
      border-color: #9b7fd4;
      box-shadow: 0 0 0 2px #c7b0f0, 0 10px 20px -5px rgba(130, 90, 200, 0.3);
      color: #1f102e;
      font-weight: 500;
    }
    .option-btn .score-hint {
      font-size: 0.8rem;
      background: #e4d5fc;
      color: #4f3570;
      padding: 0.25rem 0.9rem;
      border-radius: 30px;
      font-weight: 500;
      transition: all 0.1s;
    }
    .option-btn.selected .score-hint {
      background: #ad8be0;
      color: white;
    }
    .nav-buttons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.2rem;
      gap: 1rem;
    }
    .btn {
      border: none;
      background: #ffffffd0;
      backdrop-filter: blur(8px);
      padding: 0.9rem 2rem;
      border-radius: 3rem;
      font-weight: 550;
      font-size: 1rem;
      color: #3c2b50;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
      border: 1px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      flex: 1;
      letter-spacing: -0.01em;
    }
    .btn-primary {
      background: linear-gradient(135deg, #8460c0, #a77ee0);
      color: white;
      border: none;
      box-shadow: 0 12px 18px -6px #9b7fd4b0;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #7756b3, #9b72d6);
      transform: translateY(-1px);
      box-shadow: 0 18px 25px -8px #8460c0c0;
    }
    .btn:disabled {
      opacity: 0.4;
      pointer-events: none;
      filter: grayscale(0.5);
      box-shadow: none;
    }
    .btn-secondary:hover {
      background: #ffffff;
      border-color: #cbb8e6;
    }
    .result-card {
      text-align: center;
      padding: 1rem 0.5rem 0.5rem;
    }
    .result-score {
      font-size: 4.5rem;
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(135deg, #4b2e6b, #7d5ba6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
      filter: drop-shadow(0 8px 16px rgba(120, 80, 180, 0.2));
    }
    .result-label {
      font-size: 1.2rem;
      font-weight: 500;
      color: #3b2b4b;
      margin-bottom: 0.75rem;
    }
    .interpretation {
      font-size: 1.05rem;
      color: #4d3b5e;
      background: #ffffffc9;
      backdrop-filter: blur(8px);
      padding: 1.2rem 1.5rem;
      border-radius: 2rem;
      border: 1px solid #ffffff;
      margin: 0.5rem 0 1.4rem;
      line-height: 1.5;
      font-weight: 450;
    }
    .scale-note {
      font-size: 0.85rem;
      color: #7a6790;
      background: #f2ecfc;
      padding: 0.6rem 1rem;
      border-radius: 3rem;
      display: inline-block;
      margin-bottom: 0.5rem;
      font-weight: 450;
    }
    .restart-btn {
      background: #ffffffd0;
      border: 1px solid #ffffff;
      padding: 0.9rem 2rem;
      border-radius: 3rem;
      font-weight: 550;
      font-size: 1rem;
      color: #3c2b50;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 8px 18px -8px rgba(0, 0, 0, 0.1);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .restart-btn:hover {
      background: white;
      transform: scale(1.01);
      box-shadow: 0 14px 22px -8px #b59ad8;
    }
    .footer-note {
      font-size: 0.7rem;
      color: #988ab0;
      text-align: center;
      margin-top: 1.2rem;
      border-top: 1px solid #e4d9f0;
      padding-top: 0.8rem;
      letter-spacing: 0.2px;
    }
    .fade-in {
      animation: fade 0.3s ease;
    }
    @keyframes fade {
      from { opacity: 0.3; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
