<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>寸头溜达猪 · 导航站</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0d0b0a;
    --primary: #e8a87c;
    --primary-2: #d4835a;
    --qq: #12b7f5;
    --text: #f3ede7;
    --text-dim: #8b817a;
    --text-mute: #5f574f;
    --border: rgba(255, 255, 255, 0.07);
    --card: rgba(255, 255, 255, 0.035);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI',
                 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== 背景光晕 ===== */
  .glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(110px);
    pointer-events: none;
    z-index: 0;
  }
  .glow-1 {
    width: 720px; height: 720px;
    top: -340px; left: 50%;
    transform: translateX(-50%);
    background: radial-gradient(circle, rgba(232, 168, 124, 0.14), transparent 68%);
  }
  .glow-2 {
    width: 520px; height: 520px;
    bottom: -260px; left: -180px;
    background: radial-gradient(circle, rgba(212, 131, 90, 0.09), transparent 70%);
  }
  .glow-3 {
    width: 500px; height: 500px;
    bottom: -240px; right: -160px;
    background: radial-gradient(circle, rgba(18, 183, 245, 0.06), transparent 70%);
  }

  /* ===== 导航栏 ===== */
  .navbar {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 2.5rem;
    background: rgba(13, 11, 10, 0.72);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border-bottom: 1px solid var(--border);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    text-decoration: none;
  }
  .logo img {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.10), 0 6px 16px rgba(232,168,124,0.16);
  }
  .logo-name {
    font-size: 0.98rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--text);
  }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 0.7rem;
  }

  .nav-links {
    display: flex;
    gap: 0.4rem;
    align-items: center;
  }
  .nav-links a {
    font-size: 0.86rem;
    font-weight: 500;
    color: var(--text-dim);
    text-decoration: none;
    padding: 0.5rem 1rem;
    border-radius: 10px;
    transition: color 0.22s ease, background 0.22s ease;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .nav-links a:hover { color: var(--text); background: rgba(255,255,255,0.04); }
  .nav-links a.active { color: var(--primary); background: rgba(232, 168, 124, 0.09); }
  .nav-links a svg { width: 14px; height: 14px; fill: currentColor; }

  /* ===== 圆形 QQ 图标（导航栏）===== */
  .qq-round {
    position: relative;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    cursor: pointer;
    text-decoration: none;
    background: #0d0b0a;
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.10),
      0 6px 16px rgba(0, 0, 0, 0.4),
      0 0 0 3px rgba(18, 183, 245, 0.10);
    transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.3s ease;
  }
  .qq-round img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transform: scale(1.2);
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  .qq-round:hover {
    transform: scale(1.12);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.14),
      0 10px 24px rgba(0, 0, 0, 0.5),
      0 0 0 4px rgba(18, 183, 245, 0.20);
  }
  .qq-round:active { transform: scale(0.96); }

  /* 在线小绿点 */
  .qq-round .dot {
    position: absolute;
    right: 1px;
    bottom: 1px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #35d07f;
    border: 2px solid #0d0b0a;
    z-index: 3;
    animation: dotPulse 2s ease-in-out infinite;
  }
  @keyframes dotPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(53, 208, 127, 0.6); }
    50%      { box-shadow: 0 0 0 5px rgba(53, 208, 127, 0); }
  }

  /* ===== 主体 ===== */
  .main {
    flex: 1;
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 860px;
    margin: 0 auto;
    padding: 3.5rem 2rem 4rem;
  }

  /* ===== Hero ===== */
  .hero {
    text-align: center;
    margin-bottom: 3.5rem;
    animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .hero-logo {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 1.6rem;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.08),
      0 20px 50px rgba(232,168,124,0.18),
      0 8px 20px rgba(0,0,0,0.4);
  }
  .hero h1 {
    font-size: clamp(1.8rem, 4.5vw, 2.6rem);
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text);
    margin-bottom: 0.7rem;
  }
  .hero-sub {
    font-size: 0.72rem;
    letter-spacing: 8px;
    color: var(--text-mute);
    text-transform: uppercase;
    font-weight: 500;
    margin-bottom: 2.4rem;
    padding-left: 8px;
  }

  /* 搜索框 */
  .search-box {
    max-width: 460px;
    margin: 0 auto;
    position: relative;
  }
  .search-box input {
    width: 100%;
    padding: 0.95rem 1.4rem 0.95rem 3.1rem;
    background: rgba(255,255,255,0.035);
    border: 1px solid var(--border);
    border-radius: 100px;
    color: var(--text);
    font-size: 0.92rem;
    outline: none;
    transition: all 0.25s ease;
    font-family: inherit;
  }
  .search-box input::placeholder { color: var(--text-mute); }
  .search-box input:focus {
    border-color: rgba(232,168,124,0.38);
    background: rgba(255,255,255,0.055);
    box-shadow: 0 0 0 4px rgba(232,168,124,0.07);
  }
  .search-box svg {
    position: absolute;
    left: 1.25rem;
    top: 50%;
    transform: translateY(-50%);
    width: 17px; height: 17px;
    fill: var(--text-mute);
    pointer-events: none;
    transition: fill 0.25s;
  }
  .search-box input:focus + svg { fill: var(--primary); }

  /* ===== QQ 加好友按钮（Hero）===== */
  .qq-wrapper {
    display: flex;
    justify-content: center;
    margin-top: 1.4rem;
  }

  .qq-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.85rem;
    padding: 0.55rem 1.4rem 0.55rem 0.55rem;
    background: rgba(255,255,255,0.035);
    border: 1px solid var(--border);
    border-radius: 100px;
    color: var(--text);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    position: relative;
    overflow: hidden;
  }

  .qq-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 25% 50%, rgba(18, 183, 245, 0.18), transparent 70%);
    opacity: 0;
    transition: opacity 0.35s ease;
    pointer-events: none;
  }

  .qq-btn:hover {
    border-color: rgba(18, 183, 245, 0.45);
    background: rgba(255,255,255,0.055);
    transform: translateY(-2px);
    box-shadow:
      0 12px 28px rgba(0, 0, 0, 0.28),
      0 0 0 4px rgba(18, 183, 245, 0.08);
  }
  .qq-btn:hover::before { opacity: 1; }
  .qq-btn:active { transform: translateY(0) scale(0.99); }

  /* 圆形头像容器 —— 放大铺满 */
  .qq-avatar-wrap {
    position: relative;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    flex-shrink: 0;
    overflow: hidden;
    background: #0d0b0a;
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.10),
      0 4px 12px rgba(0, 0, 0, 0.35);
    z-index: 1;
    transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .qq-avatar-wrap img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transform: scale(1.2);
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  .qq-btn:hover .qq-avatar-wrap {
    transform: scale(1.08) rotate(-6deg);
  }

  .qq-text {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    line-height: 1.3;
    position: relative;
    z-index: 1;
  }

  .qq-label {
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.3px;
  }

  .qq-id {
    font-size: 0.7rem;
    color: var(--text-mute);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.8px;
    margin-top: 1px;
    transition: color 0.3s ease;
  }
  .qq-btn:hover .qq-id { color: var(--qq); }

  .qq-arrow {
    width: 14px;
    height: 14px;
    fill: var(--text-mute);
    flex-shrink: 0;
    position: relative;
    z-index: 1;
    transition: transform 0.3s ease, fill 0.3s ease;
    margin-left: 0.1rem;
  }
  .qq-btn:hover .qq-arrow {
    transform: translateX(3px);
    fill: var(--qq);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ===== 播放器卡片 ===== */
  .player-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 1.4rem 1.6rem 1.3rem;
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    box-shadow:
      0 24px 60px rgba(0, 0, 0, 0.35),
      inset 0 1px 0 rgba(255, 255, 255, 0.04);
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
    animation: fadeUp 0.9s 0.12s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .player-card:hover {
    border-color: rgba(232, 168, 124, 0.18);
    box-shadow:
      0 30px 70px rgba(0, 0, 0, 0.4),
      inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }

  /* 卡片标题 */
  .card-head {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    padding-bottom: 1rem;
    margin-bottom: 1.15rem;
    border-bottom: 1px solid var(--border);
  }
  .card-head svg {
    width: 15px; height: 15px;
    fill: var(--primary);
    flex-shrink: 0;
  }
  .card-head span {
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 1.5px;
    color: var(--text-dim);
  }
  .card-head .badge {
    margin-left: auto;
    font-size: 0.62rem;
    letter-spacing: 1px;
    color: var(--text-mute);
    padding: 0.22rem 0.6rem;
    border: 1px solid var(--border);
    border-radius: 100px;
    font-weight: 500;
  }

  /* 迷你播放条 */
  .mini-player {
    display: flex;
    align-items: center;
    gap: 1.1rem;
  }

  /* 小封面 */
  .mini-cover {
    position: relative;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    box-shadow: 0 6px 16px rgba(0,0,0,0.4);
    transition: box-shadow 0.4s ease;
  }
  .mini-cover img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }
  .mini-cover::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    pointer-events: none;
  }
  .mini-cover.playing {
    box-shadow:
      0 6px 16px rgba(0,0,0,0.4),
      0 0 0 2px rgba(232,168,124,0.45),
      0 0 24px rgba(232,168,124,0.35);
    animation: coverGlow 2.4s ease-in-out infinite;
  }
  @keyframes coverGlow {
    0%, 100% { box-shadow: 0 6px 16px rgba(0,0,0,0.4), 0 0 0 2px rgba(232,168,124,0.4), 0 0 20px rgba(232,168,124,0.25); }
    50%      { box-shadow: 0 6px 16px rgba(0,0,0,0.4), 0 0 0 2px rgba(232,168,124,0.6), 0 0 30px rgba(232,168,124,0.45); }
  }

  /* 曲目信息 */
  .mini-info {
    flex: 1;
    min-width: 0;
  }
  .mini-title {
    font-size: 0.92rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 0.5rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 进度行 */
  .mini-progress-row {
    display: flex;
    align-items: center;
    gap: 0.7rem;
  }
  .mini-time {
    font-size: 0.68rem;
    color: var(--text-mute);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
    letter-spacing: 0.3px;
  }
  .mini-progress {
    flex: 1;
    height: 4px;
    background: rgba(255, 255, 255, 0.07);
    border-radius: 10px;
    cursor: pointer;
    position: relative;
    transition: height 0.22s ease;
  }
  .mini-progress:hover { height: 6px; }
  .mini-fill {
    height: 100%;
    width: 0%;
    border-radius: 10px;
    background: linear-gradient(90deg, var(--primary-2), var(--primary));
    position: relative;
    transition: width 0.08s linear;
  }
  .mini-fill::after {
    content: '';
    position: absolute;
    right: -4px; top: 50%;
    transform: translateY(-50%) scale(0.5);
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 10px rgba(232,168,124,0.9);
    opacity: 0;
    transition: opacity 0.22s ease, transform 0.22s ease;
  }
  .mini-progress:hover .mini-fill::after {
    opacity: 1;
    transform: translateY(-50%) scale(1);
  }

  /* 控制按钮 */
  .mini-controls {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    flex-shrink: 0;
  }
  .mini-btn {
    background: none;
    border: none;
    padding: 0.45rem;
    cursor: pointer;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: color 0.22s ease, transform 0.22s ease, background 0.22s ease;
  }
  .mini-btn:hover { color: var(--primary); transform: scale(1.12); background: rgba(255,255,255,0.04); }
  .mini-btn:active { transform: scale(0.94); }
  .mini-btn svg { width: 17px; height: 17px; fill: currentColor; display: block; }

  .mini-play {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: linear-gradient(140deg, var(--primary), var(--primary-2));
    color: #1a1310 !important;
    box-shadow:
      0 8px 20px rgba(232, 168, 124, 0.28),
      inset 0 1px 0 rgba(255,255,255,0.45);
    margin: 0 0.15rem;
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s ease;
  }
  .mini-play:hover {
    transform: scale(1.07);
    background: linear-gradient(140deg, var(--primary), var(--primary-2));
    color: #1a1310 !important;
    box-shadow:
      0 12px 28px rgba(232, 168, 124, 0.42),
      inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .mini-play:active { transform: scale(0.96); }
  .mini-play svg { width: 18px; height: 18px; }

  /* 音量行 */
  .volume-row {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    margin-top: 1.15rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
  }
  .volume-row svg {
    width: 14px; height: 14px;
    fill: var(--text-mute);
    flex-shrink: 0;
    transition: fill 0.2s;
  }
  .volume-row:hover svg { fill: var(--primary); }
  .volume-row input {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 3px;
    border-radius: 4px;
    background: rgba(255,255,255,0.07);
    outline: none;
    cursor: pointer;
  }
  .volume-row input::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 11px; height: 11px;
    border-radius: 50%;
    background: var(--primary);
    cursor: pointer;
    box-shadow: 0 0 8px rgba(232,168,124,0.55);
    transition: transform 0.18s ease;
  }
  .volume-row input::-webkit-slider-thumb:hover { transform: scale(1.3); }
  .volume-row input::-moz-range-thumb {
    width: 11px; height: 11px;
    border: none;
    border-radius: 50%;
    background: var(--primary);
    cursor: pointer;
    box-shadow: 0 0 8px rgba(232,168,124,0.55);
  }

  /* ===== 暂无区 ===== */
  .empty {
    margin-top: 1.4rem;
    padding: 3.2rem 2rem;
    border: 1px dashed var(--border);
    border-radius: 22px;
    text-align: center;
    background: rgba(255, 255, 255, 0.008);
    animation: fadeUp 0.9s 0.24s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .empty-icon {
    width: 42px; height: 42px;
    margin: 0 auto 0.9rem;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.025);
    border: 1px solid var(--border);
  }
  .empty-icon svg { width: 20px; height: 20px; fill: var(--text-mute); }
  .empty-text {
    font-size: 0.88rem;
    color: var(--text-dim);
    letter-spacing: 5px;
    font-weight: 500;
    padding-left: 5px;
  }
  .empty-hint {
    font-size: 0.7rem;
    color: var(--text-mute);
    letter-spacing: 1px;
    margin-top: 0.5rem;
  }

  /* ===== 页脚 ===== */
  .footer {
    position: relative;
    z-index: 2;
    padding: 1.6rem 2rem;
    border-top: 1px solid var(--border);
    text-align: center;
    font-size: 0.76rem;
    color: var(--text-mute);
    letter-spacing: 1.5px;
    background: rgba(0,0,0,0.15);
  }

  /* ===== Toast ===== */
  #qqToast {
    position: fixed;
    left: 50%;
    bottom: 40px;
    transform: translateX(-50%) translateY(20px);
    background: rgba(30, 26, 24, 0.95);
    border: 1px solid rgba(18, 183, 245, 0.35);
    color: #f3ede7;
    padding: 0.8rem 1.3rem;
    border-radius: 14px;
    font-size: 0.85rem;
    letter-spacing: 0.5px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.5);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 999;
    white-space: nowrap;
  }

  /* ===== 响应式 ===== */
  @media (max-width: 640px) {
    .navbar { padding: 0.85rem 1.2rem; }
    .logo img { width: 30px; height: 30px; }
    .logo-name { font-size: 0.88rem; letter-spacing: 1px; }
    .nav-links a { padding: 0.45rem 0.7rem; font-size: 0.8rem; }
    .nav-links a span { display: none; }
    .qq-round { width: 34px; height: 34px; }
    .qq-round .dot { width: 9px; height: 9px; }
    .main { padding: 2.5rem 1.2rem 2.5rem; }
    .hero-logo { width: 70px; height: 70px; }
    .hero-sub { letter-spacing: 6px; }
    .player-card { padding: 1.2rem 1.2rem 1.1rem; border-radius: 18px; }

    .qq-btn { padding: 0.5rem 1.2rem 0.5rem 0.5rem; gap: 0.65rem; }
    .qq-avatar-wrap { width: 36px; height: 36px; }
    .qq-label { font-size: 0.82rem; }
    .qq-id { font-size: 0.66rem; }

    .mini-player { gap: 0.85rem; }
    .mini-cover { width: 48px; height: 48px; }
    .mini-title { font-size: 0.85rem; }
    .mini-play { width: 38px; height: 38px; }
    .mini-play svg { width: 16px; height: 16px; }
    .mini-btn svg { width: 15px; height: 15px; }
    .mini-progress-row { gap: 0.5rem; }
    .mini-time { font-size: 0.62rem; }
    .empty { padding: 2.6rem 1.4rem; }
    #qqToast { font-size: 0.78rem; padding: 0.7rem 1.1rem; bottom: 24px; }
  }
</style>
</head>
<body>

           alt="寸头溜达猪">
      <h1>寸头溜达猪</h1>
      <div class="hero-sub">导航站</div>

      <div class="search-box">
        <input type="text" placeholder="搜索导航 · 网址 · 工具..." aria-label="搜索">
        <svg viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>

      <!-- QQ 加好友按钮（Hero） -->
      <div class="qq-wrapper">
        <a href="javascript:void(0)"

           title="点击添加溜达猪QQ好友">
          <span class="qq-avatar-wrap">
            <img src="https://image.fatcattech.cn/i/2026/10/02/x3hn8l.png" alt="溜达猪QQ">
          </span>
          <span class="qq-text">
            <span class="qq-label">添加溜达猪QQ</span>
            <span class="qq-id">1620832290</span>

    <!-- 音乐播放器卡片 -->

  <!-- ===== 页脚 ===== -->

  <!-- 音频 -->

    <source src="https://mp3tourl.com/audio/1790941456069-5518b2bd-762a-44aa-810e-c55f8c5797da.mp3" type="audio/mpeg">
  </audio>

  <!-- Toast -->
  <div id="qqToast">
    <span style="color:#12b7f5;font-weight:700;">✓</span> QQ号已复制，去QQ搜索添加吧
  </div>

  <script>
    /* ==================== 音乐播放 ==================== */
    (function () {
      const audio     = document.getElementById('audio');
      const playBtn   = document.getElementById('playBtn');
      const playIcon  = document.getElementById('playIcon');
      const pauseIcon = document.getElementById('pauseIcon');
      const miniCover = document.getElementById('miniCover');
      const progress  = document.getElementById('progress');
      const fill      = document.getElementById('progressFill');
      const curTime   = document.getElementById('curTime');
      const durTime   = document.getElementById('durTime');
      const volume    = document.getElementById('volume');
      const prevBtn   = document.getElementById('prevBtn');
      const nextBtn   = document.getElementById('nextBtn');

      const fmt = s => {
        if (!isFinite(s) || s < 0) return '0:00';
        const m = Math.floor(s / 60);
        const r = Math.floor(s % 60);
        return m + ':' + (r < 10 ? '0' : '') + r;
      };

      function setPlayingUI(playing) {
        playIcon.style.display  = playing ? 'none'  : 'block';
        pauseIcon.style.display = playing ? 'block' : 'none';
        miniCover.classList.toggle('playing', playing);
        playBtn.setAttribute('aria-label', playing ? '暂停' : '播放');
      }

      playBtn.addEventListener('click', () => {
        if (audio.paused) {
          audio.play().then(() => setPlayingUI(true))
                      .catch(err => { console.warn('播放失败:', err); setPlayingUI(false); });
        } else {
          audio.pause();
          setPlayingUI(false);
        }
      });

      audio.addEventListener('play',  () => setPlayingUI(true));
      audio.addEventListener('pause', () => setPlayingUI(false));

      audio.addEventListener('timeupdate', () => {
        if (audio.duration && isFinite(audio.duration)) {
          fill.style.width = (audio.currentTime / audio.duration * 100) + '%';
          curTime.textContent = fmt(audio.currentTime);
        }
      });

      audio.addEventListener('loadedmetadata', () => {
        durTime.textContent = fmt(audio.duration);
      });
      if (audio.readyState >= 1) durTime.textContent = fmt(audio.duration);

      progress.addEventListener('click', e => {
        const rect = progress.getBoundingClientRect();
        const pct  = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
        if (audio.duration && isFinite(audio.duration)) {
          audio.currentTime = pct * audio.duration;
        }
      });

      audio.volume = parseFloat(volume.value);
      volume.addEventListener('input', () => { audio.volume = parseFloat(volume.value); });

      prevBtn.addEventListener('click', () => {
        audio.currentTime = 0;
        if (!audio.paused) audio.play();
      });
      nextBtn.addEventListener('click', () => {
        audio.currentTime = 0;
        if (!audio.paused) audio.play();
      });

      audio.addEventListener('error', () => setPlayingUI(false));
    })();

    /* ==================== QQ 加好友 ==================== */
    (function () {
      const QQ_NUMBER = '1620832290';

      function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
        } else {
          fallbackCopy(text);
        }
      }
      function fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (err) {}
        document.body.removeChild(ta);
      }

      let toastTimer = null;
      function showToast(msg) {
        const toast = document.getElementById('qqToast');
        toast.innerHTML = '<span style="color:#12b7f5;font-weight:700;">✓</span> ' + msg;
        toast.style.opacity = '1';
        toast.style.transform = 'translateX(-50%) translateY(0)';
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transform = 'translateX(-50%) translateY(20px)';
        }, 2600);
      }

      window.addQQ = function (e) {
        if (e) e.preventDefault();

        const ua = navigator.userAgent.toLowerCase();
        const isMobile = /android|iphone|ipad|ipod|mobile/.test(ua);

        // 先复制 QQ 号，兜底
        copyText(QQ_NUMBER);

        if (isMobile) {
          const mqqUrl = `mqqapi://card/show_pslcard?src_type=internal&version=1&uin=${QQ_NUMBER}&card_type=person&source=qrcode`;
          window.location.href = mqqUrl;
          setTimeout(() => showToast('已复制QQ号 · 请在QQ中搜索添加'), 800);
        } else {
          const tencentUrl = `tencent://AddContact/?fromId=45&fromSubId=1&subcmd=all&uin=${QQ_NUMBER}&website=www.oicqzone.com`;
          window.location.href = tencentUrl;

          let hidden = false;
          const onBlur = () => { hidden = true; };
          window.addEventListener('blur', onBlur, { once: true });

          setTimeout(() => {
            window.removeEventListener('blur', onBlur);
            if (!hidden) {
              showToast('未检测到QQ · QQ号已复制，请手动搜索添加');
            } else {
              showToast('已打开QQ，点击「加好友」即可');
            }
          }, 1200);
        }
      };
    })();
  </script>

</body>
