<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>虫鱼研究所</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0e14;--line:#222b37;--line2:#2f3a48;--text:#e6edf3;--dim:#7d8590;--accent:#58a6ff;--gold:#f0b72f;--green:#3fb950;--purple:#a371f7;--red:#f85149;--water:#1a6b8a;--ease:cubic-bezier(.34,1.56,.64,1)}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:radial-gradient(ellipse 90% 60% at 50% -10%,rgba(88,166,255,.09),transparent 60%),var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;user-select:none;overscroll-behavior:none}
.app{max-width:780px;margin:0 auto;height:100vh;position:relative;padding-bottom:calc(78px + env(safe-area-inset-bottom));overflow-y:auto}
.app::-webkit-scrollbar{width:0}
.hud{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:6px;padding:10px 12px;background:rgba(10,14,20,.92);backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,.06)}
.hud-logo{font-size:18px;margin-right:2px}
.hud-stat{display:flex;align-items:center;gap:4px;padding:5px 9px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.05);font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.hud-stat i{font-style:normal;font-size:11px}
.hud-stat.gold b{color:var(--gold)}
.hud-stat.low b{color:var(--red)}
.hud-spacer{flex:1}
.hud-btn{padding:6px 12px;border-radius:9px;border:1px solid var(--line2);background:linear-gradient(180deg,#1d2a38,#151e28);color:var(--text);font-size:11.5px;font-weight:600;font-family:inherit;cursor:pointer}
.hud-btn:active{transform:scale(.94)}
main{padding:12px 12px 20px}
.diff-screen{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(88,166,255,.15),transparent 60%),var(--bg);padding:30px;text-align:center}
.diff-title{font-size:26px;font-weight:800;letter-spacing:3px;margin-bottom:8px;background:linear-gradient(180deg,#fff 30%,#7d8590);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.diff-sub{font-size:12px;color:var(--dim);margin-bottom:30px}
.diff-options{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px}
.diff-btn{padding:16px 18px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.035);color:var(--text);font-family:inherit;cursor:pointer;text-align:left;transition:.3s}
.diff-btn:hover{border-color:var(--accent);transform:translateY(-3px)}
.diff-btn .dn{font-size:15px;font-weight:700;margin-bottom:4px}
.diff-btn .dd{font-size:11px;color:var(--dim);line-height:1.5}
.diff-btn .dm{font-size:10px;color:var(--gold);margin-top:5px}
.tut-overlay{position:fixed;inset:0;z-index:400;background:rgba(4,6,9,.85);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px}
.tut-overlay.open{display:flex}
.tut-box{width:100%;max-width:420px;background:linear-gradient(180deg,#1a2230,#111720);border:1px solid var(--line2);border-radius:22px;padding:24px}
.tut-dots{display:flex;gap:6px;justify-content:center;margin-bottom:18px}
.tut-dot{width:6px;height:6px;border-radius:50%;background:#2a3441;transition:.3s}
.tut-dot.on{background:var(--accent);width:20px;border-radius:3px}
.tut-step{font-size:10px;color:var(--dim);letter-spacing:1.5px;margin-bottom:8px}
.tut-title{font-size:17px;font-weight:700;margin-bottom:12px}
.tut-text{font-size:13px;color:#b1bac4;line-height:1.85;margin-bottom:20px}
.tut-actions{display:flex;gap:8px}
.tut-actions button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.tut-actions button.primary{background:rgba(88,166,255,.2);border-color:rgba(88,166,255,.55);color:var(--accent)}
.zone{background:linear-gradient(180deg,rgba(28,36,48,.75),rgba(21,27,36,.88));border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px}
.zone-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.zone-title{font-size:14px;font-weight:700}
.zone-tier{font-size:10px;color:var(--dim)}
.zone-spacer{flex:1}
.zone-cap{font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.env-bar{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.env-chip{display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);font-size:10.5px;color:var(--dim);cursor:pointer;font-family:inherit}
.env-chip b{color:var(--text);font-weight:700}
.env-chip.bad{border-color:rgba(248,81,73,.5)}
.env-chip.bad b{color:var(--red)}
.tank{position:relative;width:100%;height:190px;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.07);box-shadow:inset 0 10px 30px rgba(0,0,0,.65)}
.tank.water{border-color:rgba(26,107,138,.4)}
.bug{position:absolute;left:0;top:0;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;will-change:transform;padding:2px}
.bug span{display:block;width:84%;text-align:center;line-height:1.05;font-weight:700;word-break:break-all;pointer-events:none}
@keyframes flash{0%{filter:brightness(1)}30%{filter:brightness(2.4)}100%{filter:brightness(1)}}
.bug.flash{animation:flash .9s ease}
@keyframes pulseM{0%,100%{box-shadow:0 0 0 0 rgba(240,183,47,0)}50%{box-shadow:0 0 18px 3px rgba(240,183,47,.5)}}
.bug.mature{animation:pulseM 2.2s ease-in-out infinite}
.bug.dead{opacity:.28;filter:grayscale(1)}
.tank-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#3a4757;font-size:11px;letter-spacing:2px;pointer-events:none}
.shop{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.buy-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.025);color:var(--text);cursor:pointer;font-family:inherit}
.buy-btn b{font-size:10.5px;font-weight:600;white-space:nowrap}
.buy-btn span{font-size:10px;color:var(--gold);font-weight:700}
.buy-btn:disabled{opacity:.3;cursor:not-allowed}
.modal-host{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.modal-host.open{display:flex}
.modal-mask{position:absolute;inset:0;background:rgba(4,6,9,.78);backdrop-filter:blur(4px)}
.modal{position:relative;width:100%;max-width:420px;max-height:86vh;overflow-y:auto;background:linear-gradient(180deg,#1a2230,#111720);border:1px solid var(--line2);border-radius:22px;padding:20px}
.modal::-webkit-scrollbar{width:4px}
.modal::-webkit-scrollbar-thumb{background:#2a3441;border-radius:2px}
.modal-title{font-size:15px;font-weight:700;margin-bottom:14px;padding-right:36px}
.modal-close{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--dim);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
.row{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:11px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.045);margin-bottom:6px;font-size:12px}
.row b{margin-left:auto;font-weight:700}
.row-label{color:var(--dim);font-size:11.5px}
.row.click{cursor:pointer}
.prog-row{margin-bottom:10px}
.prog-head{display:flex;align-items:center;font-size:11.5px;margin-bottom:4px}
.prog-head span{color:var(--dim)}
.prog-head b{margin-left:auto;font-weight:700}
.prog-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
.prog-bar>i{display:block;height:100%;border-radius:3px;transition:width .4s}
.act-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.act{padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.act.gold{border-color:rgba(240,183,47,.4);background:rgba(240,183,47,.1);color:var(--gold)}
.act.danger{border-color:rgba(248,81,73,.35)}
.act.wide{grid-column:1/-1}
.act:disabled{opacity:.35;cursor:not-allowed}
.section-label{font-size:10px;color:var(--dim);letter-spacing:1.8px;margin:16px 0 8px;text-transform:uppercase}
.empty-note{color:var(--dim);font-size:12px;text-align:center;padding:30px 0}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:94px;z-index:200;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:90vw}
.toast{padding:10px 18px;border-radius:12px;background:rgba(21,27,36,.98);border:1px solid var(--line2);font-size:12px;font-weight:600;backdrop-filter:blur(16px);box-shadow:0 8px 24px rgba(0,0,0,.55);animation:toastIn .3s,toastOut .3s ease 2.6s forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.9)}}
@keyframes toastOut{to{opacity:0;transform:translateY(16px) scale(.9)}}
.pop{position:fixed;font-size:15px;font-weight:800;color:var(--gold);pointer-events:none;z-index:300;text-shadow:0 2px 12px rgba(0,0,0,.9);animation:popUp 1.2s forwards}
@keyframes popUp{0%{opacity:0;transform:translate(-50%,0) scale(.5)}20%{opacity:1;transform:translate(-50%,-14px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:780px;z-index:60;display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(10,14,20,0),rgba(10,14,20,.97) 30%);backdrop-filter:blur(24px);border-top:1px solid rgba(255,255,255,.06)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border:0;background:transparent;color:var(--dim);font-family:inherit;font-size:10px;cursor:pointer;border-radius:12px;position:relative}
.tab i{font-style:normal;font-size:19px;line-height:1;transition:transform .3s}
.tab.on{color:var(--accent)}
.tab.on i{transform:scale(1.2) translateY(-2px)}
.fullscreen{position:fixed;inset:0;z-index:300;display:none;flex-direction:column;background:#050810}
.fullscreen.open{display:flex}
.fs-hud{display:flex;align-items:center;gap:6px;padding:12px;background:rgba(10,14,20,.92);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.06);z-index:10}
.fs-close{margin-left:auto;width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
.catch-world{flex:1;position:relative;overflow:hidden;background:linear-gradient(180deg,#1a2a3a 0%,#1e3a2a 40%,#0f1a12 100%);cursor:grab;touch-action:none}
.catch-world:active{cursor:grabbing}
.map-layer{position:absolute;top:0;left:0;width:200%;height:200%;transform-origin:0 0;will-change:transform}
.grass-layer{position:absolute;bottom:0;left:0;right:0;height:65%;background:linear-gradient(180deg,rgba(30,58,42,.85),rgba(15,26,18,.95));clip-path:polygon(0 15%,6% 8%,12% 18%,20% 10%,28% 22%,38% 12%,48% 20%,58% 8%,68% 18%,78% 10%,88% 20%,94% 12%,100% 18%,100% 100%,0 100%);pointer-events:none}
.sky-layer{position:absolute;top:0;left:0;right:0;height:45%;background:linear-gradient(180deg,rgba(88,166,255,.15),transparent);pointer-events:none}
.catch-bug{position:absolute;left:0;top:0;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;will-change:transform,opacity;padding:2px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
.catch-bug span{display:block;width:84%;text-align:center;line-height:1.05;font-weight:700;word-break:break-all;pointer-events:none}
.catch-bug.caught{animation:caughtAway .6s ease-out forwards}
@keyframes caughtAway{0%{opacity:1}50%{opacity:.8;transform:scale(1.3) rotate(10deg)}100%{opacity:0;transform:scale(0) translateY(-120px)}}
.catch-bug.escaping{animation:escapeAway .7s ease-in forwards}
@keyframes escapeAway{0%{opacity:1}100%{opacity:0;transform:translate(60px,-80px) scale(.5)}}
.catch-result{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.6);padding:14px 24px;border-radius:16px;background:rgba(10,14,20,.95);border:1px solid var(--line2);font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:all .35s;white-space:nowrap;z-index:20}
.catch-result.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.catch-result.good{border-color:rgba(63,185,80,.6);color:var(--green)}
.catch-result.bad{border-color:rgba(248,81,73,.6);color:var(--red)}
.catch-result.gold{border-color:rgba(240,183,47,.6);color:var(--gold)}
.catch-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:rgba(230,237,243,.45);font-size:12px;pointer-events:none;padding:0 20px;line-height:1.7}
.tool-fx{position:absolute;pointer-events:none;z-index:15;border-radius:50%;border:3px dashed rgba(88,166,255,.8);animation:netThrow .7s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes netThrow{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}40%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.4)}}
.tool-bar{display:flex;gap:6px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(10,14,20,.94);border-top:1px solid rgba(255,255,255,.06);overflow-x:auto}
.tool-bar::-webkit-scrollbar{display:none}
.tool-btn{flex:0 0 auto;min-width:80px;padding:10px 8px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text);font-family:inherit;cursor:pointer;text-align:center;position:relative}
.tool-btn.on{background:rgba(88,166,255,.2);border-color:var(--accent);color:var(--accent)}
.tool-btn.disabled{opacity:.35;cursor:not-allowed}
.tool-btn .tn{font-size:11px;font-weight:700;margin-bottom:2px}
.tool-btn .tc{font-size:9px;color:var(--dim)}
.tool-btn .tcount{position:absolute;top:4px;right:6px;font-size:9px;color:var(--gold);font-weight:700}
.water-canvas{flex:1;position:relative;overflow:hidden;background:linear-gradient(180deg,#0d2535 0%,#0a1a28 50%,#061018 100%)}
.water-fish{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;will-change:transform;padding:2px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
.water-fish span{display:block;width:84%;text-align:center;line-height:1.05;font-weight:700;word-break:break-all;pointer-events:none}
.water-fish.caught{animation:caughtAway .6s ease-out forwards}
.qte-overlay{position:fixed;inset:0;z-index:350;display:none;align-items:center;justify-content:center;background:rgba(4,6,9,.85);backdrop-filter:blur(8px)}
.qte-overlay.open{display:flex}
.qte-box{width:100%;max-width:400px;background:linear-gradient(180deg,#1a2230,#111720);border:1px solid var(--line2);border-radius:22px;padding:24px;text-align:center}
.qte-title{font-size:16px;font-weight:700;margin-bottom:8px}
.qte-sub{font-size:11.5px;color:var(--dim);margin-bottom:20px}
.qte-bar-wrap{position:relative;height:52px;border-radius:26px;background:rgba(255,255,255,.06);overflow:hidden;margin-bottom:20px;border:1px solid var(--line2)}
.qte-bar-target{position:absolute;top:0;height:100%;border-radius:26px;background:rgba(63,185,80,.5);border:2px solid rgba(63,185,80,.9)}
.qte-bar-pointer{position:absolute;top:0;width:4px;height:100%;background:var(--gold);border-radius:2px;box-shadow:0 0 16px rgba(240,183,47,.9);z-index:2}
.qte-bar-pointer.hit{background:var(--green)}
.qte-bar-pointer.miss{background:var(--red)}
.qte-actions button{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
.qte-actions button:disabled{opacity:.5}
.dex-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dex-cell{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.02);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:10.5px;color:#3a4757;position:relative}
.dex-cell.got{color:var(--text);border-color:rgba(255,255,255,.14);background:rgba(88,166,255,.05)}
.dex-cell .dc-dot{width:30px;height:30px;border-radius:50%;border:1.5px solid #2a3441;background:radial-gradient(circle at 34% 28%,#28333f,#12181f 72%);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.dex-cell.locked .dc-dot{filter:grayscale(1) brightness(.4);color:transparent}
.dex-cell .dc-star{position:absolute;top:5px;right:7px;font-size:9px;color:var(--gold);font-weight:700}
.log-list{display:flex;flex-direction:column;gap:4px;max-height:320px;overflow-y:auto}
.log-item{font-size:11px;color:var(--dim);padding:8px 11px;border-radius:9px;background:rgba(255,255,255,.025);border-left:2px solid #2a3441}
.log-item.good{border-left-color:var(--green);color:#b9e8c8}
.log-item.bad{border-left-color:var(--red);color:#f0b8b8}
.log-item.gold{border-left-color:var(--gold);color:#f3dca6}
.card{background:linear-gradient(180deg,rgba(28,36,48,.75),rgba(21,27,36,.88));border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.card-title{font-size:13px;font-weight:700;margin-bottom:10px}
.rank-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:8px;font-size:11px;font-weight:700}
.rank-prog{height:8px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden;margin:8px 0}
.rank-prog>i{display:block;height:100%;background:linear-gradient(90deg,#58a6ff,#f0b72f);border-radius:4px;transition:width .5s}
.arena-header{background:linear-gradient(135deg,rgba(88,166,255,.12),rgba(163,113,247,.08));border:1px solid var(--line2);border-radius:18px;padding:16px;margin-bottom:12px;text-align:center}
.arena-rank-icon{font-size:42px;line-height:1;margin-bottom:6px}
.arena-rank-name{font-size:18px;font-weight:800;letter-spacing:2px;margin-bottom:4px}
.arena-rank-pts{font-size:11px;color:var(--dim);margin-bottom:12px}
.arena-rank-desc{font-size:11.5px;color:#b1bac4;line-height:1.6}
.fighter-row{display:flex;gap:10px;margin-bottom:14px}
.fighter{flex:1;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.fighter.player{border-color:rgba(88,166,255,.4)}
.fighter.enemy{border-color:rgba(248,81,73,.4)}
.fighter.active{transform:translateY(-4px);box-shadow:0 12px 32px -8px rgba(240,183,47,.4)}
.fighter-circle{width:58px;height:58px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;text-align:center;line-height:1.1;padding:3px}
.fighter-name{font-size:13px;font-weight:700;margin-bottom:2px}
.fighter-sp{font-size:10px;color:var(--dim);margin-bottom:6px}
.fighter-hp{height:7px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:3px}
.fighter-hp>i{display:block;height:100%;border-radius:3px;transition:width .5s}
.fighter-hpt{font-size:10px;color:var(--dim)}
.vs-badge{display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:var(--dim);padding:0 4px}
.battle-log{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:14px;padding:12px;height:150px;overflow-y:auto;margin-bottom:14px;font-size:11.5px;line-height:1.9}
.battle-log div{color:var(--dim)}
.battle-log .hit{color:var(--red)}
.battle-log .heal{color:var(--green)}
.battle-log .crit{color:var(--gold);font-weight:700}
.battle-log .sys{color:var(--accent);font-weight:600}
.skill-bar{display:grid;grid-template-columns:1fr 1fr;gap:8px}

function bugAtk(b){const base=8+(SPECIES[b.sp]?SPECIES[b.sp].val:20)*0.04;return Math.round(base*(0.7+b.size*0.5)*(1+(b.fightLv-1)*0.12)*(b.mut?1.15:1)+b.atkBonus)}
function bugDef(b){const base=4+(SPECIES[b.sp]?SPECIES[b.sp].val:20)*0.02;return Math.round(base*(0.7+b.size*0.5)*(1+(b.fightLv-1)*0.1)+b.defBonus)}
function bugMaxHp(b){const base=80+(SPECIES[b.sp]?SPECIES[b.sp].val:20)*0.35;return Math.round(base*(0.85+b.size*0.3)*(1+(b.fightLv-1)*0.15)+b.hpBonus)}
function bugDiameter(b){const sp=SPECIES[b.sp];if(!sp)return 20;const ss=[0.62,0.78,0.92,1.0,1.08][b.stage]||0.9;const ms=b.mut==='giant'?1.28:1;return Math.round(sp.r*(0.72+b.size*0.5)*ss*ms*2)}
function fishDiameter(f){const sp=FISH[f.sp];if(!sp)return 18;const ss=[0.55,0.72,0.88,1.0][f.stage]||0.9;const ms=f.mut==='giant'?1.3:1;return Math.round(sp.r*(0.72+f.size*0.5)*ss*ms*2)}
function bugColor(b){if(b.mut&&MUTS[b.mut])return MUTS[b.mut].c;if(b.mature)return RARITY[b.q].c;return '#7d8590'}
function fishColor(f){if(f.mut&&MUTS[f.mut])return MUTS[f.mut].c;if(f.mature)return RARITY[f.q].c;return '#7d8590'}

function priceOf(b){
if(!b.mature)return 0;
const sp=b.type==='fish'?FISH[b.sp]:SPECIES[b.sp];
if(!sp)return 0;
const q=RARITY[b.q];
const mm=b.mut&&MUTS[b.mut]?MUTS[b.mut].m:1;
return Math.max(1,Math.round(sp.val*q.m*mm*(0.75+b.size*0.45)*(0.62+(b.hp/100)*0.38)*diff().priceMul));
}
function buyCost(sp){return Math.max(4,Math.round(sp.val*0.30))}
function calcTemp(t){let v=t.temp+SEASONS[G.season].t+WEATHERS[G.weather].t+(SUBS[t.substrate]?SUBS[t.substrate].t:0);if(t.upgrades.heater&&v<22)v+=(22-v)*0.75;return v}
function calcHum(t){let v=t.hum+SEASONS[G.season].h+WEATHERS[G.weather].h+(SUBS[t.substrate]?SUBS[t.substrate].h:0);if(t.upgrades.humid&&v<62)v+=(62-v)*0.7;if(t.upgrades.water)v+=4;return clamp(v,15,98)}
function envFactor(sp,temp,hum){let f=1;if(temp<sp.tmin)f*=Math.max(0.3,1-(sp.tmin-temp)*0.07);if(temp>sp.tmax)f*=Math.max(0.3,1-(temp-sp.tmax)*0.07);if(hum<sp.hmin)f*=Math.max(0.35,1-(sp.hmin-hum)*0.018);if(hum>sp.hmax)f*=Math.max(0.35,1-(hum-sp.hmax)*0.018);return f}

function toast(msg,color){const d=document.createElement('div');d.className='toast';d.textContent=msg;if(color)d.style.color=color;document.getElementById('toasts').appendChild(d);setTimeout(()=>d.remove(),2900);const box=document.getElementById('toasts');while(box.children.length>3)box.firstChild.remove()}
function log(msg,type){G.log.push({m:msg,t:type||''});if(G.log.length>200)G.log.shift()}
function popAt(el,text){const r=el.getBoundingClientRect();const d=document.createElement('div');d.className='pop';d.textContent=text;d.style.left=(r.left+r.width/2)+'px';d.style.top=(r.top+10)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1250)}

function findAnyBug(pred){for(const t of G.tanks){for(const b of t.bugs)if(pred(b))return b}for(const t of G.waterTanks){for(const f of t.fish)if(pred(f))return f}return null}

function timeStr(s){if(s<60)return Math.floor(s)+'秒';if(s<3600)return Math.floor(s/60)+'分钟';return (s/3600).toFixed(1)+'小时'}

const dt={net:5,superNet:1,net2:1,trap:2,bait:3,lure:2,bomb:1,flash:2,honey:1,sonar:1,fishingRod:1,fishNet:2,fishTrap:1,chum:1,light:1,netBig:1};
if(!G.tools)G.tools=dt;else Object.keys(dt).forEach(k=>{if(G.tools[k]===undefined)G.tools[k]=dt[k]});
const ds={sold:0,earned:0,bred:0,mutated:0,cured:0,caught:0,fishCaught:0,fights:0,wins:0,losses:0,contests:0,orders:0,clones:0,daysPlayed:0,arenaPts:0,arenaPeak:0,arenaStreak:0,arenaBestStreak:0};

function rollMarket(){Object.keys(SPECIES).forEach(k=>{G.market[k]=rand(0.72,1.34)});Object.keys(FISH).forEach(k=>{G.market[k]=rand(0.72,1.34)})}
function genOrders(){G.orders=[];const keys=Object.keys(SPECIES).concat(Object.keys(FISH));for(let i=0;i<3;i++){const sp=keys[(Math.random()*keys.length)|0];const q=Math.min(RARITY.length-1,(Math.random()*3)|0);const val=(SPECIES[sp]?SPECIES[sp].val:FISH[sp]?FISH[sp].val:20);G.orders.push({id:G.nextId++,sp:sp,q:q,reward:Math.round(val*(1.4+q*0.85))})}}
function rollWeather(){let r=Math.random()*100,acc=0,nw=0;for(let i=0;i<WEATHERS.length;i++){acc+=WEATHERS[i].w;if(r<acc){nw=i;break}}if(nw!==G.weather){G.weather=nw}}
function addDex(spId,q){if(!G.dex[spId])G.dex[spId]={count:0,best:0};G.dex[spId].count++;if(q>G.dex[spId].best)G.dex[spId].best=q}
function checkAch(){const s=G.stats;function u(k){if(G.ach[k])return;G.ach[k]=1;const a=ACHS.find(x=>x.k===k);if(a){G.coins+=a.r;toast('🏆 '+a.n+' +'+a.r+'🪙','#f0b72f');sfxLevel()}}
if(s.sold>=1)u('first');if(s.caught>=1)u('hunter');if(s.fishCaught>=1)u('fisher');if(s.caught>=30)u('master');if(s.fishCaught>=20)u('angler');if(s.sold>=10)u('ten');if(s.sold>=100)u('hundred');if(s.mutated>=1)u('mut');if(G.coins>=10000)u('rich');
const ai=rankIndex(s.arenaPts||0);if(ai>=2)u('gold');if(ai>=4)u('diamond');if(ai>=7)u('war')}

/* ================= 更新循环 ================= */
function update(dt){
G.food=Math.min(foodCap(),G.food+0.16*dt*(1+G.level*0.05));
G.weatherTimer-=dt;if(G.weatherTimer<=0){G.weatherTimer=100+Math.random()*140;rollWeather()}
G.eventTimer-=dt;if(G.eventTimer<=0){G.eventTimer=55+Math.random()*95;randomEvent()}
G.seasonTimer+=dt;if(G.seasonTimer>1400){G.seasonTimer=0;G.season=(G.season+1)%4}
G.dayTimer+=dt;if(G.dayTimer>160){G.dayTimer=0;G.day++;G.stats.daysPlayed=(G.stats.daysPlayed||0)+1;rollMarket();genOrders()}

G.tanks.forEach(tank=>{
tank.cleanliness=Math.max(0,tank.cleanliness-(0.04+tank.bugs.length*0.012)*dt*(tank.upgrades.bowl?0.7:1));
if(tank.upgrades.autoClean)tank.cleanliness=Math.min(100,tank.cleanliness+0.06*dt);
if(tank.upgrades.autoFeed&&G.food<foodCap()*0.4)G.food=Math.min(foodCap(),G.food+2.4*dt);
const temp=calcTemp(tank),hum=calcHum(tank);
tank.bugs.forEach(b=>{
if(!b.alive)return;
const sp=SPECIES[b.sp];if(!sp)return;
if(!b.mature){
const env=envFactor(sp,temp,hum);
const rate=(100/sp.time)*b.genes.speed*env*(0.85+(tank.light||0.5)*0.3)*diff().growMul;
b.growth=Math.min(100,b.growth+rate*dt*(0.5+0.5*b.hp/100)*(b.genes.hardiness||1)*0.85);
if(b.growth>=100){b.growth=100;b.mature=true;b.stage=sp.st.length-1;b.flashUntil=Date.now()+1000;toast(sp.n+' 成熟了','#f0b72f');sfxMature()}
else b.stage=stageOf(sp,b.growth/100);
}
const need=sp.hun*dt*b.genes.appetite;
if(G.food>=need){G.food-=need;b.hunger=Math.min(100,b.hunger+14*dt)}else b.hunger=Math.max(0,b.hunger-6*dt);
let hp=0.22;
if(b.hunger<25)hp-=0.4;
if(temp<sp.tmin-4||temp>sp.tmax+4)hp-=0.28;
if(hum<sp.hmin-12||hum>sp.hmax+12)hp-=0.18;
if(tank.cleanliness<35)hp-=0.2;
if(b.disease)hp-=0.9;if(b.parasite)hp-=0.55;if(b.symbiont)hp+=0.5;
if(tank.upgrades.hide)hp+=0.12;
hp*=diff().deathMul;
b.hp=clamp(b.hp+hp*dt,0,100);
let mood=0;
if(b.hunger>55)mood+=0.45;else mood-=0.9;
if(tank.cleanliness<45)mood-=0.5;
if(tank.upgrades.hide)mood+=0.25;
b.mood=clamp(b.mood+mood*dt,0,100);
if(tank.cleanliness<28&&!b.disease&&Math.random()<dt*0.005)b.disease='霉病';
if(tank.cleanliness<20&&!b.parasite&&Math.random()<dt*0.003)b.parasite='螨虫';
b.age+=dt;
if(b.hp<=0){b.alive=false;b.mature=false;toast(b.name+' 死亡','#f85149')}
b.wander-=dt;
if(b.wander<=0){
b.wander=0.9+Math.random()*2.6;
if(Math.random()<0.3){b.vx=0;b.vy=0}
else{const base=(0.05+b.size*0.03)*(0.5+b.mood/160);const ang=Math.random()*Math.PI*2;b.vx=Math.cos(ang)*base;b.vy=Math.sin(ang)*base*1.35}
}
b.x+=b.vx*dt;b.y+=b.vy*dt;
if(b.x<0){b.x=0;b.vx=Math.abs(b.vx)}

});

function updateCatch(dt){
if(!catchGame.active)return;
catchGame.timeLeft-=dt;
if(catchGame.timeLeft<=0){closeCatch();return}
document.getElementById('catchTime').textContent=Math.ceil(catchGame.timeLeft);

catchGame.spawnTimer-=dt;
if(catchGame.spawnTimer<=0){catchGame.spawnTimer=rand(1.8,3.2);if(catchGame.bugs.length<8)spawnCatchBug()}
catchGame.bugs.forEach(b=>{
if(b.frozen>0){b.frozen-=dt;return}
if(b.noEscape>0)b.noEscape-=dt;
b.x+=b.vx*dt;b.y+=b.vy*dt;
if(b.x<0.05||b.x>0.95){b.vx*=-1;b.x=clamp(b.x,0.05,0.95)}
if(b.y<0.15||b.y>0.9){b.vy*=-1;b.y=clamp(b.y,0.15,0.9)}
if(Math.random()<dt*0.4)b.vx=clamp(b.vx+rand(-0.02,0.02),-0.08,0.08);
b.life-=dt;
if(b.life<=0&&b._el){b._el.classList.add('escaping');setTimeout(()=>{if(b._el&&b._el.parentElement)b._el.remove()},700);b.dead=true}
if(b._el&&!b.dead){
const map=document.getElementById('catchMap');
const w=map.clientWidth,h=map.clientHeight;
const size=parseFloat(b._el.style.width)||30;
b._el.style.transform='translate3d('+(b.x*(w-size))+'px,'+(b.y*(h-size))+'px,0) scale('+(0.85+b.depth*0.4)+')';
b._el.style.zIndex=Math.round(b.depth*100);
}
});
catchGame.bugs=catchGame.bugs.filter(b=>!b.dead);
}
function tryCatch(b){
if(!catchGame.active||b.dead||b.frozen>0)return;
const sp=SPECIES[b.sp];if(!sp)return;
const mul=diff().catchMul;
let base=sp.catchR*mul;
if(catchGame.tool==='net')base+=0.35;
if(catchGame.tool==='superNet')base+=0.6;
if(catchGame.tool==='bait')base+=0.15;
base-=(1-b.depth)*0.12;
base=clamp(base,0.05,0.95);
const roll=Math.random();
const map=document.getElementById('catchMap');
const fx=document.createElement('div');fx.className='tool-fx';
fx.style.cssText='position:absolute;left:'+(b.x*100)+'%;top:'+(b.y*100)+'%;width:80px;height:80px;pointer-events:none;z-index:50';
map.appendChild(fx);setTimeout(()=>fx.remove(),700);
if(roll<base){
const q=b._q!==undefined?b._q:rollQuality();
catchGame.caught.push({sp:b.sp,q:q,size:0.85+Math.random()*0.3});
G.stats.caught++;sfxCatch();
showCatchResult('+1 '+sp.n,'good');
if(b._el){b._el.classList.add('caught');setTimeout(()=>{if(b._el&&b._el.parentElement)b._el.remove()},600)}
b.dead=true;
if(catchGame.tool==='net'){G.tools.net=Math.max(0,(G.tools.net||0)-1);renderCatchTools()}
if(catchGame.tool==='superNet'){G.tools.superNet=Math.max(0,(G.tools.superNet||0)-1);renderCatchTools()}
if(catchGame.tool==='net2'){
const b2=catchGame.bugs.find(x=>x!==b&&!x.dead);
if(b2){
const q2=b2._q!==undefined?b2._q:rollQuality();
catchGame.caught.push({sp:b2.sp,q:q2,size:0.85+Math.random()*0.3});
G.stats.caught++;b2.dead=true;
if(b2._el){b2._el.classList.add('caught');setTimeout(()=>{if(b2._el&&b2._el.parentElement)b2._el.remove()},600)}
}
G.tools.net2=Math.max(0,(G.tools.net2||0)-1);renderCatchTools();
}
}else{
b.alert+=1;sfxMiss();
showCatchResult('跑掉了...','bad');
if(b._el){b._el.classList.add('alerted');setTimeout(()=>{if(b._el)b._el.classList.remove('alerted')},350)}

if(b._el){b._el.classList.add('escaping');setTimeout(()=>{if(b._el&&b._el.parentElement)b._el.remove()},700)}
b.dead=true;
}
}
}

function applyMapTransform(){const map=document.getElementById('catchMap');if(!map)return;map.style.transform='translate('+catchGame.offsetX+'px,'+catchGame.offsetY+'px) scale('+catchGame.scale+')'}
function initMapDrag(){
const world=document.getElementById('catchWorld');
if(!world||world._drag)return;world._drag=true;
let isDragging=false,lastX=0,lastY=0,initialDist=0,initialScale=1;
world.addEventListener('touchstart',function(e){
if(e.touches.length===1){isDragging=true;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY}
else if(e.touches.length===2){isDragging=false;initialDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);initialScale=catchGame.scale}
},{passive:true});
world.addEventListener('touchmove',function(e){
if(e.touches.length===1&&isDragging){
const dx=e.touches[0].clientX-lastX,dy=e.touches[0].clientY-lastY;
catchGame.offsetX+=dx;catchGame.offsetY+=dy;
lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;
applyMapTransform();
}else if(e.touches.length===2){
e.preventDefault();
const dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
catchGame.scale=clamp(initialScale*(dist/initialDist),0.5,2.5);applyMapTransform();
}
},{passive:false});
world.addEventListener('touchend',function(){isDragging=false},{passive:true});
world.addEventListener('mousedown',function(e){isDragging=true;lastX=e.clientX;lastY=e.clientY});
world.addEventListener('mousemove',function(e){if(!isDragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;catchGame.offsetX+=dx;catchGame.offsetY+=dy;lastX=e.clientX;lastY=e.clientY;applyMapTransform()});
world.addEventListener('mouseup',function(){isDragging=false});
world.addEventListener('mouseleave',function(){isDragging=false});
world.addEventListener('wheel',function(e){e.preventDefault();catchGame.scale=clamp(catchGame.scale*(e.deltaY>0?0.9:1.1),0.5,2.5);applyMapTransform()},{passive:false});
}

document.getElementById('waterArea').classList.add('open');
document.getElementById('waterHint').style.display='block';
renderWaterTools();
for(let i=0;i<5;i++)spawnWaterFish();
}
function closeWaterArea(){
waterGame.active=false;
document.getElementById('waterArea').classList.remove('open');
if(waterGame.caught.length)showWaterSummary();else toast('什么都没抓到','#7d8590');
render();
}
function spawnWaterFish(forceTier){
const pool={easy:[0,0,0,1],normal:[0,0,1,1,2],hard:[0,1,1,2,2]}[G.difficulty]||[0,0,1];
const tier=forceTier!==undefined?forceTier:pool[(Math.random()*pool.length)|0];
const zone=WATER_ZONES[tier]||WATER_ZONES[0];
const spId=zone.fp[(Math.random()*zone.fp.length)|0];
const sp=FISH[spId];if(!sp)return;
const depth=rand(0.2,0.9);const x=rand(0.1,0.9);const y=0.15+depth*0.75;
const f={id:G.nextId++,sp:spId,x:x,y:y,depth:depth,size:0.4+depth*0.9,vx:(Math.random()<0.5?-1:1)*rand(0.015,0.04),vy:rand(-0.01,0.01),life:rand(15,28),frozen:0};
waterGame.fish.push(f);renderWaterFish(f);
}
function renderWaterFish(f){
const canvas=document.getElementById('waterCanvas');
const sp=FISH[f.sp];if(!sp)return;
const q=rollQuality();const col=RARITY[q].c;
const el=document.createElement('div');el.className='water-fish';el.dataset.fishId=f.id;
const baseSize=sp.r*2*f.size;
el.style.width=baseSize+'px';el.style.height=baseSize+'px';
el.style.borderColor=col;
el.style.background='radial-gradient(circle at 34% 28%,'+rgba(col,.4)+',#0a1a28 72%)';
el.style.boxShadow='0 4px 12px rgba(0,0,0,.6),0 0 16px '+rgba(col,.35);
el.innerHTML='<span style="font-size:'+Math.max(7,Math.min(12,baseSize*0.32))+'px;color:'+col+'">'+sp.n+'</span>';
el.onclick=function(ev){ev.stopPropagation();tryCatchFish(f)};
canvas.appendChild(el);
f._el=el;f._q=q;
}
function updateWater(dt){
if(!waterGame.active)return;
waterGame.timeLeft-=dt;
if(waterGame.timeLeft<=0){closeWaterArea();return}
document.getElementById('waterTime').textContent=Math.ceil(waterGame.timeLeft);
document.getElementById('waterCount').textContent=waterGame.caught.length;
waterGame.spawnTimer-=dt;
if(waterGame.spawnTimer<=0){waterGame.spawnTimer=rand(1.8,3.5);if(waterGame.fish.length<10)spawnWaterFish()}
waterGame.fish.forEach(f=>{
if(f.frozen>0){f.frozen-=dt;return}
f.x+=f.vx*dt;f.y+=f.vy*dt;
if(f.x<0.05||f.x>0.95){f.vx*=-1;f.x=clamp(f.x,0.05,0.95)}
if(f.y<0.1||f.y>0.9){f.vy*=-1;f.y=clamp(f.y,0.1,0.9)}
if(Math.random()<dt*0.3)f.vx=clamp(f.vx+rand(-0.01,0.01),-0.06,0.06);
f.life-=dt;
if(f.life<=0&&f._el){f._el.remove();f.dead=true}
if(f._el&&!f.dead){
const canvas=document.getElementById('waterCanvas');
const w=canvas.clientWidth,h=canvas.clientHeight;
const size=parseFloat(f._el.style.width)||30;
f._el.style.transform='translate3d('+(f.x*(w-size))+'px,'+(f.y*(h-size))+'px,0) scale('+(0.85+f.depth*0.4)+')';
f._el.style.zIndex=Math.round(f.depth*100);
}
});
waterGame.fish=waterGame.fish.filter(f=>!f.dead);
}
function tryCatchFish(f){
if(!waterGame.active||f.dead)return;
if(waterGame.tool==='rod'){startQTE(f);return}
const sp=FISH[f.sp];if(!sp)return;
const mul=diff().catchMul;
let base=0.35*mul;
if(waterGame.tool==='fishNet')base+=0.4;
base=clamp(base,0.05,0.95);
if(Math.random()<base){
const q=f._q!==undefined?f._q:rollQuality();
waterGame.caught.push({sp:f.sp,q:q,size:0.85+Math.random()*0.3});
G.stats.fishCaught++;sfxCatch();
showWaterResult('+1 '+sp.n,'good');
if(f._el){f._el.classList.add('caught');setTimeout(()=>{if(f._el&&f._el.parentElement)f._el.remove()},600)}
f.dead=true;
if(waterGame.tool==='fishNet'){G.tools.fishNet=Math.max(0,(G.tools.fishNet||0)-1);renderWaterTools()}
}else{showWaterResult('跑掉了...','bad');sfxMiss()}
}
function showWaterResult(text,type){const r=document.getElementById('waterResult');r.textContent=text;r.className='catch-result show '+type;clearTimeout(waterGame.resultTimer);waterGame.resultTimer=setTimeout(()=>r.classList.remove('show'),900)}
function renderWaterTools(){
const bar=document.getElementById('waterTools');bar.innerHTML='';
Object.keys(WATER_TOOLS).forEach(k=>{
const t=WATER_TOOLS[k];const count=G.tools[k]||0;
const btn=document.createElement('button');
btn.className='tool-btn'+(waterGame.tool===k?' on':'')+((count<=0&&k!=='rod')?' disabled':'');
btn.innerHTML='<div class="tn">'+t.icon+' '+t.n+'</div><div class="tc">'+t.desc+'</div><div class="tcount">×'+(k==='rod'?'∞':count)+'</div>';
btn.onclick=function(){
if(count<=0&&k!=='rod'){toast(t.n+' 用完了','#f85149');return}
waterGame.tool=k;sfxTool();renderWaterTools();applyWaterTool(k);
};
bar.appendChild(btn);
});
}
function applyWaterTool(k){
if(k==='lure'){G.tools.lure=Math.max(0,(G.tools.lure||0)-1);for(let i=0;i<3;i++)spawnWaterFish(pick([1,2,2]));toast('鱼饵生效','#f0b72f');renderWaterTools()}
if(k==='fishTrap'){
G.tools.fishTrap=Math.max(0,(G.tools.fishTrap||0)-1);
setTimeout(()=>{
const alive=waterGame.fish.filter(f=>!f.dead);
const n=Math.min(2,alive.length);
for(let i=0;i<n;i++){
const f=alive[i];
const q=f._q!==undefined?f._q:rollQuality();
waterGame.caught.push({sp:f.sp,q:q,size:0.85+Math.random()*0.3});
G.stats.fishCaught++;f.dead=true;
if(f._el){f._el.classList.add('caught');setTimeout(()=>{if(f._el&&f._el.parentElement)f._el.remove()},600)}
}
sfxCatch();showWaterResult('地笼捕获 '+n+' 条','gold');renderWaterTools();
},1500);
}
if(k==='chum'){G.tools.chum=Math.max(0,(G.tools.chum||0)-1);waterGame.fish.forEach(f=>{f.vx*=1.5});toast('打窝料','#3fb950');renderWaterTools()}
if(k==='light'){G.tools.light=Math.max(0,(G.tools.light||0)-1);toast('水中灯','#58a6ff');renderWaterTools()}
if(k==='netBig'){
G.tools.netBig=Math.max(0,(G.tools.netBig||0)-1);
const alive=waterGame.fish.filter(f=>!f.dead);
const n=Math.min(2,alive.length);
for(let i=0;i<n;i++){
const f=alive[i];
const q=f._q!==undefined?f._q:rollQuality();
waterGame.caught.push({sp:f.sp,q:q,size:0.85+Math.random()*0.3});
G.stats.fishCaught++;f.dead=true;
if(f._el){f._el.classList.add('caught');setTimeout(()=>{if(f._el&&f._el.parentElement)f._el.remove()},600)}
}
sfxCatch();showWaterResult('大抄网捕获 '+n+' 条','gold');renderWaterTools();
}
}

/* ================= QTE ================= */
let qteState=null;
function startQTE(fish){
const sp=FISH[fish.sp];if(!sp)return;
const diffMul=diff().qteMul;
const targetWidth=clamp(32*diffMul,10,50);
const targetPos=rand(5,95-targetWidth);
qteState={fish:fish,pointerPos:0,direction:1,speed:rand(1.1,2.0)/diffMul,targetPos:targetPos,targetWidth:targetWidth,active:true};
document.getElementById('qteOverlay').classList.add('open');
document.getElementById('qteTitle').textContent='🎣 '+sp.n+' 咬钩了！';
document.getElementById('qteTarget').style.left=targetPos+'%';
document.getElementById('qteTarget').style.width=targetWidth+'%';
document.getElementById('qtePointer').style.left='0%';
document.getElementById('qtePointer').className='qte-bar-pointer';
document.getElementById('qteBtn').disabled=false;
}
function updateQTE(dt){
if(!qteState||!qteState.active)return;
qteState.pointerPos+=qteState.direction*qteState.speed*dt*100;
if(qteState.pointerPos>=100){qteState.pointerPos=100;qteState.direction=-1}
if(qteState.pointerPos<=0){qteState.pointerPos=0;qteState.direction=1}
document.getElementById('qtePointer').style.left=qteState.pointerPos+'%';
}
function qteClick(){
if(!qteState||!qteState.active)return;
qteState.active=false;
const inTarget=qteState.pointerPos>=qteState.targetPos&&qteState.pointerPos<=qteState.targetPos+qteState.targetWidth;
const pointer=document.getElementById('qtePointer');
pointer.className='qte-bar-pointer '+(inTarget?'hit':'miss');
document.getElementById('qteBtn').disabled=true;
if(inTarget){
sfxQteHit();
const sp=FISH[qteState.fish.sp];
showWaterResult('🎣 成功！+1 '+sp.n,'good');
const q=qteState.fish._q!==undefined?qteState.fish._q:rollQuality();
waterGame.caught.push({sp:qteState.fish.sp,q:q,size:0.85+Math.random()*0.3});
G.stats.fishCaught++;
if(qteState.fish._el){qteState.fish._el.classList.add('caught');setTimeout(()=>{if(qteState.fish._el&&qteState.fish._el.parentElement)qteState.fish._el.remove()},600)}
qteState.fish.dead=true;
}else{
sfxQteMiss();
showWaterResult('鱼跑掉了...','bad');
}
setTimeout(()=>{document.getElementById('qteOverlay').classList.remove('open');qteState=null},900);
}

const grouped={};catchGame.caught.forEach(c=>{if(!grouped[c.sp])grouped[c.sp]=[];grouped[c.sp].push(c)});
Object.keys(grouped).forEach(spId=>{
const sp=SPECIES[spId];if(!sp)return;
const list=grouped[spId];const bestQ=Math.max.apply(null,list.map(c=>c.q));const col=RARITY[bestQ].c;
html+='<div class="summary-row"><div class="sr-dot" style="background:'+rgba(col,.3)+';border:1.5px solid '+col+';color:'+col+'">'+sp.n.slice(0,1)+'</div><div><div class="sr-name">'+sp.n+' ×'+list.length+'</div><div class="sr-sub">最佳品相 '+RARITY[bestQ].n+'</div></div></div>';

function getArenaPts(){return G.stats.arenaPts||0}
function addArenaPts(delta){
const before=rankOf(getArenaPts());
G.stats.arenaPts=Math.max(0,(G.stats.arenaPts||0)+delta);
if(G.stats.arenaPts>G.stats.arenaPeak)G.stats.arenaPeak=G.stats.arenaPts;
const after=rankOf(G.stats.arenaPts);
if(after.key!==before.key){
if(rankIndex(G.stats.arenaPts)>rankIndex(before.min)){
showRankUp(after);sfxRankUp();checkAch();
}else{
sfxRankDown();toast('段位下降 · '+after.n,'#f85149');
}
}
return after;
}

function startBattle(p,e){
battle={player:p,enemy:e,playerHp:bugMaxHp(p),enemyHp:bugMaxHp(e),
playerMaxHp:bugMaxHp(p),enemyMaxHp:bugMaxHp(e),
playerCd:{},enemyCd:{},playerBuff:{},enemyBuff:{},
turn:1,log:[],over:false,animating:false,
playerStun:0,enemyStun:0};
p.skills.forEach(s=>battle.playerCd[s]=0);
e.skills.forEach(s=>battle.enemyCd[s]=0);
addBattleLog('sys','⚔️ 战斗开始！');
renderArena();
}
function addBattleLog(t,m){battle.log.push({t:t,m:m});if(battle.log.length>60)battle.log.shift()}
function calcSkillDamage(a,d,sk,def){
let atk=bugAtk(a),dfs=bugDef(d);
if(a===battle.player&&battle.playerBuff.atkDown>0)atk*=0.7;
if(a===battle.enemy&&battle.enemyBuff.atkDown>0)atk*=0.7;
if(d===battle.player&&battle.playerBuff.defUp>0)dfs*=1.4;
if(d===battle.enemy&&battle.enemyBuff.defUp>0)dfs*=1.4;
if(def)dfs*=1.5;
const base=Math.max(2,atk*sk.dmg-dfs*0.5);
return Math.round(base*(0.85+Math.random()*0.3));
}
function playerUseSkill(skId){
if(!battle||battle.over||battle.animating)return;
if(battle.playerStun>0){addBattleLog('sys','你被震慑了！');battle.playerStun--;battle.animating=false;setTimeout(()=>{tickBuffs();renderArena()},500);return}
const sk=SKILLS[skId];if(!sk||battle.playerCd[skId]>0)return;
battle.playerCd[skId]=sk.cd;battle.animating=true;
if(sk.type==='buff'){battle.playerBuff.defUp=2;addBattleLog('sys','你使用了 '+sk.n);sfxClick();battle.animating=false;setTimeout(()=>{tickBuffs();enemyTurn();renderArena()},500);return}
if(sk.type==='debuff'){if(Math.random()<0.7){battle.enemyBuff.stun=2;addBattleLog('sys','你使用了 '+sk.n+'，对手被震慑')}else addBattleLog('sys','你使用了 '+sk.n+'，对手抵抗');sfxClick();battle.animating=false;setTimeout(()=>{tickBuffs();enemyTurn();renderArena()},500);return}
const dodged=Math.random()*100<(battle.enemyBuff.dodgeUp>0?25:8);
if(dodged){addBattleLog('sys','对手闪避！');battle.animating=false;setTimeout(()=>{tickBuffs();enemyTurn();renderArena()},500);return}
const dmg=calcSkillDamage(battle.player,battle.enemy,sk,battle.enemyDefending);
if(sk.type==='multi'){let t=0;for(let i=0;i<sk.hits;i++)t+=Math.max(1,Math.round(dmg*(0.8+Math.random()*0.4)));battle.enemyHp=Math.max(0,battle.enemyHp-t);addBattleLog('hit','你使用 '+sk.n+'，造成 '+t+' 伤害');sfxHit()}
else if(sk.type==='drain'){const h=Math.round(dmg*0.5);battle.enemyHp=Math.max(0,battle.enemyHp-dmg);battle.playerHp=Math.min(battle.playerMaxHp,battle.playerHp+h);addBattleLog('heal','你使用 '+sk.n+'，造成 '+dmg+' 回复 '+h);sfxHit()}
else if(sk.type==='dot'){battle.enemyHp=Math.max(0,battle.enemyHp-dmg);battle.enemyBuff.poison=3;addBattleLog('hit','你使用 '+sk.n+'，造成 '+dmg+' 中毒');sfxHit()}
else{const c=Math.random()<0.12;const f=c?Math.round(dmg*1.8):dmg;battle.enemyHp=Math.max(0,battle.enemyHp-f);if(c){addBattleLog('crit','💥 暴击！'+f+' 伤害');sfxCrit()}else{addBattleLog('hit','你使用 '+sk.n+'，造成 '+f+' 伤害');sfxHit()}}
battle.animating=false;checkBattleEnd();
if(!battle.over)setTimeout(()=>{tickBuffs();enemyTurn();renderArena()},550);
renderArena();
}
function enemyTurn(){
if(!battle||battle.over)return;
if(battle.enemyStun>0){addBattleLog('sys','对手被震慑！');battle.enemyStun--;battle.animating=false;renderArena();return}
const av=battle.enemy.skills.filter(s=>battle.enemyCd[s]<=0);
const skId=av.length?pick(av):pick(battle.enemy.skills);
const sk=SKILLS[skId];if(!sk){battle.animating=false;return}
battle.enemyCd[skId]=sk.cd;battle.animating=true;
if(sk.type==='buff'){battle.enemyBuff.defUp=2;addBattleLog('sys','对手使用了 '+sk.n);battle.animating=false;setTimeout(()=>{tickBuffs();renderArena()},500);return}
if(sk.type==='debuff'){if(Math.random()<0.7){battle.playerBuff.stun=2;addBattleLog('sys','对手使用 '+sk.n+'，你被震慑')}else addBattleLog('sys','对手使用 '+sk.n+'，你抵抗');battle.animating=false;setTimeout(()=>{tickBuffs();renderArena()},500);return}
const dodged=Math.random()*100<(battle.playerBuff.dodgeUp>0?25:8);
if(dodged){addBattleLog('sys','你闪避了攻击！');battle.animating=false;setTimeout(()=>{tickBuffs();renderArena()},500);return}
const dmg=calcSkillDamage(battle.enemy,battle.player,sk,battle.playerDefending);
if(sk.type==='multi'){let t=0;for(let i=0;i<sk.hits;i++)t+=Math.max(1,Math.round(dmg*(0.8+Math.random()*0.4)));battle.playerHp=Math.max(0,battle.playerHp-t);addBattleLog('hit','对手使用 '+sk.n+'，造成 '+t+' 伤害');sfxHit()}
else if(sk.type==='drain'){const h=Math.round(dmg*0.5);battle.playerHp=Math.max(0,battle.playerHp-dmg);battle.enemyHp=Math.min(battle.enemyMaxHp,battle.enemyHp+h);addBattleLog('heal','对手使用 '+sk.n+'，造成 '+dmg+' 回复 '+h);sfxHit()}
else if(sk.type==='dot'){battle.playerHp=Math.max(0,battle.playerHp-dmg);battle.playerBuff.poison=3;addBattleLog('hit','对手使用 '+sk.n+'，造成 '+dmg+' 中毒');sfxHit()}
else{const c=Math.random()<0.12;const f=c?Math.round(dmg*1.8):dmg;battle.playerHp=Math.max(0,battle.playerHp-f);if(c){addBattleLog('crit','💥 对手暴击！'+f+' 伤害');sfxCrit()}else{addBattleLog('hit','对手使用 '+sk.n+'，造成 '+f+' 伤害');sfxHit()}}
battle.animating=false;checkBattleEnd();renderArena();
}
function tickBuffs(){
if(!battle)return;
['defUp','dodgeUp','atkDown','blind','stun','poison'].forEach(k=>{
if(battle.playerBuff[k]>0)battle.playerBuff[k]--;
if(battle.enemyBuff[k]>0)battle.enemyBuff[k]--;
});
if(battle.playerBuff.poison>0){battle.playerHp=Math.max(0,battle.playerHp-3);addBattleLog('hit','你中毒 -3')}
if(battle.enemyBuff.poison>0){battle.enemyHp=Math.max(0,battle.enemyHp-3);addBattleLog('hit','对手中毒 -3')}
battle.player.skills.forEach(s=>{if(battle.playerCd[s]>0)battle.playerCd[s]--});
battle.enemy.skills.forEach(s=>{if(battle.enemyCd[s]>0)battle.enemyCd[s]--});
battle.playerStun=battle.playerBuff.stun||0;
battle.enemyStun=battle.enemyBuff.stun||0;
battle.playerDefending=battle.playerBuff.defUp>0;
battle.enemyDefending=battle.enemyBuff.defUp>0;
battle.turn++;
checkBattleEnd();
}
function checkBattleEnd(){
if(!battle||battle.over)return;
if(battle.enemyHp<=0){
battle.over=true;
const p=battle.player;
p.wins=(p.wins||0)+1;p.fightExp=(p.fightExp||0)+25;
G.stats.fights++;G.stats.wins++;
G.stats.arenaStreak=(G.stats.arenaStreak||0)+1;
if(G.stats.arenaStreak>G.stats.arenaBestStreak)G.stats.arenaBestStreak=G.stats.arenaStreak;
const reward=Math.round(80+bugAtk(battle.enemy)*9);
G.coins+=reward;
const rk=rankOf(getArenaPts());
const bonus=Math.min(10,G.stats.arenaStreak*2);
const gain=rk.win+bonus;
addArenaPts(gain);
addBattleLog('sys','🏆 你赢了！+'+reward+'🪙 · 段位+'+gain);
sfxWin();checkFightLevel(p);checkTitles(p);checkAch();
}else if(battle.playerHp<=0){
battle.over=true;
const p=battle.player;
battle.enemy.wins=(battle.enemy.wins||0)+1;
p.losses=(p.losses||0)+1;
G.stats.fights++;G.stats.losses=(G.stats.losses||0)+1;
G.stats.arenaStreak=0;
p.hp=clamp(p.hp-8,0,100);
const rk=rankOf(getArenaPts());
const loss=rk.lose;
addArenaPts(loss);
addBattleLog('sys','💀 你输了... 段位'+loss);
sfxLose();
}
}
function checkFightLevel(b){
const need=b.fightLv*120;let up=false;
while(b.fightExp>=need){b.fightExp-=need;b.fightLv++;b.atkBonus+=1;b.defBonus+=1;b.hpBonus+=3;up=true}
if(up){toast(b.name+' 斗虫等级提升 Lv.'+b.fightLv,'#f0b72f');sfxLevel()}
}
function checkTitles(b){
if(!b.title&&b.wins>=10){b.title='虫王';toast(b.name+' 获得称号「虫王」','#f0b72f')}
else if(b.title==='虫王'&&b.wins>=30){b.title='斗神';toast(b.name+' 获得称号「斗神」','#f0b72f')}
}
function renderArena(v){
v=v||document.getElementById('view');
const pts=getArenaPts();const rk=rankOf(pts);const nr=nextRank(pts);
if(!battle){
const list=[];
G.tanks.forEach(t=>t.bugs.forEach(b=>{if(b.alive&&b.mature)list.push(b)}));
const prog=nr?Math.round((pts-rk.min)/(nr.min-rk.min)*100):100;
let html='<div class="arena-header"><div class="arena-rank-icon">'+rk.icon+'</div><div class="arena-rank-name" style="color:'+rk.c+'">'+rk.n+'</div><div class="arena-rank-pts">'+pts+' 分'+(nr?' · 距 '+nr.n+' 还需 '+(nr.min-pts)+' 分':' · 最高段位')+'</div><div class="rank-prog"><i style="width:'+prog+'%"></i></div><div class="arena-rank-desc">胜利 +'+rk.win+' · 失败 '+rk.lose+' · 连胜加成</div></div>';
html+='<div class="card"><div class="card-title">⚔️ 选择出战虫</div>'+
(list.length?list.map(b=>{
const sp=SPECIES[b.sp];if(!sp)return'';
const col=bugColor(b);
return '<div class="row click" data-fight="'+b.id+'"><span class="row-label" style="color:'+col+'">'+b.name+' · '+sp.n+' · Lv.'+(b.fightLv||1)+(b.title?' · '+b.title:'')+'</span><b>⚔️</b></div>';
}).join(''):'<div class="empty-note">没有可出战的成熟虫</div>')+'</div>';
html+='<div class="card"><div class="card-title">📊 战绩</div>'+
'<div class="row"><span class="row-label">总场次</span><b>'+G.stats.fights+'</b></div>'+
'<div class="row"><span class="row-label">胜场</span><b style="color:#3fb950">'+G.stats.wins+'</b></div>'+
'<div class="row"><span class="row-label">败场</span><b style="color:#f85149">'+(G.stats.losses||0)+'</b></div>'+
'<div class="row"><span class="row-label">胜率</span><b>'+(G.stats.fights?Math.round(G.stats.wins/G.stats.fights*100):0)+'%</b></div>'+
'<div class="row"><span class="row-label">当前连胜</span><b style="color:#f0b72f">'+(G.stats.arenaStreak||0)+'</b></div>'+
'<div class="row"><span class="row-label">最高连胜</span><b style="color:#f0b72f">'+(G.stats.arenaBestStreak||0)+'</b></div></div>';
html+='<div class="card"><div class="card-title">🏅 段位进度</div>';
RANKS.forEach((r,i)=>{
const cur=rankIndex(pts)===i;
html+='<div class="row" style="'+(cur?'border-color:'+r.c+';background:'+rgba(r.c,.08):'')+'"><span class="row-label">'+r.icon+' '+r.n+'</span><b style="color:'+(cur?r.c:'#7d8590')+'">'+r.min+'分'+(cur?' · 当前':'')+'</b></div>';
});
html+='</div>';
v.innerHTML='<div class="arena">'+html+'</div>';
v.querySelectorAll('[data-fight]').forEach(r=>{
r.onclick=function(){
sfxClick();
const b=findAnyBug(x=>x.id===+r.dataset.fight);if(!b)return;
const pool=[];
G.tanks.forEach(t=>t.bugs.forEach(x=>{if(x!==b&&x.alive&&x.mature)pool.push(x)}));
let enemy;
if(pool.length)enemy=pick(pool);
else{
const keys=Object.keys(SPECIES);
const spId=pick(keys);
enemy=makeBug(spId,{q:Math.min(RARITY.length-1,1+Math.floor(Math.random()*3))});
enemy.mature=true;enemy.growth=100;enemy.stage=SPECIES[spId].st.length-1;
enemy.fightLv=Math.max(1,b.fightLv||1);
enemy.name='野生'+SPECIES[spId].n;
}
startBattle(b,enemy);
};
});
return;
}
const pl=battle.player,en=battle.enemy;
const plCol=bugColor(pl),enCol=bugColor(en);
const plHpPct=battle.playerHp/battle.playerMaxHp;
const enHpPct=battle.enemyHp/battle.enemyMaxHp;
let logHtml='';battle.log.slice(-16).forEach(l=>{logHtml+='<div class="'+l.t+'">'+l.m+'</div>'});
let skillsHtml='';
if(!battle.over){
pl.skills.forEach(skId=>{
const sk=SKILLS[skId];if(!sk)return;
const cd=battle.playerCd[skId]||0;
const dis=cd>0||battle.animating;
skillsHtml+='<button class="skill-btn'+(cd>0?' cd':'')+'" data-skill="'+skId+'" '+(dis?'disabled':'')+'><div class="sn">'+sk.icon+' '+sk.n+'</div><div class="sd">'+(sk.dmg>0?'伤害×'+sk.dmg:'辅助')+' · CD'+sk.cd+'</div>'+(cd>0?'<div class="sc">CD '+cd+'</div>':'')+'</button>';
});
}
v.innerHTML='<div class="arena">'+
'<div class="arena-title">⚔️ 斗虫场</div>'+
'<div class="arena-sub">第 '+battle.turn+' 回合</div>'+
'<div class="fighter-row">'+
'<div class="fighter player'+(battle.turn%2===1&&!battle.over?' active':'')+'"><div class="fighter-circle" style="border:2px solid '+plCol+';background:radial-gradient(circle at 34% 28%,'+rgba(plCol,.4)+',#0f141a 72%);color:'+plCol+'">'+SPECIES[pl.sp].n+'</div><div class="fighter-name">'+pl.name+'</div><div class="fighter-sp">Lv.'+(pl.fightLv||1)+' · '+RARITY[pl.q].n+'</div><div class="fighter-hp"><i style="width:'+(plHpPct*100)+'%;background:'+(plHpPct>.5?'#3fb950':plHpPct>.25?'#f0b72f':'#f85149')+'"></i></div><div class="fighter-hpt">'+battle.playerHp+' / '+battle.playerMaxHp+'</div></div>'+
'<div class="vs-badge">VS</div>'+
'<div class="fighter enemy'+(battle.turn%2===0&&!battle.over?' active':'')+'"><div class="fighter-circle" style="border:2px solid '+enCol+';background:radial-gradient(circle at 34% 28%,'+rgba(enCol,.4)+',#0f141a 72%);color:'+enCol+'">'+SPECIES[en.sp].n+'</div><div class="fighter-name">'+en.name+'</div><div class="fighter-sp">Lv.'+(en.fightLv||1)+' · '+RARITY[en.q].n+'</div><div class="fighter-hp"><i style="width:'+(enHpPct*100)+'%;background:'+(enHpPct>.5?'#3fb950':enHpPct>.25?'#f0b72f':'#f85149')+'"></i></div><div class="fighter-hpt">'+battle.enemyHp+' / '+battle.enemyMaxHp+'</div></div></div>'+
'<div class="battle-log" id="battleLog">'+logHtml+'</div>'+
(battle.over?'<div class="act-row"><button class="act wide gold" id="rematch">⚔️ 再战一场</button><button class="act wide" id="backArena">返回</button></div>':'<div class="skill-bar">'+skillsHtml+'</div>')+
'</div>';
const logEl=document.getElementById('battleLog');if(logEl)logEl.scrollTop=logEl.scrollHeight;
v.querySelectorAll('[data-skill]').forEach(btn=>{btn.onclick=function(){playerUseSkill(btn.dataset.skill)}});
if(battle.over){
const rb=document.getElementById('rematch'),ba=document.getElementById('backArena');
if(rb)rb.onclick=function(){sfxClick();battle=null;renderArena()};
if(ba)ba.onclick=function(){sfxClick();battle=null;render()};
}
}

/* ================= 教程 ================= */
let tutStep=0;
function showTutorial(){tutStep=0;document.getElementById('tutOverlay').classList.add('open');renderTut()}
function renderTut(){
const t=TUTS[tutStep];
document.getElementById('tutStep').textContent='第 '+(tutStep+1)+' / '+TUTS.length+' 步';
document.getElementById('tutTitle').textContent=t.t;
document.getElementById('tutText').textContent=t.x;
const dots=document.getElementById('tutDots');dots.innerHTML='';
TUTS.forEach((_,i)=>{const d=document.createElement('div');d.className='tut-dot'+(i===tutStep?' on':'');dots.appendChild(d)});
document.getElementById('tutNext').textContent=tutStep===TUTS.length-1?'开始游戏':'下一步';
}

/* ================= UI 绑定 ================= */
function bindUI(){
document.getElementById('hudFeed').onclick=function(){
sfxBuy();
if(G.coins<FOOD_BUY_COST){toast('金币不足','#f85149');return}
G.coins-=FOOD_BUY_COST;G.food=Math.min(foodCap(),G.food+FOOD_BUY_GAIN);
toast('饲料 +'+FOOD_BUY_GAIN,'#3fb950');renderHUD();
};
document.getElementById('hudSound').onclick=function(){
soundOn=!soundOn;
document.getElementById('hudSound').textContent=soundOn?'🔊':'🔇';
toast(soundOn?'音效开启':'音效关闭','#58a6ff');
if(soundOn)sfxClick();
};
document.getElementById('tutNext').onclick=function(){
sfxClick();
if(tutStep<TUTS.length-1){tutStep++;renderTut()}
else{document.getElementById('tutOverlay').classList.remove('open');G.tutorialDone=true;save()}
};
document.getElementById('tutSkip').onclick=function(){
sfxClick();
document.getElementById('tutOverlay').classList.remove('open');
G.tutorialDone=true;save();
};
document.getElementById('catchClose').onclick=function(){sfxClick();closeCatch()};
document.getElementById('waterClose').onclick=function(){sfxClick();closeWaterArea()};
document.getElementById('qteBtn').onclick=function(){qteClick()};
document.querySelectorAll('.tab').forEach(t=>{
t.onclick=function(){
sfxClick();
document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
t.classList.add('on');
G.view=t.dataset.v;
battle=null;closeModal();render();
};
});
initMapDrag();
}

/* ================= 初始化 ================= */
function init(){
const loaded=load();
if(!loaded){
G.tanks=[makeTank(0,'一号缸'),makeTank(1,'二号缸'),makeTank(2,'三号缸')];
G.waterTanks=[makeWaterTank(0,'水缸一号'),makeWaterTank(1,'水缸二号'),makeWaterTank(2,'水缸三号')];
G.tanks[0].bugs.push(makeBug('ant'));
G.tanks[0].bugs.push(makeBug('mealworm'));
rollMarket();genOrders();
}
if(!G.waterTanks.length)G.waterTanks=[makeWaterTank(0,'水缸一号'),makeWaterTank(1,'水缸二号'),makeWaterTank(2,'水缸三号')];

G.tanks.forEach(t=>{
if(!t.upgrades)t.upgrades={};
if(!t.bugs)t.bugs=[];
if(t.capacity===undefined)t.capacity=5;
if(t.cleanliness===undefined)t.cleanliness=100;
if(t.light===undefined)t.light=0.5;
if(!t.substrate)t.substrate='soil';
t.bugs.forEach(b=>{
if(!b.name)b.name=genName();
if(!b.genes)b.genes={speed:1,appetite:1,hardiness:1};
if(b.x===undefined)b.x=rand(0.15,0.85);
if(b.y===undefined)b.y=rand(0.2,0.7);
if(b.vx===undefined)b.vx=0;
if(b.vy===undefined)b.vy=0;
if(b.wander===undefined)b.wander=0;
if(b.flashUntil===undefined)b.flashUntil=0;
if(b.age===undefined)b.age=0;
if(b.mood===undefined)b.mood=75;
if(b.fightLv===undefined)b.fightLv=1;
if(b.fightExp===undefined)b.fightExp=0;
if(b.wins===undefined)b.wins=0;
if(b.losses===undefined)b.losses=0;
if(!b.skills)b.skills=(SP_SKILLS[b.sp]||['jab','guard','rush','heavy']).slice();
if(b.atkBonus===undefined)b.atkBonus=0;
if(b.defBonus===undefined)b.defBonus=0;
if(b.hpBonus===undefined)b.hpBonus=0;
if(b.title===undefined)b.title=null;
b.type='bug';
});
});

G.waterTanks.forEach(t=>{
if(!t.upgrades)t.upgrades={};
if(!t.fish)t.fish=[];
if(t.capacity===undefined)t.capacity=4;
if(!t.substrate)t.substrate='water';
if(t.temp===undefined)t.temp=25;
if(t.hum===undefined)t.hum=70;
t.fish.forEach(f=>{
if(!f.name)f.name=genName();
if(f.x===undefined)f.x=rand(0.15,0.85);
if(f.y===undefined)f.y=rand(0.2,0.7);
if(f.vx===undefined)f.vx=0;
if(f.vy===undefined)f.vy=0;
if(f.wander===undefined)f.wander=0;
if(f.flashUntil===undefined)f.flashUntil=0;
if(f.age===undefined)f.age=0;
f.type='fish';
});
});

if(!G.market||!Object.keys(G.market).length)rollMarket();
if(!G.orders||!G.orders.length)genOrders();

bindUI();
render();
requestAnimationFrame(loop);

setInterval(()=>{save();if(G.view==='tanks')renderHUD()},5000);
document.addEventListener('visibilitychange',()=>{
if(document.hidden)save();
else lastT=performance.now();
});
window.addEventListener('beforeunload',save);
}

const hasSave=!!localStorage.getItem(SAVE_KEY);
if(hasSave){
document.getElementById('diffScreen').style.display='none';
document.getElementById('app').style.display='block';
document.getElementById('tabbar').style.display='flex';
init();
}else{
document.querySelectorAll('.diff-btn').forEach(btn=>{
btn.onclick=function(){
sfxClick();
G.difficulty=btn.dataset.diff;
G.coins=DIFFS[G.difficulty].startCoins;
G.food=DIFFS[G.difficulty].startFood;
document.getElementById('diffScreen').style.display='none';
document.getElementById('app').style.display='block';
document.getElementById('tabbar').style.display='flex';
init();
setTimeout(showTutorial,300);
};
});
}
</script>
