<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的笔记本</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #fff;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #333;
            min-height: 100vh;
            overflow-x: hidden;
        }
        /* 全局遮罩，保证在背景图上文字依然清晰 */
        .overlay-mask {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.7);
            z-index: -1;
            pointer-events: none;
            transition: background 0.3s;
        }

        .container { max-width: 900px; margin: 0 auto; padding: 20px; position: relative; z-index: 10; }
        
        /* 顶部导航 */
        .top-bar {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 20px; padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.08);
        }
        .top-title { font-size: 2rem; font-weight: 700; color: #333; }
        .top-actions { display: flex; gap: 10px; align-items: center; }

        /* 视图切换 */
        .view-toggle { display: flex; gap: 5px; background: rgba(255,255,255,0.8); border-radius: 8px; padding: 4px; }
        .view-btn { border: none; background: transparent; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; color: #666; }
        .view-btn.active { background: #fff; color: #333; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* 设置入口 */
        .settings-btn { background: rgba(255,255,255,0.8); border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; font-size: 1.2rem; }

        /* 本子卡片 */
        .grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .list-view { display: flex; flex-direction: column; gap: 10px; }
        .notebook {
            background: rgba(255,255,255,0.9);
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .list-view .notebook { display: flex; align-items: center; justify-content: space-between; }
        .notebook:hover { border-color: #888; }
        .notebook h3 { font-size: 1.2rem; margin-bottom: 5px; color: #222; word-break: break-all; }
        .notebook p { color: #999; font-size: 0.85rem; }
        .list-view .notebook h3 { margin: 0; }

        /* 页面卡片 */
        .pages-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .pages-list { display: flex; flex-direction: column; gap: 10px; }
        .page {
            background: rgba(255,255,255,0.9); border: 1px solid rgba(0,0,0,0.08); border-radius: 10px;
            padding: 15px; cursor: pointer; transition: all 0.2s;
        }
        .pages-list .page { display: flex; align-items: center; justify-content: space-between; }
        .page:hover { border-color: #888; }
        .page h4 { font-size: 1rem; margin-bottom: 4px; color: #444; }
        .page p { color: #aaa; font-size: 0.85rem; word-break: break-all; }
        .pages-list .page h4 { margin: 0; }
        .pages-list .page p { margin: 0; }

        /* 编辑器 */
        #page-view { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.97); z-index: 100; display: flex; flex-direction: column; }
        .editor-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid #f0f0f0; }
        .editor-header .btn-icon { background: transparent; border: none; cursor: pointer; font-size: 1.2rem; color: #666; padding: 5px; }
        .editor-meta { padding: 20px 20px 10px; }
        .editor-title-input { width: 100%; border: none; outline: none; font-size: 2rem; font-weight: 700; color: #222; margin-bottom: 10px; }
        .editor-meta-info { display: flex; align-items: center; gap: 10px; color: #888; font-size: 0.85rem; }
        .tag-btn { background: #f0f0f0; border: none; border-radius: 15px; padding: 5px 12px; font-size: 0.8rem; color: #666; cursor: pointer; }
        .editor-body { flex: 1; padding: 0 20px; }
        textarea { width: 100%; height: 100%; border: none; outline: none; font-size: 1.1rem; line-height: 1.7; color: #333; resize: none; font-family: inherit; background: transparent; }
        .editor-footer { padding: 15px 20px; border-top: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
        .editor-footer .btn { padding: 10px 20px; border-radius: 8px; font-size: 0.95rem; cursor: pointer; border: none; }
        .btn-save { background: #333; color: #fff; }
        .btn-export { background: #f5f5f5; color: #333; }
        .hidden { display: none !important; }
        .warning { background: #fff3f3; border: 1px solid #ffd6d6; color: #d33; padding: 10px; border-radius: 6px; margin-top: 10px; font-size: 0.85rem; }
        .back-btn { color: #555; text-decoration: none; font-size: 0.9rem; padding: 8px; border-radius: 6px; }

        /* 设置弹窗 */
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 200; display: flex; justify-content: center; align-items: center; }
        .modal-content { background: #fff; border-radius: 15px; padding: 20px; width: 90%; max-width: 400px; }
        .modal-content h3 { margin-bottom: 15px; }
        .modal-content label { display: block; margin-top: 10px; margin-bottom: 5px; font-size: 0.9rem; color: #555; }
        .modal-content input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; }
        .modal-content input[type="range"] { width: 100%; }
        .modal-content .btn-row { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
        .modal-content .btn-row button { padding: 8px 15px; border-radius: 6px; border: 1px solid #ccc; background: #fff; cursor: pointer; }

        /* 横屏模式适配 */
        @media (orientation: landscape) {
            .container { max-width: 100%; padding: 10px 20px; }
            .top-bar { margin-bottom: 10px; padding: 5px 0; }
            .top-title { font-size: 1.5rem; }
            .grid-view { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
            .editor-meta { padding: 10px 20px 5px; }
            .editor-title-input { font-size: 1.5rem; margin-bottom: 5px; }
            .editor-body { padding: 0 20px; }
            textarea { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="overlay-mask" id="overlayMask"></div>
    <div class="container">
        <!-- 主页 -->
        <div id="home-view">
            <div class="top-bar">
                <div class="top-title">📒 我的笔记本</div>
                <div class="top-actions">
                    <div class="view-toggle">
                        <button class="view-btn active" onclick="toggleNotebookView('grid')">宫格</button>
                        <button class="view-btn" onclick="toggleNotebookView('list')">列表</button>
                    </div>
                    <button class="settings-btn" onclick="openSettings()">⚙️</button>
                </div>
            </div>
            <div id="notebook-list" class="grid-view"></div>
        </div>

        <!-- 本子内部 -->
        <div id="notebook-view" class="hidden">
            <div class="top-bar">
                <a href="#" class="back-btn" onclick="showHome()">← 返回</a>
                <div class="top-title" id="notebook-title"></div>
                <div class="view-toggle">
                    <button class="view-btn active" onclick="togglePageView('grid')">宫格</button>
                    <button class="view-btn" onclick="togglePageView('list')">列表</button>
                </div>
            </div>
            <div id="page-list" class="pages-grid"></div>
            <button class="btn btn-export" style="padding: 10px 20px; border-radius: 8px; background: rgba(255,255,255,0.9); border: 1px solid #ddd;" onclick="exportNotebookTxt()">📥 导出整个本子</button>
        </div>

        <!-- 编辑页面 -->
        <div id="page-view" class="hidden">
            <div class="editor-header">
                <button class="btn-icon" onclick="showNotebook()">←</button>
                <div>
                    <button class="btn-icon" onclick="exportPageTxt()">📤</button>
                    <button class="btn-icon" onclick="savePage()">✓</button>
                </div>
            </div>
            <div class="editor-meta">
                <input type="text" class="editor-title-input" id="page-title" placeholder="标题" value="无标题">
                <div class="editor-meta-info">
                    <span id="page-date">今天 12:41</span>
                    <button class="tag-btn">未分类 ▼</button>
                </div>
            </div>
            <div class="editor-body">
                <textarea id="page-content" placeholder="开始输入..."></textarea>
            </div>
            <div class="editor-footer">
                <button class="btn btn-export" onclick="exportPageTxt()">📥 导出</button>
                <button class="btn btn-save" onclick="savePage()">保存</button>
            </div>
            <div class="warning" id="line-warning" style="display:none; margin: 20px;">⚠️ 内容超过500行，请精简后保存！</div>
        </div>
    </div>

    <!-- 设置弹窗 -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <h3>页面设置</h3>
            
            <label for="bg-upload">背景图片（从相册选择）</label>
            <input type="file" id="bg-upload" accept="image/*" style="margin-bottom: 10px;" onchange="handleBgUpload(event)">
            
            <label for="bg-opacity">遮罩透明度（调大更清晰）</label>
            <input type="range" id="bg-opacity" min="0" max="90" value="70" oninput="updateOverlay()">
            
            <label>页面背景风格</label>
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <button onclick="setBgColor('#ffffff')" style="background:#fff; border:1px solid #ddd; padding:8px 15px;">纯白</button>
                <button onclick="setBgColor('#f5f5f5')" style="background:#f5f5f5; border:1px solid #ddd; padding:8px 15px;">浅灰</button>
                <button onclick="clearBgImage()" style="background:#eee; border:1px solid #ddd; padding:8px 15px;">清除图片</button>
            </div>

            <div class="btn-row">
                <button onclick="closeSettings()">取消</button>
                <button onclick="saveSettings()" style="background: #333; color: #fff; border: none;">保存</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'my_notes_app'; // 保持不变，原有数据不丢失
        let state = { currentNotebook: 0, currentPage: 0, nbView: 'grid', pgView: 'grid' };

        function loadData() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : { notebooks: Array.from({ length: 5 }, (_, i) => ({ name: `本子${i + 1}`, pages: Array.from({ length: 5 }, () => '') })) };
        }

        function saveData(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

        /* 视图切换 */
        function toggleNotebookView(view) {
            state.nbView = view;
            document.getElementById('notebook-list').className = view === 'grid' ? 'grid-view' : 'list-view';
            const btns = document.querySelectorAll('.view-toggle')[0].querySelectorAll('.view-btn');
            btns[0].classList.toggle('active', view === 'grid');
            btns[1].classList.toggle('active', view === 'list');
        }

        function togglePageView(view) {
            state.pgView = view;
            document.getElementById('page-list').className = view === 'grid' ? 'pages-grid' : 'pages-list';
            const btns = document.querySelectorAll('.view-toggle')[1].querySelectorAll('.view-btn');
            btns[0].classList.toggle('active', view === 'grid');
            btns[1].classList.toggle('active', view === 'list');
        }

        /* 页面跳转 */
        function showHome() {
            document.getElementById('home-view').classList.remove('hidden');
            document.getElementById('notebook-view').classList.add('hidden');
            document.getElementById('page-view').classList.add('hidden');
            renderNotebooks();
        }
        function showNotebook() {
            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('notebook-view').classList.remove('hidden');
            document.getElementById('page-view').classList.add('hidden');
            renderPages();
        }
        function showPage() {
            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('notebook-view').classList.add('hidden');
            document.getElementById('page-view').classList.remove('hidden');
            renderPage();
        }

        /* 渲染 */
        function renderNotebooks() {
            const data = loadData();
            const list = document.getElementById('notebook-list');
            list.innerHTML = '';
            data.notebooks.forEach((nb, idx) => {
                list.innerHTML += `<div class="notebook" onclick="selectNotebook(${idx})" oncontextmenu="renameNotebook(${idx}); return false;">
                    <div>
                        <h3>📘 ${nb.name}</h3>
                        <p>${nb.pages.filter(p => p.trim() !== '').length} / 5 页已写</p>
                    </div>
                    <span style="font-size: 1.2rem; color: #ccc;">›</span>
                </div>`;
            });
        }
        function renderPages() {
            const data = loadData();
            const nb = data.notebooks[state.currentNotebook];
            document.getElementById('notebook-title').textContent = nb.name;
            const list = document.getElementById('page-list');
            list.innerHTML = '';
            nb.pages.forEach((p, idx) => {
                const preview = p.trim() ? p.substring(0, 20) + (p.length > 20 ? '...' : '') : '空页';
                list.innerHTML += `<div class="page" onclick="selectPage(${idx})">
                    <div>
                        <h4>第 ${idx + 1} 页</h4>
                        <p>${preview}</p>
                    </div>
                    <span style="font-size: 1.2rem; color: #ccc;">›</span>
                </div>`;
            });
        }
        function renderPage() {
            const data = loadData();
            const p = data.notebooks[state.currentNotebook].pages[state.currentPage];
            document.getElementById('page-title').value = `${data.notebooks[state.currentNotebook].name} 第${state.currentPage + 1}页`;
            document.getElementById('page-date').textContent = '今天 12:41';
            document.getElementById('page-content').value = p;
            document.getElementById('line-warning').style.display = 'none';
        }

        function selectNotebook(idx) { state.currentNotebook = idx; showNotebook(); }
        function selectPage(idx) { state.currentPage = idx; showPage(); }

        /* 自定义本子名（长按/双击触发） */
        function renameNotebook(idx) {
            const newName = prompt('请输入新的本子名称：', loadData().notebooks[idx].name);
            if (newName && newName.trim()) {
                const data = loadData();
                data.notebooks[idx].name = newName.trim();
                saveData(data);
                renderNotebooks();
                alert('本子名称已修改！');
            }
        }

        /* 保存与导出 */
        function savePage() {
            const content = document.getElementById('page-content').value;
            const lines = content.split('\n').length;
            if (lines > 500) {
                document.getElementById('line-warning').style.display = 'block';
                return;
            }
            const data = loadData();
            data.notebooks[state.currentNotebook].pages[state.currentPage] = content;
            saveData(data);
            alert('保存成功！');
            showNotebook();
        }
        function exportPageTxt() {
            const data = loadData();
            const content = data.notebooks[state.currentNotebook].pages[state.currentPage];
            exportFile(content, `${data.notebooks[state.currentNotebook].name}-第${state.currentPage + 1}页.txt`);
        }
        function exportNotebookTxt() {
            const data = loadData();
            const nb = data.notebooks[state.currentNotebook];
            let content = `【${nb.name}】\n\n`;
            nb.pages.forEach((p, idx) => {
                content += `—— 第${idx + 1}页 ——\n${p}\n\n`;
            });
            exportFile(content, `${nb.name}.txt`);
        }
        function exportFile(content, filename) {
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename; a.click();
            URL.revokeObjectURL(url);
        }

        /* 背景图与设置 */
        function openSettings() { document.getElementById('settings-modal').classList.remove('hidden'); }
        function closeSettings() { document.getElementById('settings-modal').classList.add('hidden'); }

        function handleBgUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.body.style.backgroundImage = `url(${e.target.result})`;
                    localStorage.setItem('bg_image', e.target.result);
                };
                reader.readAsDataURL(file);
            }
        }
        function updateOverlay() {
            const val = document.getElementById('bg-opacity').value;
            document.getElementById('overlayMask').style.background = `rgba(255, 255, 255, ${val / 100})`;
        }
        function setBgColor(color) {
            document.body.style.backgroundImage = 'none';
            document.body.style.backgroundColor = color;
            localStorage.setItem('bg_color', color);
            localStorage.removeItem('bg_image');
        }
        function clearBgImage() {
            document.body.style.backgroundImage = 'none';
            localStorage.removeItem('bg_image');
        }
        function saveSettings() {
            localStorage.setItem('bg_opacity', document.getElementById('bg-opacity').value);
            closeSettings();
            alert('设置已保存！');
        }

        /* 初始化读取设置 */
        function loadSettings() {
            if (localStorage.getItem('bg_image')) {
                document.body.style.backgroundImage = `url(${localStorage.getItem('bg_image')})`;
            }
            if (localStorage.getItem('bg_color')) {
                document.body.style.backgroundColor = localStorage.getItem('bg_color');
            }
            if (localStorage.getItem('bg_opacity')) {
                document.getElementById('bg-opacity').value = localStorage.getItem('bg_opacity');
                updateOverlay();
            }
        }

        showHome();
        loadSettings();
    </script>
</body>
</html>
